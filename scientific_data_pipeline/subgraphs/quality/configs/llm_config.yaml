# ==========================================================
# llm_config.yaml
# LLM API 配置
#
# 支持 OpenAI 兼容接口（OpenAI / DeepSeek / 本地模型等）
# ==========================================================

# 模型名称（可通过环境变量 DEFAULT_MODEL 覆盖）
model: "qwen3.7-plus"

# API Key（也可通过环境变量 OPENAI_API_KEY 覆盖）
api_key: ""

# API Base URL（OpenAI 官方可留空；DeepSeek / Qwen 等第三方需填写）
# 示例: https://api.deepseek.com/v1 (DeepSeek)
#       https://dashscope.aliyuncs.com/compatible-mode/v1 (Qwen)
base_url: ""

# 请求参数
temperature: 0.0          # 温度（0-2），科学数据处理建议 0.0 以获得确定性输出
max_tokens: 8096          # 最大输出 token 数
timeout: 120              # 请求超时秒数
max_retries: 3            # 最大重试次数

# 结构化输出策略: "auto"(自动探测) / "function_calling" / "json_schema" / "prompt_parsing"
# DeepSeek 等非 OpenAI 模型建议设为 "prompt_parsing" 避免两次 400 浪费
structured_output_method: "prompt_parsing"

# 结构化输出 Schema 名称前缀
schema_prefix: "quality_pipeline"
