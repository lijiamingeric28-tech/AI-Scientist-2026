    - name: "stellar_radius"
      aliases: ["radius", "R", "R_star", "R_sun", "Rsun", "R☉", "stellar_radius", "radius_star"]
      standard_unit: "Rsun"
      criticality: "important"
      semantic_type: "stellar_radius"
