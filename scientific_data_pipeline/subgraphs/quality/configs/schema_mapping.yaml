    - name: "proper_motion_dec"
      aliases: ["pm_dec", "pmdec", "μ_δ", "mu_delta", "PM_Dec", "pmdec_corr", "pmdec_error"]
      standard_unit: "mas/yr"
      criticality: "important"
      semantic_type: "proper_motion_dec"
      description: "Proper motion in Declination"

    - name: "distance"
      aliases: ["d", "dist", "D", "distance_pc", "heliocentric_distance", "dist_pc", "dist_kpc"]
      standard_unit: "pc"
      criticality: "critical"
      semantic_type: "distance"
      description: "Distance"

    - name: "age"
      aliases: ["t", "tau", "stellar_age", "age_gyr", "age_Gyr", "lifetime", "age_myr"]
      standard_unit: "Gyr"
      criticality: "auxiliary"
      semantic_type: "age"
      description: "Stellar/system age"

    - name: "extinction"
      aliases: ["A_V", "Av", "E_BV", "E(B-V)", "reddening", "A_K", "extinction_Av", "interstellar_extinction"]
      standard_unit: "mag"
      criticality: "auxiliary"
      semantic_type: "extinction"
