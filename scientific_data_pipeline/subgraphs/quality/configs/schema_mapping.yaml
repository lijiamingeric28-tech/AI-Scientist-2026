    - name: "stellar_mass"
      aliases: ["mass", "M", "M_star", "M_sun", "Msun", "M☉", "stellar_mass", "mass_star"]
      standard_unit: "Msun"
      criticality: "important"
      semantic_type: "stellar_mass"
