# ==========================================================
# quality_rules.yaml — 材料科学领域完整配置
# ==========================================================

# ── 缺失值规则 ──
missing_value:
  max_missing_rate: 0.30
  default_strategy: "mark"   # mark / drop / fill_default

# ── 重复数据规则 ──
duplicate:
  exact_match: true
  fuzzy_match: true
  fuzzy_threshold: 0.95

# ── 一致性规则 ──
consistency:
  check_schema_alignment: true
  check_data_types: true
  check_unit_consistency: true

# ── 格式规则 ──
format:
  check_numeric_format: true
  check_date_format: false
  allowed_numeric_prefixes: ["~", "≈", "<", ">", "≤", "≥"]
  allowed_numeric_suffixes: ["(typical)", "(nominal)", "(approx)", "(maximum)", "(minimum)"]
  max_string_length: 500

# ── 来源可信度规则 ──
source_reliability:
  enabled: true
  priority_threshold: 0.5
  # 材料科学期刊分级 (影响 source_checker 评分)
  journal_tiers:
    tier1:  # IF > 7
      - "Acta Materialia"
      - "International Journal of Plasticity"
      - "Journal of the Mechanics and Physics of Solids"
    tier2:  # IF 3-7
      - "Materials Science and Engineering: A"
      - "Metallurgical and Materials Transactions A"
      - "Scripta Materialia"
      - "Materials & Design"
      - "Journal of Materials Science"
      - "International Journal of Fatigue"
      - "Engineering Fracture Mechanics"
    tier3:  # IF 1-3
      - "Journal of Alloys and Compounds"
      - "Materials Characterization"
      - "Materials Science and Technology"
    tier1_score: 1.0
    tier2_score: 0.85
    tier3_score: 0.70
    unknown_score: 0.60
  # recency 退化系数 (年)
  recency_halflife_years: 8
  recency_max_age_years: 30

# ── 冲突检测规则 ──
conflict_detection:
  numeric_diff_threshold: 0.20
  cross_source_check: true
  # Cohen's d 统计方法
  statistical_method:
    enabled: true
    cohens_d_threshold: 0.5        # |d| >= 0.5 → medium conflict
    confidence_interval_alpha: 0.05  # 95% CI
    min_samples_per_group: 2       # 每组最少样本量

# ── 质量评分规则 ──
quality_scoring:
  weights:
    completeness: 0.25
    consistency: 0.30
    format: 0.10
    source_reliability: 0.15
    conflict_risk: 0.20
  levels:
    excellent: 0.90
    good: 0.75
    fair: 0.60
    poor: 0.40

# ── 循环控制规则 ──
loop_control:
  max_iterations: 3
  no_new_conflict_rounds: 1

# ── V2.0 自适应阈值 ──
adaptive_thresholds:
  enabled: true
  field_criticality:
    critical_fields:
      - "yield_strength"
      - "tensile_strength"
      - "temperature"
      - "strain_rate"
      - "density"
      - "material"
    important_fields:
      - "elongation"
      - "hardness"
      - "fatigue_life"
      - "fracture_toughness"
      - "thermal_conductivity"
    auxiliary_fields:
      - "journal"
      - "authors"
      - "access_path"
      - "retrieval_priority"
      - "doi"
    critical_completeness: 0.95
    important_completeness: 0.90
    auxiliary_completeness: 0.70
    critical_conflict: 0.10
    important_conflict: 0.15
    auxiliary_conflict: 0.30
  sample_size:
    small_n: 10
    large_n: 100
    small_n_multiplier: 0.85
    large_n_multiplier: 1.0
  domain_tightness:
    materials_science: "precise"
    astrophysics: "exploratory"
    biology: "normal"
    chemistry: "precise"
    default: "normal"
    precise_multiplier: 0.80
    normal_multiplier: 1.00
    exploratory_multiplier: 1.30

# ── V2.0 领域自适应权重 ──
domain_weights:
  materials_science:
    completeness: 0.30
    consistency: 0.30
    format: 0.05
    source_reliability: 0.15
    conflict_risk: 0.20
  astrophysics:
    completeness: 0.15
    consistency: 0.20
    format: 0.10
    source_reliability: 0.30
    conflict_risk: 0.25
  chemistry:
    completeness: 0.25
    consistency: 0.25
    format: 0.15
    source_reliability: 0.15
    conflict_risk: 0.20
  biology:
    completeness: 0.20
    consistency: 0.25
    format: 0.15
    source_reliability: 0.20
    conflict_risk: 0.20
  default:
    completeness: 0.25
    consistency: 0.30
    format: 0.10
    source_reliability: 0.15
    conflict_risk: 0.20

# ── V2.1 语义类型: 材料科学完整规则库 ──
semantic_types:
  temperature:
    keywords: ["temp", "temperature", "T"]
    units: ["°C", "C", "K", "F", "℃"]
    feasible_ranges:
      "°C": [-273.15, 6000]
      "C": [-273.15, 6000]
      "K": [0, 6273]
      "F": [-459.67, 10832]
      "℃": [-273.15, 6000]
    expected_in_study: "always"   # 材料力学测试必报

  mechanical_stress:
    keywords: ["strength", "stress", "yield", "tensile", "compressive", "ultimate", "fatigue_strength"]
    units: ["MPa", "GPa", "Pa", "psi", "ksi", "N/mm²"]
    feasible_ranges:
      "MPa": [0, 5000]
      "GPa": [0, 500]
      "Pa": [0, 5000000000]
      "psi": [0, 725000]
      "ksi": [0, 725]
    expected_in_study: "always"

  elongation:
    keywords: ["elongation", "strain", "elong", "EL", "ductility"]
    units: ["%", "mm/mm", "in/in", "fraction"]
    feasible_ranges:
      "%": [0, 100]
      "mm/mm": [0, 1.0]
      "fraction": [0, 1.0]
    expected_in_study: "usually"

  hardness:
    keywords: ["hardness", "HV", "HRC", "HB", "Vickers", "Brinell", "Rockwell", "microhardness"]
    units: ["HV", "HRC", "HB", "GPa", "MPa"]
    feasible_ranges:
      "HV": [1, 3000]
      "HRC": [0, 70]
      "HB": [1, 800]
      "GPa": [0.01, 30]
    expected_in_study: "usually"

  strain_rate:
    keywords: ["strain_rate", "strain rate", "rate", "ε_dot", "deformation_rate"]
    units: ["s^-1", "s⁻¹", "/s", "1/s", "s-1", "min^-1"]
    feasible_ranges:
      "s^-1": [1e-10, 1e8]
      "s⁻¹": [1e-10, 1e8]
      "min^-1": [1e-9, 1e9]
    expected_in_study: "conditional"  # 仅动态测试需要

  density:
    keywords: ["density", "rho", "ρ", "specific_weight"]
    units: ["g/cm^3", "g/cm³", "kg/m^3", "kg/m³", "lb/in³"]
    feasible_ranges:
      "g/cm^3": [0.5, 22.6]
      "g/cm³": [0.5, 22.6]
      "kg/m^3": [500, 22600]
      "kg/m³": [500, 22600]
    expected_in_study: "usually"

  thermal_conductivity:
    keywords: ["thermal_conductivity", "thermal conductivity", "k_thermal", "heat_conductivity"]
    units: ["W/mK", "W/(m·K)", "W/m·K", "W/cmK"]
    feasible_ranges:
      "W/mK": [0.01, 2500]
    expected_in_study: "optional"

  fatigue_life:
    keywords: ["fatigue", "cycles", "N_f", "fatigue_life", "cycles_to_failure"]
    units: ["cycles", "N", "log_cycles"]
    feasible_ranges:
      "cycles": [1, 1e10]
      "log_cycles": [0, 10]
    expected_in_study: "conditional"  # 仅疲劳研究需要

  fracture_toughness:
    keywords: ["fracture", "toughness", "K_IC", "KIC", "J_IC", "CTOD"]
    units: ["MPa√m", "MPa·m^0.5", "ksi√in", "kJ/m²"]
    feasible_ranges:
      "MPa√m": [0.1, 300]
      "MPa·m^0.5": [0.1, 300]
    expected_in_study: "conditional"  # 仅断裂研究需要

  grain_size:
    keywords: ["grain", "grain_size", "d_grain", "ASTM"]
    units: ["μm", "nm", "ASTM"]
    feasible_ranges:
      "μm": [0.01, 1000]
      "nm": [1, 10000]
    expected_in_study: "optional"

  material:
    keywords: ["material", "alloy", "composition", "sample", "specimen"]
    units: []   # 无单位 (字符串)
    feasible_ranges: {}
    expected_in_study: "always"

# ── V2.1 异常值检测参数 ──
outlier_detection:
  iqr_multiplier: 1.5        # IQR 法: Q1 - k*IQR, Q3 + k*IQR
  zscore_threshold: 3.5      # Modified Z-Score 阈值
  min_samples: 4             # 最少样本量 (少于则不检测)
  per_field_thresholds:      # per-field 特殊阈值
    temperature:
      iqr_multiplier: 2.0    # 温度变化大, 放宽
    elongation:
      iqr_multiplier: 1.5
    strain_rate:
      iqr_multiplier: 2.5    # 应变率跨数量级, 很宽

# ── V2.1 非线性惩罚参数 ──
nonlinear_penalties:
  systematic_failure:
    enabled: true
    multiplier: 0.7           # 任何维度得分=0 → overall×0.7
  concentration_penalty:
    enabled: true
    threshold: 0.5            # 单 source 集中 >50% issues → 减轻全局惩罚
  sparsity_penalty:
    enabled: true
    small_n: 10               # n<10 → log(n)/log(10) 因子
# ==========================================================
# quality_rules.yaml — 天体物理领域扩展配置
# 使用方法: 合并到 quality_rules.yaml 中, 或设置 research_domain=astrophysics
