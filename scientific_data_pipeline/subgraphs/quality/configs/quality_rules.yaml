# ── 天体物理领域权重 ──
domain_weights_astrophysics:
  astrophysics:
    completeness: 0.15
    consistency: 0.20
    format: 0.10
    source_reliability: 0.30
    conflict_risk: 0.25

# ── 天体物理期刊分级 ──
journal_tiers_astrophysics:
  tier1:
    - "Astrophysical Journal Letters"
    - "Astrophysical Journal Supplement Series"
    - "Annual Review of Astronomy and Astrophysics"
    - "Nature Astronomy"
    - "Astronomy and Astrophysics Review"
  tier2:
    - "Astrophysical Journal"
    - "Monthly Notices of the Royal Astronomical Society"
    - "Astronomy & Astrophysics"
    - "Astronomical Journal"
    - "Journal of Cosmology and Astroparticle Physics"
    - "Publications of the Astronomical Society of the Pacific"
    - "Icarus"
  tier3:
    - "Research in Astronomy and Astrophysics"
    - "New Astronomy"
    - "Astroparticle Physics"
    - "Experimental Astronomy"
    - "Advances in Space Research"
    - "Planetary and Space Science"
    - "Astronomische Nachrichten"
  tier1_score: 1.0
  tier2_score: 0.85
  tier3_score: 0.70
  unknown_score: 0.60

# ── 冲突裁决证据权重 (天体物理) ──
resolution_weights_astrophysics:
  astrophysics:
    source_reliability: 0.20
    domain_rules: 0.20
    statistical: 0.30
    contextual: 0.30

# ── 天体物理自适应阈值 ──
adaptive_thresholds_astrophysics:
  domain_tightness:
    astrophysics: "exploratory"
    exploratory_multiplier: 1.30  # 探索性科学, 阈值更宽松

# ── 天体物理实体提取正则 ──
entity_extraction_astrophysics:
  patterns:
    - '[A-Z][a-z]?[-\d][\w-]{1,20}'         # 通用标识符
    - 'SN\s*\d{4}[A-Za-z]*'                 # 超新星: SN 1987A
    - 'NGC\s*\d+'                            # NGC天体
    - 'IC\s*\d+'                             # IC天体
    - 'M\d{1,3}'                             # Messier天体
    - '(?:HD|HIP|TYC|Gaia\s*DR\d)\s*\d+'    # 星表编号
    - '(?:WASP|Kepler|K2|TESS|TOI)\s*[-\d]+[A-Za-z]?'  # 系外行星
    - '(?:SDSS|2MASS|WISE)\s*J\d+'           # 巡天编号

# ── 天体物理测量方法关键词 ──
measurement_methods_astrophysics:
  spectroscopy: ["spectroscopy", "spectrograph", "spectral", "R~", "resolution"]
  photometry: ["photometry", "photometric", "UBVRI", "ugriz", "magnitude"]
  astrometry: ["astrometry", "astrometric", "Gaia", "Hipparcos", "parallax"]
  interferometry: ["interferometry", "interferometer", "VLTI", "CHARA"]
  radial_velocity: ["radial velocity", "RV", "HARPS", "ESPRESSO", "CARMENES"]
  transit: ["transit", "TESS", "Kepler", "light curve", "eclipse"]
  imaging: ["imaging", "HST", "JWST", "VLT", "direct imaging"]
