# mypy 配置 — Phase 0 从非严格起步，逐文件加注释
[mypy]
python_version = 3.10
# 第三方库缺类型标注时静默（存量阶段不追求完整类型）
ignore_missing_imports = True
# 不检查未标注的函数体（存量代码大量未标注）
check_untyped_defs = False
# 允许隐式 Optional（存量大量 state.get 返回 None 用法）
implicit_optional = True

# 排除质量管线 legacy 与测试脚本（print-based 脚本不是 pytest）
exclude = (
    "quality_pipeline/Data_Conflict_agentV1/legacy/",
)
