# 并行检索子图配置文件
# 版本: 1.0.0
# 日期: 2026-07-29

# API配置
api:
  # NASA ADS API配置
  ads:
    token: ""  # 请在.env文件中设置 ADS_API_TOKEN
    timeout: 30
    max_retries: 3
    retry_backoff: 3  # 秒

  # Unpaywall API配置
  unpaywall:
    email: ""  # 请在.env文件中设置 UNPAYWALL_EMAIL
    timeout: 30
    max_workers: 10  # 并发查询数

  # VizieR配置
  vizier:
    server: "vizier.cfa.harvard.edu"
    timeout: 30
    row_limit: 10
    rate_limit_delay: 0.15  # 秒，每次查询后的等待时间

# 检索配置
retrieval:
  # SIMBAD配置
  simbad:
    max_retries: 3
    retry_backoff: 3  # 秒
    timeout: 30

  # 数据库查询配置
  database:
    total_catalogs: 22
    sequential_query: true  # 顺序查询（避免触发VizieR限流）

  # 论文检索配置
  papers:
    ads_max_papers: 50  # ADS最多检索论文数
    ads_sort: "score desc"  # 按相关性排序

    # PDF下载配置
    pdf_download:
      max_workers: 5  # 并发下载数
      timeout: 60  # 单个PDF下载超时（秒）
      max_file_size_mb: 50  # 最大PDF文件大小
      arxiv_max_workers: 3  # arXiv 直链并发上限（礼貌性限流）
      arxiv_delay: 1.0  # 每次 arXiv 请求间隔（秒）

  # 性能目标（秒）
  performance_targets:
    simbad: 5
    database_total: 30
    ads_search: 10
    unpaywall_batch: 15
    pdf_download_total: 60
    total: 90

# 日志配置
logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file:
    enabled: true
    path: "data/logs/subgraph2.log"
    max_bytes: 10485760  # 10MB
    backup_count: 5

# 输出配置
output:
  data_dir: "data"
  papers_dir: "data/papers"
  output_format: "json"
  save_intermediate_states: false  # 是否保存中间状态（调试用）

# 配置文件路径
config_files:
  catalog_config: "catalog/catalog_config.json"
  catalog_metadata: "catalog/catalog_metadata.json"
  catalog_units: "catalog/catalog_units.json"
