  content: '开普勒三定律: 椭圆轨道 (主星在焦点), 掠面速度守恒, 广义第三定律

    P^2 = 4π^2 a^3 / (G (M1+M2)); 大质量中心极限 P[yr]^2 = a[AU]^3。

    轨道根数: 半长轴 a, 偏心率 e, 倾角 i, 升交点经度 Ω, 近星点幅角 ω,

    历元 T0 — 6 根数完全描述二体轨道。

    单线双星 (SB1, 只测 K1 视向速度半振幅) → 质量函数

    f(M) = P K1^3 (1-e^2)^(3/2) / (2πG) = M2^3 sin^3 i / (M1+M2)^2

    ≈ 1.04e-7 (1-e^2)^(3/2) K1^3 P (K1: km/s, P: 天, 结果 Msun):

    f(M) 是不见伴星质量的严格下限, 与 sin i 简并 — 无独立倾角测量

    (SB2/食/天体测量) 无法解出真实质量。

    洛希瓣 (Eggleton 1983): R_L/a = 0.49 q^(2/3) / (0.6 q^(2/3) + ln(1+q^(1/3))),

    q = M1/M2; 恒星充满洛希瓣 → 质量转移 (半相接双星)。

    物理原理: 二体引力问题; 视向速度是轨道速度在视线方向的投影。

    判定线索: K1、P、a 与质量函数自洽性检查 (a 与 P 可推 M1+M2);

    SB1 声称给出 M2 精确值而无倾角测量 = 数据不可靠。'
  source: 二体问题教科书; Eggleton 1983, ApJ; 双星质量函数综述
