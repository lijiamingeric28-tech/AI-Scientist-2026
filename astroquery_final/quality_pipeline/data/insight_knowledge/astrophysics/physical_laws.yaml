    - galaxy
  content: '普朗克函数渐近极限, 判据 x = hν/(kT) = 1.439e4/(λ[μm] T[K]) (x << 1 瑞利-金斯, x >> 1 维恩):

    - 瑞利-金斯 (射电/微波): B_ν ≈ 2kTν^2/c^2 = 2kT/λ^2 — 与温度线性、谱形 ν^2 的经典极限 (紫外灾变即其非法外推);

    - 维恩 (紫外/高频): B_ν ≈ (2hν^3/c^2) e^(-hν/kT) — 指数衰减。


    射电亮温度: T_B = (c^2/(2k)) S_ν/(ν^2 Ω) (S 为流量密度, Ω 为立体角) — 高斯波束实用式 T_B [K] ≈ 340 S[Jy]/(θ_arcmin^2 ν_GHz^2): 1.4 GHz 下 1 Jy/1 角分波束 ≈ 170 K; RJ 区亮温度可线性叠加。


    物理原理: hν << kT 时光子能量连续化, 玻色分布退化为经典极限; 亮温度 = 把观测流量反推的等效黑体温度, 非物理温度 (T_B 可远大于或远小于物理温度)。


    应用: 射电-亚毫米热辐射温度标度 (CMB 2.725 K 背景), HI 21cm 吸收要求背景 T_B 低于气体自旋温度。


    判定线索: T_B 超过源物理温度 10 倍以上 = 非热辐射 (同步辐射上限 ~1e11-1e12 K, 更高需聚束); 流量 ∝ ν^2 上升段是光学厚热谱指纹; x > 1 波段误用 RJ 会低估亮温度/流量。'
  source: Rybicki & Lightman 辐射过程; Wilson 射电天文 (亮温度换算)
