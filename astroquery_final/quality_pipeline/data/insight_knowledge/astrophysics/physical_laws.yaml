  content: '自引力介质中密度扰动的稳定性判据: 色散关系 ω^2 = k^2 c_s^2 - 4πGρ,

    波数 k < k_J = (4πGρ/c_s^2)^(1/2) 时 ω^2 < 0 → 扰动指数增长 (坍缩)。

    金斯波长 λ_J = (π c_s^2/(Gρ))^(1/2); 金斯质量 M_J ≈ (π/6) ρ λ_J^3:

