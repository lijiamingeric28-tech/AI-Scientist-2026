  content: '两能级原子 (下能级 l, 上能级 u, 简并度 g): 自发辐射 A_ul、受激辐射 B_ul、吸收 B_lu 三系数由细致平衡联系: g_l B_lu = g_u B_ul 与 A_ul = (2hν^3/c^2) B_ul — 只取决于原子结构与跃迁频率, 与辐射场无关。


    振子强度 f (吸收): A_ul = (2πe^2ν^2/(m_e c^3)) (g_l/g_u) f_lu (cgs) — 经典谐振子归一化: Lyα (1216 Å) f = 0.416, A = 6.27e8 s^-1; Hα f = 0.641, A = 4.4e7 s^-1。


    谱线强度 (光学薄): I ∝ n_u A_ul hν/(4π) — 上能级布居由碰撞/辐射平衡决定; 禁线 (E2/M1, A ~ 1e-3-1e1 s^-1, 如 [OIII] 5007 Å) 只能靠碰撞激发 → 密度敏感诊断。


    能级寿命 tau = 1/ΣA, 自然线宽 Δν = A/(2π); 光学薄吸收线柱密度 (曲线增长线性段): N_l ≈ 1.13e20 W_λ/(λ^2 f) cm^-2 (W_λ、λ 单位 Å)。


    物理原理: 跃迁概率决定谱线强度比例、能级寿命与线宽 — 一切谱线诊断 (丰度、温度、密度、柱密度) 的基础。


    判定线索: Balmer 递减 Hα/Hβ ~ 2.9 (case B) 明显偏离 = 消光或光学厚; 记录中 A 与 f、g 比例不自洽 = 原子数据错误; 禁线强度反常先怀疑密度/温度假设而非数据。'
  source: Rybicki & Lightman 辐射过程; Draine 天体物理辐射过程; NIST 原子光谱数据库
