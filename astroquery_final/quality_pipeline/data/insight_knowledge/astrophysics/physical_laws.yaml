  content: '中性氢 (HI) 基态超精细跃迁: 电子与质子自旋翻转 (F=1→F=0),

    静止频率 ν = 1420.405751786 MHz (λ ≈ 21.1 cm), 能量差 5.9e-6 eV,

    自发辐射寿命 ~1.1e7 yr (爱因斯坦 A10 ≈ 2.85e-15 s^-1) — 光学薄。

    辐射转移: 亮温度 T_B = T_s (1 - e^-τ), 光深 τ ∝ N_HI / (T_s Δv);

    自旋温度 T_s 由碰撞 + 21cm 辐射场 + Lyα (Wouthuysen-Field 效应)

    三通道耦合, 冷中性相 ~100-300 K, 暖中性相 ~6000-8000 K。

    柱密度换算 (光学薄): N_HI ≈ 1.823e18 ∫ T_B dv cm^-2 (dv 单位 km/s),

