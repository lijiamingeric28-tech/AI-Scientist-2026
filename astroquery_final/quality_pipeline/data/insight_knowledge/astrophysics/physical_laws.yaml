  content: '电子简并压 (Pauli 不相容原理 + Fermi 统计, 与温度无关):

    - 非相对论: P = K1 ρ^(5/3) → 白矮星半径 R ∝ M^(-1/3) (典型 ~0.01 Rsun)

    - 极端相对论: P = K2 ρ^(4/3) → 结构临界, 质量存在上限

    钱德拉塞卡极限: M_Ch = 1.44 (2/μ_e)^2 Msun (μ_e 为每电子核子数),

    C/O 白矮星 μ_e = 2 → 1.44 Msun; 计入库仑/广义相对论修正后实际极限

    约 1.37-1.38 Msun; 超过极限 → 电子俘获/坍缩 (超新星或中子星)。

    物理原理: 高密度下 Fermi 能远超热动能, 电子动量由不确定原理支撑;

    γ = 4/3 多方指数结构对质量敏感, 相对论化使简并压失效。

    判定线索: 记录的白矮星质量 > 1.44 Msun = 必为错误或并合产物 (需复核);

    质量-半径偏离 R ∝ M^(-1/3) 提示温度/磁场/旋转贡献;

    中子星 (简并中子气 + 强作用) 质量上限由 TOV 方程给出 ~2.1-2.3 Msun。'
