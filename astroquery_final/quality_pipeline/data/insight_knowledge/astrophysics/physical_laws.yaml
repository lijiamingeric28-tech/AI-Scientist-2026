  content: '普朗克函数数值形式 (cgs, T 单位 K):

    - 频率: B_ν [erg s^-1 cm^-2 Hz^-1 sr^-1] = 1.4744e-47 ν^3/(e^(4.799e-11 ν/T) - 1) (ν 单位 Hz);

    - 波长: B_λ [erg s^-1 cm^-2 sr^-1 cm^-1] = 1.1910e-5 λ^-5/(e^(1.4388/(λ T)) - 1) (λ 单位 cm);

    - 换算: B_λ = (c/λ^2) B_ν; 1 Jy = 1e-23 erg s^-1 cm^-2 Hz^-1; 光子能量 E[eV] = 1.240/λ[μm]。


    峰位置: λ_max T = 0.2898 cm K (x = 4.965), ν_max/T = 5.879e10 Hz/K (x = 2.821) — B_λ 峰与 B_ν 峰不对应同一频率 (差因子 1.76), 这是常见误区。


    积分: 辐射通量 F = σT^4 (σ = 5.670e-5 erg cm^-2 s^-1 K^-4), 能量密度 u = aT^4 (a = 7.566e-15 erg cm^-3 K^-4), 光子数密度 ∝ T^3。


    物理原理: 黑体谱是热平衡辐射场的普适函数, 只由温度决定 — SED 拟合与颜色-温度转换的基础。


    判定线索: B_ν/B_λ 形式混用使拟合温度偏差 20-30%; 峰值波长与 T 违反维恩位移 = 消光/红移未修正或单位错误; 流量单位混淆 (Jy vs μJy, per Hz vs per Å) 是 SED 错误的首要来源。'
  source: CODATA 物理常数; Rybicki & Lightman 辐射过程; 黑体辐射数值表
