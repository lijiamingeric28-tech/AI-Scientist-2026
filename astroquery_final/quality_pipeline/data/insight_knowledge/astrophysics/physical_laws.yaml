  hypothetical_queries:
  - 辐射压力怎么计算
  - 光压在大质量恒星里有多重要
  - 太阳辐射压在地球轨道处有多大
  content: '辐射压力: 光子动量 p = E/c = h nu/c, 垂直入射动量流密度即压力 — 完全吸收面 P = F/c, 完全反射面 P = 2F/c (F 为辐射通量)。

    各向同性辐射场 (热平衡): P_rad = u/3 = a T^4/3 (a = 7.566e-15 erg cm^-3 K^-4)。

    来自光度 L 的通量 F = L/(4 pi r^2), 距源 r 处辐射压 P = L/(4 pi r^2 c): 太阳常数 1361 W/m^2 在 1 AU 处对应 ~4.5e-5 dyn/cm^2 (吸收面, 反射面翻倍)。

    对物质的作用: 单位质量辐射压力加速度 = kappa F/c (kappa 为不透明度), 与引力加速度之比即爱丁顿比 Gamma = kappa L/(4 pi G M c) — Gamma -> 1 时辐射压驱动外流 (星风/吸积盘风)。

    不透明度对比: 电子散射 kappa_es ~ 0.4 cm^2/g (完全电离等离子体, 与温度无关); 星际尘埃对光学/紫外 kappa_dust ~ 1e2-1e3 cm^2/g (大 2-3 个量级)。

    尘埃主导的辐射压是恒星形成区电离氢区膨胀与盘尘埃迁移的关键; AGN 环状尘埃的辐射压影响 SED 与视线遮蔽。

    恒星结构: 大质量星 (M > ~30 Msun) 内部辐射压占比 > 50%, 结构接近 Eddington 极限; 日型星中心辐射压占比 < 1%。

    物理原理: 光子携带动量 E/c, 被吸收/散射时把动量转移给介质 — 辐射压与气体压共同支撑恒星与吸积盘; 吸收 (动量 c) 与反射 (2c) 的差异决定尘埃-气体耦合强度。

    判定线索: 持续辐射的 L 远超 Eddington 极限 (Gamma > 1 且无聚束/几何解释) = 光度或质量字段错误; 尘埃辐射压估算误用电子散射 kappa 会低估 2-3 个量级; 星风外流速度与 L/kappa 组合违反动量驱动标定需复核。'
  source: Rybicki & Lightman 辐射过程; Maeder 恒星结构与演化; Eddington 1916
  confidence: established
- id: electron_scattering_depth
  title: 电子散射光深 (Thomson 光深)
  category: physical_law
  tags:
  - thomson_scattering
  - optical_depth
  - electron_scattering
  - reionization
  - free_electron
  applies_to:
    fields:
    - electron_density
    - optical_depth
    entities:
    - star
    - galaxy_cluster
    - ism_object
  hypothetical_queries:
  - 电子散射光深怎么算
  - 星系团的Thomson光深是多少
  - 再电离时代的电子散射光深有多大
  content: '电子散射光深: tau_es = sigma_T ∫ n_e dl, Thomson 截面 sigma_T = 6.65e-25 cm^2。

    适用条件: 光子能量 h nu << m_e c^2 (511 keV) 时为弹性散射, 截面与频率无关; 高能端需 Klein-Nishina 修正 (截面下降)。

    柱密度换算: 每单位光深对应电子柱密度 N_e = tau/sigma_T = 1.5e24 tau cm^-2 — 由 tau 反推电子柱密度的一阶换算。

    平均自由程 l = 1/(n_e sigma_T): 星系团介质 (n_e ~ 1e-3 cm^-3) ~500 Mpc 量级; 恒星光球 (n_e ~ 1e17-1e18 cm^-3) 仅 ~10-150 km; 星际介质 (n_e ~ 0.03 cm^-3) ~1.5 Gpc。

    典型光深: 再电离后 IGM tau_es ~ 0.05 (Planck 2018: 0.054 ± 0.007, 约束再电离红移 ~6-8)。

    星系团核心 tau ~ 0.005-0.02 (SZ 效应强度正比 tau); 大质量星稠密星风 (WR 型) tau ~ 0.1-1 (光学厚散射包层); 恒星光球 tau ~ 1。

    物理原理: 电子散射不改变光子能量只改变方向 — 辐射压、SZ 效应、临边散射偏振与连续谱光深的共同基础; 恒星大气中 tau_es 是有效温度/光度推导的输入。

    应用: 再电离历史 (CMB 偏振), 星系团质量 (SZ), 星风连续谱, 激波电离前区 (X 射线散射/反射)。判定线索: 声称 n_e 与 l 违反 tau = sigma_T n_e l 量级 = 密度单位错误 (cm^-3 vs m^-3 差 1e6 倍); 电子柱密度与 tau 不满足 1.5e24 换算因子 = 字段错位; 光学厚散射介质中谱线被抹平, 强窄线记录需复核散射光深假设。'
  source: Rybicki & Lightman 辐射过程; Planck Collaboration 2018, A&A 641, A6; Sunyaev & Zeldovich 1972
  confidence: established
  ranges:
    reionization_tau:
      lo: 0.04
      hi: 0.07
      unit: dimensionless
- id: saha_ionization_equation
  title: Saha 电离方程与恒星光谱温度序
  category: physical_law
  tags:
  - saha
  - ionization
  - boltzmann
  - spectral_classification
  - balmer
