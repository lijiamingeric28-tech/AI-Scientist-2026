  content: '等离子体电子振荡固有频率: ω_pe = (n_e e^2/(ε_0 m_e))^(1/2),

    f_pe ≈ 8.98 sqrt(n_e) kHz (n_e 单位 cm^-3):

    星际介质 (n_e ~ 0.03 cm^-3) → f_p ~ 1.5 kHz; 电离层 → 3-10 MHz;

    低于 f_p 的电磁波被反射, 高于则传播 (折射率 n = sqrt(1 - f_p^2/f^2))。

    色散关系 ω^2 = ω_pe^2 + k^2 c^2: f < f_p 时波截止/反射 (短波被

    电离层反射回地面的原理); f > f_p 时群速度延迟 ∝ DM/f^2 —

    脉冲星/FRB 色散延迟测量的基础。

    德拜屏蔽: 热等离子体中点电荷库仑势被指数屏蔽

    φ(r) = (q/(4πε_0 r)) exp(-r/λ_D),

    德拜长度 λ_D = (ε_0 k_B T/(n_e e^2))^(1/2) ≈ 6.9 sqrt(T/n_e) cm

    (T 单位 K, n_e 单位 cm^-3): 尺度大于 λ_D 处等离子体近似电中性。

    物理原理: 电子集体振荡 + 电荷屏蔽 — 等离子体与真空传播的本质差异。

    判定线索: 观测频率低于 f_p 的''信号''多为本地干扰; 色散延迟与 f^-2

