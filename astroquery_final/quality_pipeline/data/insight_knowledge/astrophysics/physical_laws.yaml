  hypothetical_queries:
  - Saha电离方程是什么
  - 氢在什么温度下开始电离
  - 为什么A型星巴耳末线最强
  content: 'Saha 电离方程: N_{i+1} n_e / N_i = (2 pi m_e kT/h^2)^(3/2) (2 U_{i+1}/U_i) e^(-chi_i/kT) — 温度、电子密度与电离态布居的平衡关系。

    常数 (2 pi m_e k/h^2)^(3/2) = 2.41e15 cm^-3 K^(-3/2); 电离度 ∝ T^1.5 e^(-chi/kT)/n_e, 指数因子对温度极端敏感 (T 变化 ~10% → 布居变化 e 倍量级)。

    氢 (chi = 13.6 eV): N_HII/N_HI = 2.41e15 T^1.5 e^(-1.58e5/T) / n_e — 恒星大气 (n_e ~ 1e13-1e16 cm^-3) 中氢在 ~8e3-1.2e4 K 迅速电离, 半电离温度 ~1e4 K (随 n_e 变化 ~1e3 K)。

    谱型物理: Balmer 线强度在 ~9.9e3 K (A 型) 达峰 — 更热氢几乎全电离 (n=2 布居下降), 更冷激发不足 (n=2 布居低) — OBAFGKM 温度序与 H 线强度反转的根源。

    多重电离: He II (chi ~ 54 eV)、C IV/O VI 等高电离线要求 T > ~3e4-1e5 K — 恒星分类与星云诊断 (O 星、行星状星云、AGN 宽线区) 的依据。

    物理原理: 电离平衡 = 光电离与复合的细致平衡, 谱线强度 = Boltzmann 激发 × Saha 电离度。

    应用: 由谱线强度反推 Teff 与电子压力; 恒星大气模型边界条件; 光谱分类的一致性核查。

    判定线索: 光谱型与 Teff 违反 Saha 外推 (M 型 3000 K 却报强 H-alpha 吸收、A 型却报中性金属线强) = 分类或温度字段错误; He II 与 H I 线同时强 = 双温度介质/多星混合; 6000 K 源出现 O VI 需复核波长定标 (其双线 1032/1038 A 易与红移谱线混淆)。'
  source: Saha 1920, Phil. Mag. 40, 472; Gray 恒星光谱分类; Carroll & Ostlie 现代天体物理导论
