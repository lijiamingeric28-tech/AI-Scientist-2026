  content: '自由落体时标 (无压坍缩): t_ff = (3π/(32Gρ))^(1/2) ≈ 4.4e7 n_H^(-1/2) yr (n_H 为总氢数密度 cm^-3): 致密核 (n_H2 ~ 1e4 cm^-3) ~2-3e5 yr, 弥散分子云 (n_H2 ~ 1e2 cm^-3) ~3e6 yr — 恒星形成过程的零阶时标。


    与观测对照: 分子云寿命 (~10-30 Myr) 远长于 t_ff → 湍流/磁场/加热必须持续支撑; 观测恒星形成效率 ε_ff ≈ 0.01-0.1/自由落体时标; Kennicutt-Schmidt 定标 Σ_SFR ∝ Σ_gas^1.4。


    等温自相似坍缩 (Shu 1977 由内向外): 膨胀波以声速外传, 中心吸积率恒定 Ṁ = 0.975 c_s^3/G ≈ 1.5e-6 (T/10K)^(3/2) Msun/yr — 10 K 时成长 1 Msun 恒星约 6e5 yr; 大质量恒星 (含盘外流) 1e-4-1e-3 Msun/yr。


    Bondi-Hoyle 吸积: Ṁ = 4πρ G^2 M^2/(c_s^2 + v^2)^(3/2) — 运动天体在介质中的气体吸积率。


    物理原理: 坍缩时标只由密度决定 (自引力坍缩无质量尺度); 吸积率由声速 (温度) 决定, 温度越高坍缩越慢 (M_J ∝ T^(3/2) ρ^(-1/2))。


    判定线索: 声称的恒星形成效率 >> 0.1/自由落体时标 = 星暴或质量/密度单位错误; 吸积时标 t = M/Ṁ 与年龄观测矛盾 = 吸积率或质量换算错误。'
  source: Shu 1977, ApJ 214, 488; McKee & Ostriker 2007, ARA&A 45, 565; Krumholz 恒星形成
