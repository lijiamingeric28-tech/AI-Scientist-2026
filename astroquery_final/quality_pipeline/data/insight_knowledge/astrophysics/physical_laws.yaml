entries:
- id: DM_redshift_relation
  title: 色散量-红移关系 (Macquart Relation)
  category: empirical_relation
  tags:
  - DM
  - dispersion_measure
  - redshift
  - z
  - Macquart
  - IGM
  - cosmology
  hypothetical_queries:
  - 为什么DM和红移有关系？
  - DM随红移怎么变化？
  - 如何用DM估计FRB的红移？
  applies_to:
    fields:
    - dispersion_measure
    - redshift
    entities:
    - FRB
    - fast_radio_burst
  content: 'DM 与红移 z 的物理关系:

    DM = DM_MW + DM_halo + DM_IGM(z) + DM_host/(1+z)


    其中 DM_IGM(z) 是主要的 cosmology-dependent 项:

    DM_IGM(z) ≈ 800-1200 pc cm⁻³ at z~1 (Macquart et al. 2020)


    关键性质:

    - DM 随 z 增大单调递增 (主要趋势)

    - Host galaxy DM 贡献 ~50-200 pc cm⁻³ (较大散点)

    - Milky Way DM 贡献 ~20-200 pc cm⁻³ (NE2001/YMW16 可扣除)

    - 因此 DM-z 的散点主要来自 host 和 MW 的不确定性

    '
  related_entries:
  - kb:NE2001_model
  - kb:YMW16_model
  - kb:Macquart_relation
  - kb:radio_dm_measurement
  source: Macquart et al. 2020, Nature, DOI:10.1038/s41586-020-2300-2
  confidence: established
  version: 1.0.0
  last_updated: '2026-07-28'
- id: scattering_frequency_relation
  title: 散射时标-频率关系
  category: physical_law
  tags:
  - scattering
  - timescale
  - frequency
  - tau
  - Kolmogorov
  - turbulence
  hypothetical_queries:
  - 散射时标与观测频率的关系
  - 为什么低频射电脉冲散射更严重
  - 跨频段比较散射时标要注意什么
  applies_to:
    fields:
    - scattering_timescale
    - observing_frequency
    entities:
    - FRB
    - pulsar
  content: '脉冲散射展宽 tau_scat 与观测频率 nu 的关系:

    tau_scat ∝ nu^(-alpha)


    对于 Kolmogorov 湍流谱: alpha ≈ 4.0-4.4

    因此 C-band (5 GHz) 的散射约为 L-band (1.3 GHz) 的 (1.3/5)^4 ≈ 0.0045 倍


    重要推论:

    - L-band 散射严重, C-band 几乎无散射 → 跨频段 tau 差异可达 200 倍

    - 跨来源比较 tau 时必须考虑频率依赖性

    - 同频段 tau 差异 < 30% 可能来自视线方向星际介质差异

    '
  source: Rickett 1990, ARA&A; Cordes & Lazio 2002, astro-ph/0207156
  confidence: established
- id: fluence_energy_relation
  title: fluence-能量关系
  category: physical_law
  tags:
  - fluence
  - energy
  - flux
  - FRB
  - radio
  - isotropic
  hypothetical_queries:
  - FRB的fluence怎么换算成各向同性能量
  - 射电暴流量密度与能量的关系
  - 如何由fluence估算FRB能量
  applies_to:
    fields:
    - fluence
    - flux_density
    - energy
    entities:
    - FRB
  content: 'FRB 的 fluence F (Jy ms) 与各向同性能量 E 的关系:

    E = 4π D_L² Δν F / (1+z)


    其中 D_L 为光度距离, Δν 为观测带宽。


    关键性质:

    - fluence 取决于仪器带宽和中心频率 → 跨仪器比较需归一化

    - 同一 FRB 不同爆发间 fluence 可差 10-100 倍

    - fluence 与 DM 无强相关性 (弱正相关, ρ~0.3)

    '
  source: Petroff et al. 2019, A&ARv
  confidence: established
- id: photo_z_vs_spec_z
  title: 测光红移 vs 光谱红移精度对比
  category: method_comparison
  tags:
  - redshift
  - photometric
  - spectroscopic
  - photo-z
  - spec-z
  - precision
  hypothetical_queries:
  - 测光红移与光谱红移的精度对比
  - photo-z和spec-z差多少算正常
  - 跨来源红移比较为什么要区分测量方法
  applies_to:
    fields:
    - redshift
    methods:
    - photometry
    - spectroscopy
  content: '红移测量精度对比:

    - 光谱红移 (spec-z): Δz/(1+z) ~ 0.0001 (高分辨率光谱 R>10000)

    - 测光红移 (photo-z): Δz/(1+z) ~ 0.03-0.06 (取决于滤光片数量和S/N)


    关键推论:

    - spec-z 与 photo-z 间 3-5% 的差异是测量方法的系统差异, 不是数据错误

    - 对高红移 (z>4) 天体, photo-z 的绝对误差可能 > 0.2

    - 跨来源红移比较时, 必须区分测量方法

    '
  source: Salvato et al. 2019, Nature Astronomy
  confidence: established
- id: dm_galactic_contribution
  title: 银河系 DM 贡献模型
  category: galactic_model
  tags:
  - DM
  - Milky_Way
  - NE2001
  - YMW16
  - galactic
  - foreground
  hypothetical_queries:
  - 银河系星际介质对DM的贡献有多大
  - NE2001模型怎么扣除银河系色散量
  - 如何从总DM中分离银河系成分
  applies_to:
    fields:
    - dispersion_measure
    entities:
    - FRB
    - pulsar
  content: '银河系星际介质对 DM 的贡献:

    - 典型值: 20-200 pc cm⁻³ (取决于视线方向)

    - 高银纬 (|b|>30°): ~20-50 pc cm⁻³

    - 低银纬 (|b|<10°): ~100-200+ pc cm⁻³


    常用模型:

    - NE2001 (Cordes & Lazio 2002): 广泛使用, ~30% 不确定度

    - YMW16 (Yao, Manchester & Wang 2017): 更新但可能 overfit


    关键: 扣除银河系 DM 后, 剩余 DM_excess 才可用于红移推断

    '
  source: Cordes & Lazio 2002; Yao et al. 2017, ApJ
  confidence: established
- id: blackbody_radiation_law
  title: 黑体辐射定律
  category: physical_law
  tags:
  - blackbody
  - stefan
  hypothetical_queries:
  - 斯特藩-玻尔兹曼定律是什么
  - 维恩位移定律怎么由温度求峰值波长
  - 如何由有效温度和半径估计恒星光度
  applies_to:
    fields:
    - effective_temperature
    - luminosity
    entities:
    - star
  content: '斯特藩-玻尔兹曼定律: L = 4πR^2 σ T^4 — 恒星/尘埃的连续谱辐射基础;

    维恩位移: λ_max ∝ 1/T (热源越热峰值越短)。

    物理原理: 黑体辐射是热平衡辐射场, 光度=表面积×单位面积辐射功率。

    应用: 由 (Teff, 半径) 或 (Teff, 光度) 推第三者; SED 拟合定 Teff。

    判定线索: Teff 与颜色矛盾 (如 5000 K 却标为蓝源) = 消光未修正或字段错位;

    恒星 SED 明显偏离黑体 (红外超) 提示尘埃盘/星风包层。'
  source: 恒星物理教科书; OSU HR 图讲义
  confidence: established
- id: mass_luminosity_law
  title: 主序质光关系
  category: empirical_relation
  tags:
  - mass_luminosity
  hypothetical_queries:
  - 主序星的质光关系是什么
  - 由恒星质量如何估算光度与寿命
  - 质光关系明显偏离说明什么问题
  applies_to:
    entities:
    - main_sequence_star
  content: '主序质光关系 L ∝ M^3.5 (约 0.5-10 Msun 区间近似): 大质量端辐射压主导

    趋向 L ∝ M^3, 低质量端对流主导斜率变平。

    物理原理: 流体静力学平衡 + 辐射扩散近似 (光度 ∝ 内部温度梯度 × 半径)。

    应用: 由质量估光度/寿命 (τ ∝ M^-2.5), 或反之;

    判定线索: 主序星质量-光度组合明显偏离关系 (>1 dex) = 双星混合、

    非主序成员, 或单位错误。'
  source: 质光关系教科书; UNLV 主序表
  confidence: established
- id: eddington_luminosity
  title: 爱丁顿光度界限
  category: physical_law
  tags:
  - eddington
  hypothetical_queries:
  - 爱丁顿光度怎么计算
  - 黑洞质量与爱丁顿光度有什么关系
  - 天体光度超过爱丁顿极限怎么解释
  applies_to:
    entities:
    - star
    - black_hole
    - agn
  content: '爱丁顿光度 L_Edd = 4πGMm_p c/σ_T ≈ 1.26e38 (M/Msun) erg/s: 辐射压

    (电子 Thomson 散射) 平衡引力的上限, 与距离无关。

    物理原理: 超过 L_Edd 时辐射压驱动外流, 吸积被截断 (对球对称吸积)。

    应用: 恒星/黑洞质量的下限锚点; AGN 与 X 射线双星的 sanity check;

    判定线索: L > L_Edd 数倍的持续辐射需要超 Eddington 几何解释 (盘风、

    喷流) 或复核光度/质量 — 这是数据质量核查的第一性工具。'
  source: JILA 讲义; Eddington 1916 原始推导
  confidence: established
- id: hubble_flow_law
  title: Hubble 流与距离-红移
  category: empirical_relation
  tags:
  - hubble
  - redshift
  hypothetical_queries:
  - 哈勃定律与距离红移关系
  - 红移大于0.1后如何换算距离
  - 星系红移与距离矛盾怎么排查
  applies_to:
    fields:
    - redshift
    - distance
    entities:
    - galaxy
  content: 'Hubble-Lemaître 定律: v = H0 d (H0 ≈ 67-73 km/s/Mpc); z << 1 时 cz ≈ H0 d。

    物理原理: 宇宙膨胀使星系退行, 红移是尺度因子之比 z = a(t_obs)/a(t_emit) - 1;

    z > 0.1 后线性近似失效, 需宇宙学模型 (ΛCDM) 换算距离。

    判定线索: z 与距离明显矛盾 (如 z=0.5 却标 10 Mpc) = 单位/换算错误;

    同一对象的多个红移源差异 >3-5% 属测量系统差, 更大差异提示双星/并合/透镜。'
  source: Planck 2020; 宇宙学教科书
  confidence: established
- id: doppler_redshift_law
  title: 多普勒红移与视向速度
  category: empirical_relation
  tags:
  - doppler
  - radial_velocity
  hypothetical_queries:
  - 多普勒效应怎么由谱线位移算视向速度
  - 双星系统的视向速度测量
  - 蓝移天体可能是什么情况
  applies_to:
    fields:
    - radial_velocity
    entities:
    - star
    - galaxy
  content: '多普勒效应: 谱线位移 Δλ/λ = v/c (非相对论) — 视向速度测量的基础。

    物理原理: 光源沿视线运动压缩/拉伸波长; 热运动与湍流展宽限制精度。

    应用: 恒星/星系 RV 测量 (精度 ~0.1-10 km/s 视谱分辨率);

    双星轨道 (SB1 只给 m sin^3 i, SB2 可得两星质量 — 倾角需食/天体测量)。

    判定线索: 负 RV (蓝移) 只可能来自本星系群成员 (宇宙学红移恒为正);

    RV 与星系 z 矛盾 = 星系内运动 vs 宇宙学红移混淆。'
  source: 多普勒效应讲义; RV 测量方法文献
  confidence: established
- id: virial_mass_theorem
  title: 维里定理与动力学质量
  category: physical_law
  tags:
  - virial
  - dynamics
  hypothetical_queries:
  - 维里定理怎么估算星系团质量
  - 速度弥散与动力学质量的关系
  - 动力学质量远大于光度质量说明什么
  applies_to:
    entities:
    - galaxy
    - galaxy_cluster
    - galaxy_group
  content: '维里定理: 束缚系统的 2⟨T⟩ + ⟨U⟩ = 0 → 动力学质量 M ≈ σ^2 R / G

    (σ 速度弥散, R 特征半径)。

    物理原理: 平衡系统的动能与势能之比固定 (各向同性无碰撞气体)。

    应用: 星系团/椭圆星系质量估计 — 团质量 ~1e14-1e15 Msun 中 ~84% 是暗物质,

    ~13% 热 ICM, 星系本身仅 ~1%。

    判定线索: 动力学质量与光度质量差异 >10 倍 = 暗物质主导 (正常) 或

    非平衡态 (并合中, 维里定理失效); 团 X 光度与温度应满足 L_X ∝ T^3。'
  source: 维里定理讲义; 星系团质量综述 (Peterson)
  confidence: established
- id: radius_temp_luminosity
  title: 恒星半径-温度-光度关系
  category: physical_law
  tags:
  - radius
  - teff
  - luminosity
  hypothetical_queries:
  - 恒星半径温度光度三者如何互推
  - 由有效温度和半径计算恒星光度
  - 恒星参数组合不自洽怎么排查单位错误
  applies_to:
    fields:
    - stellar_radius
    - effective_temperature
    - luminosity
    entities:
    - star
  content: 'L = 4πR^2 σ T^4 联立 Teff/半径/光度: 任取两者可推第三者 — 恒星参数的

    一致性校验基础 (HR 图的坐标即 T 与 L)。

    物理原理: 黑体辐射 + 几何 (光度=表面积×表面辐射通量)。

    判定线索: 三者矛盾 (如 1 Rsun + 5000 K 却标 1e5 Lsun) = 单位混用

    (常见: Rsun↔km、Lsun↔erg/s、Teff↔K 混淆);

    红超巨星: 3000-4500 K + 200-1500 Rsun + 1e4-1e6 Lsun 的组合应自洽。'
  source: 恒星物理教科书; HR 图讲义
  confidence: established
- id: schwarzschild_radius
  title: Schwarzschild 半径
  category: physical_law
  tags:
  - blackhole
  - schwarzschild
  hypothetical_queries:
  - 史瓦西半径怎么计算
  - 不同质量黑洞的事件视界大小
  - 黑洞质量与半径组合如何做自洽性检查
  applies_to:
    entities:
    - black_hole
  content: 'Schwarzschild 半径 r_s = 2GM/c^2 ≈ 2.95 (M/Msun) km — 事件视界尺度。

    物理原理: 牛顿逃逸速度 v = (2GM/r)^(1/2) 达光速的半径 (广义相对论精确解)。

    尺度: 恒星质量 BH (5-100 Msun) → 15-300 km (与中子星同尺度);

    SMBH (1e6-1e10 Msun) → 0.02-200 AU。

    判定线索: 黑洞''密度'' ∝ 1/M^2 — 大质量黑洞是低密度物体 (可低于水),

    这是常见直觉误区; 记录的黑洞质量与半径组合不满足 r_s 关系 = 单位错误。'
  source: JILA 黑洞讲义; Schwarzschild 1916
  confidence: established
- id: stellar_hydrostatic_equilibrium
  title: 恒星流体静力平衡与维里定理
  category: physical_law
  tags:
  - hydrostatic
  - virial
  - stellar_structure
  - equilibrium
  - pressure
  hypothetical_queries:
  - 恒星流体静力平衡方程是什么
  - 恒星中心压力与温度怎么估算
  - 动力学时标是什么量级
  applies_to:
    fields:
    - stellar_mass
    - stellar_radius
    - luminosity
    entities:
    - star
    - main_sequence_star
  content: '流体静力平衡方程: dP/dr = -G m(r) ρ(r) / r^2 (压力梯度平衡引力);

    结合质量守恒 d m/dr = 4π r^2 ρ, 积分得中心压力下限 (Milne 不等式)

    P_c > G M^2 / (8π R^4) ≈ 4.5e13 Pa (1 Msun 恒星), 与状态方程无关。

    维里定理: 2⟨T⟩ + ⟨U⟩ = 0 → 恒星引力势能的一半被辐射, 一半转为热能;

    动力学时标 t_dyn ≈ (R^3/(GM))^(1/2), 1 Msun 恒星约 0.5-1 小时。

    标准恒星模型 (1 Msun): T_c ≈ 1.57e7 K, ρ_c ≈ 150 g/cm^3, P_c ≈ 2.5e16 Pa。

    物理原理: 恒星是压力支撑的静态流体, 引力求平衡于气体压+辐射压+简并压;

    太阳质量恒星内部辐射压占比 < 1%。

    判定线索: 中心温度/密度与质量半径组合矛盾 (如 1 Msun 却标 T_c = 1e9 K)

    = 单位错误或对象类型混淆; 纯转动支撑的结构在动力学时标内不稳定。'
  source: 恒星结构与演化标准教科书; Kippenhahn & Weigert 恒星结构与演化
  confidence: established
- id: stellar_nucleosynthesis_pp_cno
  title: '氢燃烧: pp 链与 CNO 循环'
  category: physical_law
  tags:
  - nucleosynthesis
  - pp_chain
  - cno
  - fusion
  - energy_generation
  hypothetical_queries:
  - pp链与CNO循环的区别是什么
  - 恒星核聚变能量产生率与温度的关系
  - 主序星质量如何决定氢燃烧机制
  applies_to:
    fields:
    - stellar_mass
    - luminosity
    - effective_temperature
    entities:
    - star
    - main_sequence_star
  content: "氢燃烧能量产生率 (单位质量) 幂律近似 ε = ε_0 ρ^α T^ν:\n- pp 链: ε_pp ∝ ρ X^2 T^4 (ν≈4), ε_pp ≈ 1.05e-5 ρ X^2 T6^4 erg/g/s (T6 = T/1e6 K)\n- CNO 循环: ε_CNO ∝ ρ X X_CNO T^17-20 (ν 极陡), 限速步骤 14N(p,γ)15O\n- 两机制交叉温度\
    \ T ≈ 1.6-1.7e7 K: 1 Msun 恒星核 (1.57e7 K) 以 pp 为主,\n  M > ~1.3 Msun 的恒星核 CNO 主导。\n物理原理: 库仑隧穿概率 ∝ exp(-b/E^(1/2)) → 反应率对温度极端敏感;\n4H → He 每反应释放 Q ≈ 26.7 MeV (pp 链), 主序寿命 τ ∝ M/L ∝ M^-2.5。\n判定线索: 主序星质量-光度组合与\
    \ ε 定标矛盾 (偏离 >1 dex) = 非主序成员\n或单位错误; 极低金属丰度 (Pop II) 恒星 CNO 效率下降, 同温光度应偏低。"
  source: Clayton 恒星结构与演化; Carroll & Ostlie 现代天体物理导论
  confidence: established
- id: synchrotron_radiation
  title: 同步辐射与谱指数
  category: physical_law
  tags:
  - synchrotron
  - spectral_index
  - magnetic_field
  - nonthermal
  - polarization
  hypothetical_queries:
  - synchrotron emission spectral index
  - 射电辐射机制 同步辐射
  - radio spectrum from relativistic electrons
  applies_to:
    fields:
    - flux_density
    - spectral_index
    - polarization
    entities:
    - agn
    - pulsar
    - supernova_remnant
    - galaxy
  content: '相对论电子在磁场中的磁轫致辐射: 单电子临界频率

    ν_c = 3 γ^2 e B sinθ / (4π m_e c) ≈ 4.2e6 γ^2 B sinθ Hz (B 单位 gauss),

    谱峰值位于 ~0.29 ν_c; 单电子辐射功率 ∝ γ^2 B^2。

    功率律电子分布 N(E) dE ∝ E^-p dE → 叠加谱 S_ν ∝ ν^-α, α = (p-1)/2:

    典型观测谱指数 α ≈ 0.7-0.8 (对应 p ≈ 2.4-2.6, 范围 0.5-0.8);

    平谱 (α < 0.5) 提示粒子注入/冷却平衡或电子谱老化。

