  content: '辐射转移方程: dI_nu/ds = j_nu - kappa_nu I_nu — 光强沿视线被发射系数 j_nu 增加、被吸收系数 kappa_nu 衰减; 定义光深 dtau_nu = kappa_nu ds 与源函数 S_nu = j_nu/kappa_nu 后化为 dI_nu/dtau_nu = S_nu - I_nu (tau 向内计), 平面平行几何写作 mu dI/dtau
    = I - S (mu = cos(theta))。


    形式解 (tau = 0 处出射): I(0) = I_bg e^(-tau) + ∫_0^∞ S(t) e^(-t) dt — 出射强度 = 背景衰减 + 沿途源函数的指数加权积分。


    LTE 下源函数即普朗克函数 S_nu = B_nu(T); 纯吸收无发射时 I = I_bg e^(-tau) (指数衰减); 光学厚 (tau >> 1) 时 I -> S, 逃逸光子来自 tau ~ 1 层。


    Eddington-Barbier 近似: 法向出射强度 I(0) ≈ S(tau = 1), 通量 F ≈ S(tau = 2/3) (源函数线性时严格成立) — 观测『看到』的是 tau ~ 1 层的源函数, 也是临边昏暗 (mu 小 → 采样浅层) 的直接解释。


    物理原理: 光子守恒方程, 一切连续谱/谱线辐射观测分析的基础。


    判定线索: 光学薄谱形 ∝ 发射系数 (如轫致辐射近平坦谱), 光学厚谱形 → 源函数; 吸收线深度偏离 e^(-tau) 外推 = 光学厚/部分覆盖需复核。'
