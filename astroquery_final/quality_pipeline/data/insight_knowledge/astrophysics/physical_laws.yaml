- id: relativistic_beaming
  title: 相对论聚束效应 (多普勒因子)
  category: physical_law
  tags:
  - beaming
  - doppler_factor
  - superluminal
  - blazar
  - jet
  - lorentz_factor
  hypothetical_queries:
  - 相对论聚束效应如何解释视超光速
  - 多普勒因子怎么计算
  - blazar高偏振快时变的原因
  applies_to:
    fields:
    - flux_density
    - brightness_temperature
    - spectral_index
    - apparent_velocity
    entities:
    - agn
    - black_hole
    - pulsar
  content: '相对论多普勒因子: δ = 1/(γ(1 - β cosθ)) (β = v/c, γ = (1-β^2)^(-1/2), θ 为视线与运动方向夹角): θ = 0 时 δ_max = (1+β)γ ≈ 2γ, θ = 90° 时 δ = 1/γ, 退行半球辐射被削弱 (de-beaming)。


    观测效应: ν_obs = δ ν_em; 连续喷流通量增强 ~ δ^(2+α), 离散源团 ~ δ^(3+α) (α 为谱指数) — 朝向观测者的喷流可比固有亮度亮数个量级 → 单侧喷流、counter-jet 不可见、快速时变与高偏振 (blazar 现象)。


    视超光速运动: β_app = β sinθ/(1 - β cosθ) — β > 1/sqrt(2) ≈ 0.71 时表观速度可超光速; β_app 最大 ≈ γ (θ = 1/γ 处), 由观测 β_app 推 γ_min = sqrt(1 + β_app^2) (β_app = 5 → γ ≥ 5.1); 聚束锥角 ~ 1/γ (γ = 10 → 锥角 ~6°)。


    物理原理: 接近光速的辐射源把光子『扫』向前方且光子到达时间被压缩 — 纯几何 + 狭义相对论效应, 无真实超光速。


    判定线索: β_app > 1 = 聚束的强证据; 亮温度 T_B > 1e12 K (逆康普顿灾变极限) 必须用 δ > 1 解释; 声称的倾角/γ/β_app 组合与 δ 关系不自洽 = 参数错误。'
  source: Urry & Padovani 1995, PASP 107, 803; Rybicki & Lightman 辐射过程
  confidence: established
