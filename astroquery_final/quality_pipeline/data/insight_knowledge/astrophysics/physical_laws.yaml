  content: '引力红移: 光子逃出引力势井损失能量, 频率降低; 弱场近似 z = GM/(r c^2) = v_esc^2/(2c^2) (v_esc 为逃逸速度); 严格 Schwarzschild 形式 z = (1 - 2GM/(R c^2))^(-1/2) - 1 (R → r_s 时发散)。


    数值: 太阳表面 z = 2.1e-6 (等效 ~0.6 km/s); 白矮星 (0.6 Msun, 0.01 Rsun) z ≈ 1.3e-4 ≈ 38 km/s; 中子星 (1.4 Msun, 12 km) z ≈ 0.17-0.25, 弱场公式偏差 ~30% 必须用严格式; 星系团核 ~1e-5。


    物理原理: 引力时间膨胀使远离引力源的观测者测得光子频率降低; 效应与波长无关, 是广义相对论三大经典检验之一。


    应用: 白矮星质量-半径关系观测检验 (z 同时编码 M 与 R), 中子星致密度的独立探针, 光谱建模前需扣除引力红移。


    判定线索: 白矮星视向速度相对星团/场参考系系统性偏红 ~30-50 km/s = 引力红移未扣除而非反常运动; 声称的中子星 z > 0.7 需极软状态方程, 通常提示拟合错误; 把引力红移当多普勒速度会高估动力学质量。'
