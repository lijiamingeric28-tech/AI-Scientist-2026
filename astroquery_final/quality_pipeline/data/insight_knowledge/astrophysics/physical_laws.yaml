- id: heat_capacity_degenerate
  title: 简并物质热容与白矮星冷却
  category: physical_law
  tags:
  - heat_capacity
  - white_dwarf
  - cooling
  - fermi
  - mestel
  - specific_heat
  - crystallization
  applies_to:
    fields:
    - luminosity
    - effective_temperature
    entities:
    - white_dwarf
    - neutron_star
  hypothetical_queries:
  - 白矮星为什么冷却那么慢
  - 简并电子热容和温度什么关系
  - 白矮星冷却时标是多少
  content: '简并电子热容: 强简并 Fermi 气 (T << T_F) 只有 Fermi 面附近 kT 壳层电子可激发, c_v^e = (pi^2/2) k_B N (T/T_F) — 与 T 成正比, 远小于经典值 (3/2 N k_B)。

    白矮星内部 T_F ~ 1e9 K (rho ~ 1e6 g/cm^3), T_c ~ 1e7 K 时电子热容仅 ~经典值的 1%。

    储热来源: 白矮星热容由离子晶格主导 (近经典 3 k_B/离子, Debye 温度 theta_D ~ 1e6-1e7 K); 电子热容仅在低质量/高光度端重要 (0.5 Msun、T_c ~ 1e7 K 时约 0.25 倍离子热容)。

    Mestel 冷却律 (1952): L ∝ M T_c^(7/2) (等温简并核 + Kramers 不透明包层)。

    冷却时标: t ≈ (1e8/A) (M/Msun)^(5/7) (L/Lsun)^(-5/7) yr (A 为核离子平均原子量): 0.6 Msun 白矮星冷却至 ~1.24e4 K (L ~ 1.3e-3 Lsun) 约 1 Gyr; 至 ~3.5e3 K (L ~ 1e-5 Lsun) 需 10-12 Gyr — 银河系宇宙学时钟。

    修正: 高光度端 (L > 1e-1.5 Lsun) 中微子冷却主导; T < ~6e3 K 结晶释放潜热使冷却暂缓; T < 0.1 theta_D 时 Debye 热容 ∝ T^3 加速冷却。

    物理原理: Pauli 不相容使绝大多数电子无法参与热激发 — 简并压与热容解耦, 储热在离子晶格; 冷却速率 = 离子储热/表面光度。

    判定线索: 白矮星 (L, T_eff, 年龄) 组合违反 Mestel 外推 (高亮却标古老年龄) = 冷却模型/质量错误或未计中微子项; 声称简并气 T_c > T_F 需复核密度; 中子星热容由超流隙决定且更小、冷却更快, 与白矮星冷却时标混用会差数量级。'
  source: Mestel 1952, MNRAS 112, 583; Shapiro & Teukolsky 黑洞、白矮星与中子星; Fontaine, Brassard & Bergeron 2001, PASP 113, 409
  confidence: established
  ranges:
    wd_fermi_temperature:
      lo: 500000000.0
      hi: 2000000000.0
      unit: K
- id: radiative_cooling_function
  title: 等离子体辐射冷却函数
  category: physical_law
  tags:
  - cooling_function
  - radiative_cooling
  - bremsstrahlung
  - line_cooling
  - cooling_time
  applies_to:
    fields:
