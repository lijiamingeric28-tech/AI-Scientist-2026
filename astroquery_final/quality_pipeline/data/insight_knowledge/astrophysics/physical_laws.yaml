    - 阿尔芬波速 v_A = B/sqrt(4πρ) ≈ 2.18e11 B(Gauss)/sqrt(n_e(cm^-3)) cm/s: 星际介质 (B ~ 3-6 μG) ~5-10 km/s, 日冕 ~1000-2000 km/s;

