- id: tidal_forces_roche
  title: 潮汐力与洛希极限 (潮汐瓦解)
  category: physical_law
  tags:
  - tidal
  - roche_limit
  - tidal_disruption
  - tde
  - tidal_force
  hypothetical_queries:
  - 洛希极限怎么计算
  - 潮汐瓦解事件需要什么条件
  - 行星环为什么位于洛希极限之内
  applies_to:
    fields:
    - orbital_period
    - orbital_separation
    - density
    - stellar_mass
    entities:
    - binary_star
    - star
    - exoplanet
    - black_hole
  content: '潮汐力: 主星引力梯度产生的差动力, 对尺度 d 的伴体 ΔF ≈ 2GM_p m d/r^3 (r 为轨道距离) — 近侧引力强于远侧, 天体被拉伸; 潮汐加速度 ∝ M_p/d^3, 衰减比引力本身快 (1/r^3 vs 1/r^2)。


    洛希极限 (流体天体自引力与潮汐拉伸平衡的距离): d_R = 2.44 R_p (ρ_p/ρ_s)^(1/3) (R_p、ρ_p 为主星半径/密度, ρ_s 为伴星密度; 刚体极限 ~1.26 R_p, 实际天体介于两者之间) — 进入此距离伴星无法保持完整形态。


    黑洞潮汐瓦解半径: R_t ≈ R_* (M_BH/M_*)^(1/3) — 太阳型恒星被 1e6 Msun 黑洞瓦解于 ~100 Rsun; 与事件视界之比 R_t/r_s ≈ 2.4e5 (M_BH/Msun)^(-2/3): 质量 > ~1e8 Msun 的黑洞 R_t < r_s, 恒星整体落入视界而无瓦解耀发。


    物理原理: 瓦解是自引力与潮汐拉伸的竞争, 洛希极限处两者相等; 决定瓦解的是密度而非质量。


    应用: 行星环形成 (环位于主星洛希极限内), 潮汐瓦解事件 (TDE, X 射线/光学耀发, 发生率 ~1e-5/星系/年), 密近双星质量转移 (洛希瓣是等势面概念, 勿与洛希极限混淆)。


    判定线索: 伴星/卫星轨道半径小于洛希极限却形态完整 = 主/伴星密度或半径单位错误; TDE 要求 R_t > r_s, 对超巨黑洞的『TDE』记录需复核 (物理上不可能)。'
  source: Roche 1848; Rees 1988, Nature; TDE 综述 (Gezari 2021)
  confidence: established
  ranges:
    roche_limit_factor:
