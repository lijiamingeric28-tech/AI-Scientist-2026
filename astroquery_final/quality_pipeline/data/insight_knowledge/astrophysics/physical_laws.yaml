- id: radiation_pressure_force
  title: 辐射压力 (光子动量与辐射压梯度)
  category: physical_law
  tags:
  - radiation_pressure
  - photon_momentum
  - eddington_ratio
  - dust_opacity
  - stellar_wind
  applies_to:
    fields:
    - luminosity
