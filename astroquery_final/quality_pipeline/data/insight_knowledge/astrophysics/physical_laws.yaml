  content: '恒星振荡按恢复力分类: 压力模 (p 模, 声波驻波, 高频) 与重力模 (g 模, 浮力/密度分层, 低频, 仅在对流稳定区存在); 主序类日恒星 p 模周期 3-10 分钟, 红巨星/白矮星 g 模周期小时量级。


    渐近关系: 同角阶 l、相邻径向序 n 的 p 模频率差 (大间隔) Δν ≈ (2∫ dr/c_s)^(-1), 模式位置 ν_nl ≈ Δν(n + l/2 + ε) 加小间隔修正。


    定标关系 (以太阳归一): Δν ∝ (M/R^3)^(1/2) (平均密度定标), ν_max ∝ (M/R^2)/sqrt(T_eff) (Brown 1991) — 太阳 Δν ≈ 135.1 μHz, ν_max ≈ 3090 μHz (Huber 2011 基准); 红巨星 Δν 降至 0.5-10 μHz。


    由 (Δν, ν_max, T_eff) 反解 R ∝ ν_max Δν^-2 T_eff^0.5, M ∝ ν_max^3 Δν^-4 T_eff^1.5 (精度 ~5-10%, 计入 Γ1 与平均分子量修正后更高)。


    g 模周期间隔 ΔP 近似常数 → 红巨星核区自转与氢壳层结构诊断; Cepheid/RR Lyrae/δ Scuti 属径向基模脉动 (周期小时-天)。


    物理原理: 恒星是声学与浮力共振腔, 本征频率编码密度、温度剖面与内部结构 — 观测恒星内部的唯一直接手段。


