  hypothetical_queries:
  - 等离子体冷却函数是什么
  - 星系团气体冷却时标怎么估算
  - 为什么1e5 K附近气体冷却最快
  content: '冷却函数 Lambda(T) [erg cm^3 s^-1]: 单位体积辐射冷却率 q = n_e n_H Lambda(T) — 气体冷却与温度演化的基本输入。

    温度分段 (太阳丰度): T > 1e7 K 轫致辐射主导, Lambda ∝ T^(1/2), 1e7 K 时 ~1e-23。

    1e5-1e7 K 金属线冷却 (O/Fe/Ne 禁线) 主导, Lambda ~ 1e-23-1e-22 且随 T 振荡, ~1e5 K 附近峰区可达 ~1e-21 量级 — 该温度区气体冷却最快。

    T < 1e4 K 中性区 CII 158 um 精细结构线与 H2 转动线冷却, Lambda 降至 ~1e-26-1e-24, 尘埃红外辐射成为重要通道。

    金属丰度依赖: 线冷却区 Lambda ∝ Z 近似线性 (低金属度气体冷却率大幅下降), 轫致区无 Z 依赖 — 丰度未知时用太阳丰度冷却率有 2-3 倍不确定。

    冷却时标: t_cool = (5/2) n_tot k T / (n_e n_H Lambda) ∝ T/(Lambda n): 星系团热气体 (T ~ 1e7-1e8 K, n ~ 1e-3 cm^-3) ~1e9-1e10 yr (团核密度高时短至 ~1e8 yr — 冷流问题)。

    1e4 K 分子云 t_cool ~ 1e5-1e6 yr 与自由落体时标可比, 是恒星形成的必要条件。物理原理: 冷却率 = 碰撞激发线辐射 + 复合 + 轫致 + 尘埃辐射之和; 平衡温度由加热 (光致电离/激波/宇宙线) 与冷却竞争决定。

    判定线索: 声称冷却时标与 T/n 违反 t_cool ∝ T/(Lambda n) 量级 = 密度或温度单位错误 (cm^-3 vs m^-3 差 1e6 倍); 未标金属丰度假设的冷却时标跨文献差 2-3 倍属正常; 团核 t_cool 远短于哈勃时间而无加热机制 = 复核密度/温度字段。'
  source: Sutherland & Dopita 1993, ApJS 88, 253; Draine 2011 天体物理辐射过程
  confidence: consensus
