  hypothetical_queries:
  - 激波后的温度怎么算
  - Rankine-Hugoniot条件是什么
  - 强激波压缩比为什么是4
  content: '激波: 超声速流 (马赫数 M = v/c_s > 1) 在间断面上满足 Rankine-Hugoniot 跳跃条件 (质量/动量/能量守恒), 下游密度、压力、温度突增。

    强激波极限 (M >> 1): 压缩比 r = rho_2/rho_1 = (gamma+1)/(gamma-1) → 单原子理想气体 (gamma = 5/3) r -> 4。

    压力比 P_2/P_1 ∝ M^2; 激波系内下游流速 v_2 = v_1/4; 磁化介质 (阿尔芬马赫数) 与辐射冷却 (压缩比可 >> 4) 修正。

    激波后温度: T_2 = 2.25e7 mu (v_s/1000 km/s)^2 K (mu 为平均分子量, 完全电离宇宙丰度 mu ~ 0.6) → T_2 ≈ 1.4e7 (v_s/1000 km/s)^2 K, kT ≈ 1.2 (v_s/1000)^2 keV。

    应用: 超新星遗迹 (v ~ 100-1000 km/s) 产生 1e5-1e8 K 的 X 射线等离子体, 由温度反推激波速度与动力学年龄; 辐射主导的激波突破阶段温度远低 (T ∝ rho^(1/4) v^(1/2))。

    恒星风-ISM 相互作用 (弓形激波); 粒子加速 (扩散激波加速 → 同步辐射)。

    物理原理: 信息以声速传播, 超声速扰动堆积成间断; 跳跃条件只依赖上下游热力学态, 与内部耗散机制无关。

    判定线索: 激波速度与后激波温度违反 T ∝ v^2 关系 (差 >2-3 倍) = 速度单位错误 (km/s vs m/s) 或冷却/磁场修正未计; 无冷却/磁场证据却声称压缩比 >> 4 = 模型错误; 遗迹 X 射线温度与射电形态的激波位置不自洽需复核。'
  source: Rankine 1870; Hugoniot 1887; Draine 天体物理辐射过程; Vink 2012, A&ARv 20, 49 (超新星遗迹)
  confidence: established
  ranges:
    strong_shock_compression:
