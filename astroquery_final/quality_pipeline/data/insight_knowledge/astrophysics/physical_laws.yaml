  hypothetical_queries:
  - 谱线生长曲线是什么
  - 饱和谱线为什么不能直接算柱密度
  - 阻尼翼怎么定中性氢柱密度
  content: '生长曲线: 等值宽度 W 随吸收原子柱密度 N 的增长分三段 — 线性段: W ∝ N (光学薄); 平段 (饱和): W 仅随 ln N 缓慢增长; 阻尼段: W ∝ (N gamma/f)^(1/2)。

    线性段公式: 柱密度 N ≈ 1.13e20 W/(lambda^2 f) cm^-2 (W/lambda 单位 A) — 光学薄极限下由 EW 直接定柱密度。

    饱和起点: 线心光深 tau_0 ~ 1 即进入平段 — 强共振线 (Ly-alpha, f = 0.416) N ~ 1e13-1e14 cm^-2 即饱和; 弱线 (f ~ 1e-3, 如多数 Fe I 线) 线性段可延伸至 N ~ 1e17 cm^-2。

    平段特征: W ~ (2 b/c) lambda sqrt(ln(...)) 量级 (b 为多普勒宽度), 对 N 极不敏感 — 丰度变化 10 倍 W 仅变 ~20-30%, 该区丰度精度严重下降。

    阻尼段: 由自然展宽/Stark/范德瓦尔斯展宽驱动, W ∝ (N gamma)^(1/2) — Ly-alpha 阻尼翼直接定中性氢柱密度 N_HI ~ 1e20-1e21 cm^-2, 该区柱密度恢复精度最好。

    物理原理: 线心先饱和后光子从线翼逃逸; 曲线形状由多普勒宽度 b (热+湍流)、振子强度 f 与阻尼常数 gamma 决定。

    应用: 双线法 (同元素强弱线对) 同时解 N 与 b; 恒星丰度与星际柱密度测量。

    判定线索: 用线性段公式反推饱和线柱密度严重低估 (可差 1-2 个量级); 同一元素强线与弱线丰度系统性差异 = 饱和未处理; 等效宽度列不标分辨率与 S/N 时弱线 EW 不可跨谱比较; 阻尼翼展宽与 N_HI 不自洽 = 分辨率或连续谱归一错误。'
  source: Strömgren 1948, ApJ 108, 242; Rybicki & Lightman 辐射过程; Draine 天体物理辐射过程
  confidence: established
- id: orbital_resonance_mechanics
  title: 轨道共振与潮汐锁定
  category: physical_law
  tags:
  - resonance
  - mean_motion
  - spin_orbit
  - tidal_locking
  - libration
  - laplace_resonance
  applies_to:
    fields:
    - orbital_period
    - eccentricity
    entities:
    - exoplanet
    - binary_star
  hypothetical_queries:
  - 轨道共振是什么意思
  - 潮汐锁定需要多长时间
  - 2:1轨道共振有什么后果
  content: '平均运动共振: 两天体公转周期整数比 (p:q 共振, 如 2:1、3:2), 共振摄动长期同相叠加使轨道能量与角动量持续交换。

    观测后果: 行星盘环隙、轨道离心率激发与轨道迁移; 会合点位于远心点的保护机制使某些构型长期稳定。

    共振宽度与天平动: 共振半宽 ∝ (m_perturber/M)^(1/2) 量级; 共振角在 Libration 区内振荡, 天平动时标 ~ 1e2-1e3 轨道周期。

    自转-轨道共振: 自转被潮汐锁定为轨道周期整数比 — 1:1 (圆轨道, 行星-卫星/热行星) 与 3:2 (离心轨道)。

    锁定时标: t_lock ∝ a^6 (Q/k_2) m_p/(m_s^2 R^3) (Peale 1977; Q 品质因子 10-500, k_2 Love 数), 距离六次方标度 — 距离翻倍时标 ×64。

    典型量级 (类日恒星): 热类木行星 (a ~ 0.02-0.05 AU) ~1e5-1e6 yr; ~0.1 AU ~1e7-1e8 yr; 宜居带 (a ~ 1 AU) ~1e10-1e12 yr, 通常超过系统年龄 — 不必然锁定 (依赖 Q/k_2 有 1-2 个量级不确定)。

    共振链: 多体系统可形成拉普拉斯型共振链 (1:2:4 模式), 单环偏离共振 → 迁移/潮汐演化历史或测量错误。物理原理: 共振是摄动频率匹配 — 能量交换长期累积 vs 非共振摄动平均抵消; 潮汐锁定是自转动能耗散使自转趋同轨道角速度。

    判定线索: 行星周期精确落在 2:1/3:2 共振比而无天平动/相位证据 = 周期混叠 (谐波混淆, 见周期搜索条目); 声称潮汐锁定却给非 1:1/3:2 自转比 = 参数错误; 共振判定对周期精度敏感, 周期列须给足有效数字。'
  source: Peale 1977, Icarus 32, 76; Murray & Dermott 太阳系动力学; Barnes 2017, CeMDA 129, 509
  confidence: established
- id: fluid_dynamics_shock
  title: 流体动力学激波 (Rankine-Hugoniot 跳跃条件)
  category: physical_law
  tags:
  - shock
  - rankine_hugoniot
  - mach_number
  - compression_ratio
