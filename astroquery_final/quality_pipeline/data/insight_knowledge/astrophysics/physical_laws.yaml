  content: '爱丁顿近似 (双流近似): 辐射强度角度分布取两半空间各向同性, 辐射场仅用 J、F 两矩描述并令 K = J/3 → 灰大气温度-光深关系 T^4 = (3/4) T_eff^4 (tau + 2/3): 光球 (tau = 2/3) 处 T = T_eff, 表面 (tau = 0) T = 0.841 T_eff (不为零, 由外部辐射场维持)。


    辐射扩散近似 (光学厚极限): 辐射通量 F = -(c/(3κρ)) ∇U_rad = -(16σT^3/(3κρ)) ∇T, U_rad = aT^4 — 恒星辐射区能量输运的基本方程, 与 Rosseland 平均不透明度 κ_R (按 1/κ 加权) 联用。


    物理原理: 光学厚介质中光子平均自由程 l = 1/(κρ) 远小于系统尺度, 辐射输运退化为热传导 (光子扩散); 爱丁顿近似只取角度矩前两阶, 为大气边界提供封边关系。


    应用: 恒星结构与大气模型 (灰大气 T(τ) 关系用于恒星演化代码边界), 吸积盘垂向结构, 辐射流体模拟 (flux-limited diffusion)。


    判定线索: 扩散近似要求 tau >> 1 — 光学薄区 (星系际介质、恒星外部大气) 直接套用会系统性低估温度; 外推表面温度与 0.84 T_eff 明显不符 = 非灰大气 (谱线/外部加热) 或参数错误。'
  source: Mihalas 恒星大气物理; MESA 灰大气模型文档
