    判定线索: 波动/激波速度显著超过热声速 (>2-3 倍 c_s) = 磁声波或非热驱动; 速度与 v_A ∝ B/sqrt(n) 定标矛盾 = 磁场/密度单位错误 (常见 Gauss↔Tesla 混淆, 差 1e4 倍)。'
