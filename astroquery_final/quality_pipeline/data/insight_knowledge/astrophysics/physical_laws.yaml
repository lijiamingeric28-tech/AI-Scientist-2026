  content: '高能电子与低能光子碰撞将其升频 (逆康普顿散射, IC):

    Thomson 区内单电子能量损失率 -dE/dt = (4/3) σ_T c U_ph γ^2

    (U_ph 为辐射能量密度, σ_T ≈ 6.65e-25 cm^2); 上散射光子能量 hν'' ≈ γ^2 hν。

    IC 与同步辐射冷却之比 = U_ph / U_B (U_B = B^2/(8π)):

    辐射场强于磁场的源区 IC 主导; U_ph >> U_B 时冷却过快出现 Compton 灾难。

    物理原理: 光子被相对论电子弹性散射升频 — 电子动能转化为高能光子;

    Klein-Nishina 区 (hν'' ~ m_e c^2 ≈ 511 keV) 截面下降, 冷却率低于

    Thomson 外推, 高能段谱软化。

