  applies_to:
    fields:
    - magnetic_field_strength
    - luminosity
    entities:
    - star
    - ism_object
    - pulsar
    - agn
  content: '磁重联: 电流片内磁力线断裂并重新连接, 磁能转化为粒子动能/热/辐射 — 太阳耀斑、磁层亚暴、吸积盘冕加热的核心机制; 理想 MHD 冻结定理在扩散区内被电阻打破。


    Sweet-Parker 模型: 入流速度 v_in/v_A = S^(-1/2) (S 为 Lundquist 数 = v_A L/η, L 为电流片长度): 日冕 S ~ 1e12-1e14 → v_in/v_A ~ 1e-6-1e-7, 能量释放时标比观测的耀发时标 (1e2-1e3 s) 长 4-6 个量级 — 慢重联困境。


    Petschek 模型: 慢激波对把扩散区限制在 X 点附近, v_in ≈ v_A/ln(S) ~ 0.01-0.1 v_A (几乎与电阻率无关) — 与耀斑观测一致; 高 S 数值模拟显示 Sweet-Parker 电流片对撕裂模 (plasmoid) 不稳定, 级联触发快重联。


    能量标度: 太阳耀斑释放 1e29-1e32 erg, 上限为活动区磁能 B^2/(8π) × 体积; 重联速率 = 入流速度/阿尔芬速度。


    物理原理: 磁张力与电阻耗散的竞争决定重联速率; 快重联需缩短扩散区或增强有效电阻 (反常电阻/湍流)。


    判定线索: 时标与源区尺度用 Sweet-Parker 外推矛盾数级 = 存在快重联 (Petschek/plasmoid); 耀发能量超过源区磁能上限 = 磁场或体积单位错误。'
  source: Sweet 1958; Parker 1957; Petschek 1964; Priest & Forbes 磁重联综述
