- id: jeans_mass_stability
  title: 金斯质量与引力坍缩判据
  category: physical_law
  tags:
  - jeans
  - collapse
  - molecular_cloud
  - star_formation
  applies_to:
    fields:
    - temperature
    - mass
    entities:
    - ism_object
    - hii_region
  content: '金斯判据 (Jeans 1902): 等温气体云热压 vs 自引力的稳定性分析,

    扰动增长条件 lambda > lambda_J = c_s sqrt(pi/(G rho)), 等价金斯质量:

    M_J = (5 k T / (G mu m_p))^(3/2) (3 / (4 pi rho))^(1/2) ~ T^(3/2) rho^(-1/2)

    云质量 > M_J → 引力坍缩; < M_J → 热压支撑稳定。

    典型值: 巨分子云 (T~10-20 K, n~1e2-1e3 cm^-3) M_J ~ 1e3-1e4 Msun;

    致密核 (T~10 K, n~1e4-1e5 cm^-3) M_J ~ 0.5-5 Msun (恒星质量量级);

    T=100 K、n~1e-24 g/cm^3 (HII 区周缘) M_J ~ 2e4 Msun。

    物理: 坍缩中密度增大 → M_J 下降 → 碎裂 (fragmentation) 形成星团;

    外部压力 (Bonnor-Ebert) 与磁场可降低有效判据。

    判定线索: 冷而密云记录质量远大于 M_J 却标 ''''稳定'''' = 矛盾;

    温度单位错标 (K vs 1e4 K) 使 M_J 相差 1e6 倍。'
  source: Jeans 1902; 恒星形成讲义 (Stony Brook)
