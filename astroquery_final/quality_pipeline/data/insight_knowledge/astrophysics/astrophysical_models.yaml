- id: r_process_nucleosynthesis
  title: r 过程核合成 (快中子俘获)
  category: physical_law
  tags:
  - r_process
  - neutron_capture
  - kilonova
  - neutron_star_merger
  - nucleosynthesis
  applies_to:
    fields:
    - abundance
    entities:
    - neutron_star
    - supernova
  content: 'r 过程 (rapid neutron capture): 中子俘获速率远超 beta 衰变, 沿中子滴线附近

    路径快速合成约一半超铁重元素 (A > 70, 至 U/Th), 需极高密度中子环境

    (n_n ~ 1e20 cm^-3)。


    主位点: 双中子星并合 — 千新星 (kilonova) 观测证实并合抛射物 (~1e-2 Msun)

    直接合成 r 过程元素; 其他候选: 磁化坍缩星喷流 (collapsar/magnetorotational),

    核塌缩超新星中微子驱动风 (仅产较轻 r 元素)。


    丰度特征: 太阳系 r 过程丰度 (总丰度扣 s 过程残差) 主峰在 A ~ 130 与 A ~ 195

    (中子闭壳 N = 82, 126 的等待点), 附稀土峰 A ~ 165; 太阳系 Eu 的 ~94% 来自

    r 过程 (r/s 分离的标准标尺)。


    物理原理: 中子冻结 (freeze-out) 后 beta 衰变回稳定谷; 峰间元素 (A ~ 110-120)

    需裂变循环 (fission recycling) 补充, 是位点中子丰度的诊断。


    判定线索: 恒星 [Eu/Fe] 增强是 r 过程富集标志 (与 s 过程 Ba 区分);

    并合率 (引力波观测 ~10-1700 Gpc^-3 yr^-1) 与银河系 Eu 产量的一致性

    用于检验位点贡献; 单一核塌缩超新星产全部重 r 元素与观测丰度模式矛盾。'
  source: Burbidge et al. 1957 (B2FH); Arnould, Goriely & Takahashi 2007, Phys. Rep. 450, 97; Metzger 2019 (千新星综述)
  confidence: consensus
  hypothetical_queries:
  - r 过程重元素在哪里合成
  - 千新星与 r 过程元素的关系
  - r 过程丰度峰位于哪些质量数
- id: s_process_nucleosynthesis
  title: s 过程核合成 (慢中子俘获)
  category: physical_law
  tags:
  - s_process
  - neutron_capture
  - agb
  - nucleosynthesis
  - branch_point
  applies_to:
    fields:
    - abundance
    - metallicity
    entities:
    - evolved_star
    - star
  content: 's 过程 (slow neutron capture): 中子俘获慢于 beta 衰变, 沿稳定谷逐级合成

    重元素; 主分量 (main component) 位点为低质量 AGB 星 (1-3 Msun) 的热脉冲期;

    弱分量 (weak component) 来自大质量星 (22Ne 源), 产轻 s 元素 (Sr/Y/Zr)。


    中子源: 13C 袋 (13C(alpha,n)16O, 脉冲间期辐射燃烧, 提供主要中子暴露) 与

    22Ne(alpha,n)25Mg (热脉冲对流期, T > 3e8 K 激活)。


    丰度特征: 中子闭壳 (N = 50, 82, 126) 处堆积三峰: Sr (A ~ 88)、Ba (A ~ 138)、

    Pb (A ~ 208); 太阳系 Ba 的 ~80-85% 来自 s 过程 (与 r 过程 Eu 互补)。


    分支点 (branch point): 半衰期与中子俘获竞争的不稳定核 (如 85Kr) 处分流,

    产物同位素比是恒星温度/中子密度的探针; 指示量 [hs/ls] 与 [Pb/hs] 表征分布形状。


    物理原理: 每次热脉冲的 He 壳层点燃释放中子, 数十次脉冲累积中子暴露;

    13C 袋尺寸由对流混合/旋转不确定度支配。


    判定线索: [Ba/Fe] 与 [Pb/Fe] 同时增强是 s 过程主分量标志; 低 Eu/Ba 比值指示

    s 主导 (r 过程 Eu 高则相反); 贫金属 AGB 星 Pb 超丰 ([Pb/Fe] > 2) 需高暴露事件。'
  source: Burbidge et al. 1957; Busso, Gallino & Wasserburg 1999, ARA&A 37, 239; Karakas & Lattanzio 2014
  confidence: consensus
  hypothetical_queries:
  - s 过程核合成发生在什么恒星
  - AGB 星 13C 袋中子源的作用
  - 钡超丰指示什么核合成过程
- id: stellar_feedback_model
  title: 恒星反馈模型 (能量与动量注入)
  category: galactic_model
  tags:
  - stellar_feedback
  - supernova
  - radiation_pressure
  - momentum_injection
  - star_formation
  applies_to:
    fields:
    - star_formation_rate
    - mass_loss_rate
    entities:
    - star
    - ism_object
    - galaxy
  content: '恒星反馈: 大质量星以超新星、星风、辐射压、光电离与宇宙线向 ISM 注入能量

    动量, 是星系恒星形成效率 (SFE) 的主调控机制。


    能量预算: 核塌缩超新星典型动能 E_SN ~ 1e51 erg (1e50-2e51), 事件率系数

    alpha_SN ~ 0.01-0.02 每 Msun (Salpeter IMF) → 能量注入率 ~7e41 (SFR/1 Msun/yr)

    erg/s; 动量注入 p_SN ~ 3e5 km/s Msun (Sedov 阶段动量提升约一个量级),

    星团并合超新星可至 ~3e6 km/s Msun。


    其他通道: O 星风 (Mdot ~ 1e-7 到 1e-5 Msun/yr, 见 stellar_wind_mass_loss) 与

    电离光子辐射压 (P ~ L/c) 在主序期预吹出低密度通道, 使后期超新星能量有效

    耦合 (pre-SN feedback); 宇宙线携带超新星能量的 10-50%。


    调节结果: 局域 SFE 被压低至每自由落体时标 ~1-5%, 形成 Kennicutt-Schmidt 关系

    (SFR 面密度 ~ 气体面密度^1.4) 与星系主序散射。


    物理原理: 能量注入与辐射冷却竞争 — 动量守恒雪橇阶段 (壳层扩张) 是星际尺度

    反馈核心; 反馈强度与势阱深度决定吹出与淬灭。


    判定线索: 声称 SFE > 10%/自由落体时标的恒星形成需强证据; 反馈能量记录

    超 1e51 erg/SN 数倍 (无并合/聚集) 属异常。'
  source: McKee & Ostriker 2007, ARA&A 45, 565; Agertz et al. 2013, ApJ 770, 25; Krumholz 2014, Phys. Rep. 539, 49
  confidence: consensus
  ranges:
    sn_energy:
      lo: 5.0e+50
      hi: 2.0e+51
      unit: erg
  hypothetical_queries:
  - 超新星反馈注入多少能量和动量
  - 恒星反馈如何压低恒星形成效率
  - 辐射压与星风反馈的作用机制
- id: galaxy_merger_evolution
  title: 星系并合演化与类星体触发
  category: galactic_model
  tags:
  - merger
  - dynamical_friction
  - tidal_stripping
  - quasar_triggering
  - galaxy_evolution
  applies_to:
    fields:
    - redshift
    - star_formation_rate
    entities:
    - galaxy
    - galaxy_cluster
    - agn
    - quasar
  content: '星系并合: 质量比 < 4:1 的 major 并合经动力学摩擦消耗轨道能, 卫星坠入主星系;

    时标 tau_merge/tau_dyn = 1.17 f_df Theta (M_host/M_sat)/ln(Lambda) (Binney &

    Tremaine, tau_dyn ~ 1.4 Gyr at z=0), N 体修正 (Boylan-Kolchin 2008) 后

    典型 major 并合 ~1-3 Gyr, 小质量比时标更长。


    潮汐剥离 (tidal stripping): 卫星半径大于潮汐半径部分被主星系潮汐力剥除,

    形成潮汐尾/流与壳层; 暗晕先于恒星物质损失 (密度剖面依赖)。


    类星体触发: 并合潮汐力矩使气体向内流入 (Barnes 1996) → 中心气体堆积 →

    SMBH 吸积 (类星体阶段: 延迟 ~5e8 yr、持续 ~5e8 yr) → 反馈吹出气体淬灭

    恒星形成 → 遗留红椭圆星系 (ULIRG → 类星体 → 椭圆演化链)。


    物理原理: 动力学摩擦来自卫星尾流的引力聚焦减速; 潮汐力矩使气体失角动量

    内流, 是并合触发恒星形成与类星体吸积的共同物理基础。


    判定线索: 声称的并合应有形态证据 (潮汐尾/双核/桥); 并合组装的巨椭圆

    需 >1 Gyr 与恒星年龄一致; 类星体活动与并合形态共存是短瞬态。'
  source: Toomre & Toomre 1972; Barnes & Hernquist 1996; Hopkins et al. 2008, ApJS 175, 356; Fakhouri & Ma 2007
  confidence: consensus
  hypothetical_queries:
  - 星系并合的典型时标有多久
  - 并合如何触发类星体活动
  - 潮汐尾是星系并合的证据吗
- id: cluster_mass_estimation
  title: '星系团质量估计: 三种方法对比'
  category: physical_law
  tags:
  - cluster_mass
  - hydrostatic_bias
  - weak_lensing
  - virial
  - x_ray
  applies_to:
    fields:
    - velocity_dispersion
    - temperature
    - mass
    entities:
    - galaxy_cluster
    - galaxy
  content: "星系团质量估计三方法 (假设独立, 系统差互补; 公式细节见 virial_theorem_cluster_mass):\n1. 维里定理: M ~ 3 sigma_v^2 R / G, 假设动力学弛豫 — 亚结构/并合污染可致\n   高估 30-50%。\n2. X 射线静水平衡: M(<r) = -k T r/(G mu m_p) (dln rho_g/dln r + dln\
    \ T/dln r),\n   假设 ICM 静水平衡 — 湍流与非热压 (~10-20%) 致系统低估: 静力偏置\n   1-b = M_HE/M_WL 实测 0.6-1.0, 典型 ~0.74-0.77 (Lovisari 2020)。\n3. 弱透镜: 直接测引力势 (统计剪切, 见 weak_lensing_theory), 无动力学/静水平衡\n   假设 — 最稳健, 受投影效应、源红移分布\
    \ P(z) 与暗晕剖面假设限制。\n\n物理原理: 三方法分别探测动力学/热学/引力势, 差异反映 ICM 非热压与动力学状态;\n静力偏置 1-b 即非热压支持的定量估计。\n\n交叉校验: 弛豫团 M_X/M_WL ~ 0.7-0.9 属正常 (非数据错误); 并合团 X 射线质量\n可高估; 偏差 >2 倍需复核红移/温度/距离。标度律: M-T (M ~ T^3/2) 与 M-sigma\n\
    用于外推, 质量定义须注明 R500/R200 与 overdensity (换算差 ~30%)。\n\n判定线索: 引用团质量必须注明方法 (维里/X 射线/弱透镜) 与 overdensity;\n声称质量与两种以上独立方法严重冲突时, 优先怀疑温度/速度弥散/红移单位。"
  source: Lovisari et al. 2020, A&A 644, A78; Kravtsov & Borgani 2012, ARA&A 50, 353; Hoekstra et al. 2013, Space Sci. Rev. 177, 75
