    entities:
    - galaxy
  content: 'Madau-Dickinson 拟合 (Madau & Dickinson 2014): 宇宙恒星形成率密度 psi(z) 的

    经验解析式:


    psi(z) = 0.015 (1+z)^2.7 / [1 + ((1+z)/2.9)^5.6] Msun/yr/Mpc^3 (Salpeter IMF)。


    峰值: psi 在 z ~ 1.9-2 (宇宙年龄 ~3.5 Gyr) 达到最大 ~0.1-0.15 Msun/yr/Mpc^3,

    之后指数下降 (e-folding ~3.9 Gyr), 今日值约为峰值的 1/10。


    物理原理: z<2 的下降由恒星形成淬灭 (环境效应/AGN 反馈) 主导; 高红移端 (z>8)

    是否继续上升或快速衰减由 JWST 观测约束 (尘埃改正与选择效应是关键系统差)。


    积分含义: 约一半恒星质量在 z<1.3 形成; z>6 (再电离纪元) 形成的恒星不足 1%。


    判定线索: 记录红移处的 SFRD 若超过峰值 3-5 倍需复核 (尘埃/测光红移错误);

    z>3 的 SFRD 必须注明测法 (紫外+尘埃改正 vs 红外/亚毫米), 两者系统差可达数倍。'
  source: Madau & Dickinson 2014, ARA&A 52, 415; Bouwens et al. 2015, ApJ 803, 34
  confidence: consensus
