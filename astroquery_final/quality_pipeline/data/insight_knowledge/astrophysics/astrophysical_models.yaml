- id: gravitational_lensing
  title: 引力透镜与爱因斯坦角
  category: physical_law
  tags:
  - lensing
  - einstein_radius
  - deflection
  applies_to:
    fields:
    - redshift
    - distance
    - einstein_radius
    entities:
    - galaxy
    - galaxy_cluster
    - star
    - quasar
  content: '引力透镜: 光线被质量偏折, 点质量偏折角 alpha = 4 G M / (c^2 b) (b 碰撞参数)。

    点质量透镜的爱因斯坦角:

    theta_E = sqrt(4 G M D_LS / (c^2 D_L D_S)) (D_L/D_S/D_LS 为角直径距离)

    实用估式: theta_E ~ 0.9 arcsec (M/1e11 Msun)^(1/2) (D/1 Gpc)^(-1/2)。

    典型尺度: 星系级透镜 (M~1e11-1e12) theta_E ~ 1-2 arcsec; 星系团 (M~1e15) theta_E ~ 20-50 arcsec;

    恒星微透镜 theta_E ~ 1e-3 arcsec 量级 (微角秒-毫角秒)。

    完全对准 → 爱因斯坦环; 偏开 → 双像 (强透镜); 弱透镜为统计性剪切。

    SIS 等温球透镜: theta_E = 4 pi (sigma_v/c)^2 D_LS/D_S, 由像距可直接测速度弥散。

    判定线索: 环半径与质量满足 M(<theta_E) = theta_E^2 c^2 D_L D_S / (4 G D_LS),

    角度-质量-距离组合超出量级 (如 10 arcsec 环配 1e11 Msun) 需复核红移或质量。'
