    entities:
    - galaxy
    - quasar
  content: '再电离纪元 (EoR): 首批光源 (年轻星系星族、类星体) 在 z ~ 6-10 将宇宙中性氢

    重新电离, 结束黑暗时代; 中性为主持续到 z ~ 6, 完全电离约在 z ~ 5.5。


    光学深度: CMB 光子经自由电子 Thomson 散射的积分光学深度 tau_e = 0.054 +/- 0.007

    (Planck 2018), 对应再电离半程红移 z_reion ~ 7-8 (模型依赖, 约 6.5-8.8)。


    探测手段: Gunn-Peterson 效应 (z>6 类星体光谱 Ly-alpha 森林消失为连续吸收槽,

    约束中性分数 > ~1e-3); 21 cm 断层成像 (LOFAR/SKA) 直接测中性氢;

    CMB 大角尺度 E 模极化约束 tau_e。


    物理原理: 电离光子预算 = 恒星形成率 x 电离光子产额 x 逃逸分数 (f_esc ~ 10-20%)

    需超过复合率; 电离不均匀 (高密度区先电离), X 射线加热 (z ~ 15-20) 先于电离。


    判定线索: z>6 类星体光谱 Ly-alpha 森林消失是中性分数强约束, 与声称的

    "z~6 仍中性分数 ~1" 记录矛盾; 引用 z_reion 必须注明方法 (CMB 极化 vs

    类星体光谱 vs 21 cm), 不同方法相差 ~1-2 属正常。'
  source: Planck Collaboration 2020, A&A 641, A6; Fan et al. 2006, ARA&A 44, 415; Zaroubi 2013 (EoR 综述)
  confidence: established
  ranges:
    optical_depth:
      lo: 0.045
      hi: 0.065
    reionization_redshift:
      lo: 5.5
      hi: 9.0
