  content: 'Schechter 光度函数 (Schechter 1976): 星系光度分布的解析拟合,

    phi(L) dL = phi* (L/L*)^alpha exp(-L/L*) d(L/L*), 绝对星等形式:

    phi(M) = 0.4 ln10 phi* 10^(0.4 (alpha+1)(M* - M)) exp(-10^(0.4 (M* - M)))。

    典型参数 (局部 z~0.1, SDSS r 波段, Blanton et al. 2003):

    alpha = -1.05 +/- 0.01, M* - 5 log10 h = -20.44, phi* ~ 1.5e-2 h^3 Mpc^-3;

    不同 survey/波段拟合散布在 alpha ~ -1.0 到 -1.4, M* ~ -20.0 到 -21.5

    (任务书中 alpha=-1.2/M*=-20.8 属较陡拟合, 蓝波段与高红移更陡)。

    物理原理: 幂律暗端对应暗晕质量函数, 指数截断反映恒星形成效率上限。

    判定线索: 比较不同 survey 的 M* 必须换算同一波段与 h 假设;

    单条星系记录不能直接检验此函数, 但亮度密度积分用于完整性检查。'
