    entities:
    - galaxy
    - galaxy_cluster
  content: 'CMB 各向异性角功率谱 C_l: 第一声学峰位于 l ~ 220 (角尺度 ~1°), 峰间距

    Delta l ~ 300, 对应声学视界在最后一散射面的投影。


    声学振荡: 光子-重子流体在引力势阱中压缩/稀疏振荡; 奇偶峰高度比敏感于

    光子-重子比 (偶峰被重子拖曳抑制), 阻尼尾 (l > 1000, Silk 扩散) 约束

    n_s 与重子密度。


    关键锚点: 声学视界角径 theta_* = 0.01041 rad (Planck 2018) 是独立于距离阶梯的

    标准尺 — 结合平直几何得 H0 = 67.4 km/s/Mpc, 与局部距离阶梯 (~73 km/s/Mpc)

    的 ~5 sigma 张力是当前未解问题 (见 lambda_cdm_parameters)。


    基础参数: Omega_b h^2 = 0.0224, Omega_c h^2 = 0.120, n_s = 0.965 (TT,TE,EE+lowE)。


    物理原理: 声学视界 r_s = ∫ c_s dt/a; 峰位置 l ~ pi/theta_* 量级 (含转移函数修正),

    峰尺度随几何曲率移动 (开宇宙向高 l)。


    判定线索: 引用 H0/Omega_m 必须注明来源 (CMB vs 距离阶梯 vs BAO);

    声称的 CMB 首峰位置或 theta_* 与 l~220 / 0.01041 rad 锚点偏离过大需复核数据。'
  source: Planck Collaboration 2020, A&A 641, A6
  confidence: established
  ranges:
    theta_star:
      lo: 0.0103
      hi: 0.0105
      unit: rad
  hypothetical_queries:
  - CMB 第一声学峰位于哪个多极矩
  - CMB 功率谱怎么约束宇宙学参数
  - 声学视界角径 theta_star 的标准值
- id: reionization_epoch
  title: 宇宙再电离纪元 (EoR)
  category: cosmological_model
  tags:
  - reionization
  - epoch_of_reionization
  - optical_depth
  - gunn_peterson
  - eors
  applies_to:
    fields:
