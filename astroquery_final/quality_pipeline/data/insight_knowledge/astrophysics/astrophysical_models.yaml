- id: solar_stellar_dynamo
  title: 恒星发电机与太阳 11 年周期
  category: physical_law
  tags:
  - dynamo
  - solar_cycle
  - magnetic_field
  - tachocline
  applies_to:
    fields:
    - magnetic_field_strength
    - cycle_period
    entities:
    - star
  content: '恒星发电机: 导电流体运动 (Rm >> 1, 磁冻结) 放大并维持磁场;

    太阳: 11 年 Schwabe 黑子周期 + 22 年 Hale 磁周期 (每周期极性反转)。

    alpha-Omega 机制 (Parker 1955): 较差自转 (Omega effect) 剪切极向场生成环向场;

    螺旋对流 (科里奥利力, alpha effect) 扭曲环向场再生极向场, 循环转换。

    关键位点: 对流区底部 tachocline (刚性与较差旋转过渡带, 日震学证实),

    存储强环向场; 磁浮力 (磁压 B^2/2mu 降低内部气压) 使磁通管上浮成黑子。

    Babcock-Leighton 变体: 倾斜黑子对衰变扩散再生极向场 (表面通量输运)。

    观测约束: 黑子蝴蝶图 (向赤道迁移)、极区场向极迁移; 周期 9-13.6 年波动 (均值 ~11.1 年)。

    判定线索: 相邻周期黑子极性应相反 (Hale 律); 单年剧烈波动不等于周期失效;

    磁场记录与 11 年相位错位 (如声称稳定磁场周期 50 年) 需复核。'
