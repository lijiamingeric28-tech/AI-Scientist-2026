  content: "星系熄灭机制与时标:\n1. 恒星反馈: 低质量中央星系 (M* < 1e9.6 Msun) 主导,\n   熄灭时标 tau_Q ~ 3-4 Gyr (慢熄灭)\n2. 环境效应: 低质量卫星 ~2 Gyr (冲压剥离+供气切断 strangulation),\n   在超密度 10-30 倍环境起作用; 形态特征: 外向内熄灭 (outside-in)\n3. AGN 反馈:\
    \ 高质量星系 (M* > 1e10.3 Msun) 主导, tau_Q < 2 Gyr;\n   由 M_BH-sigma 关系估计黑洞质量 ~1e6.5-1e7.5 Msun 时触发;\n   中心先熄 (inside-out); 射电/热模式加热环星系介质阻止冷流\n4. 绿谷: 过渡态; 熄灭时标决定绿谷星系占比 (z~0.5-0.7 出现峰)\n\n物理原理: 熄灭 = 切断冷气体供应\
    \ (环境剥离/反馈加热) 或吹出气体;\n短时标 (<1 Gyr) 是爆发式 (并合/反馈), 长时标 (3-5 Gyr) 是供气枯竭型。\n\n判定线索: 低质量星系记录 tau_Q < 1 Gyr 且无环境证据 = 需复核;\n中央星系熄灭首要看速度弥散/黑洞质量而非环境密度。\n"
  source: Peng et al. 2010, ApJ 721, 193; Wright et al. 2019, MNRAS 484, 3022; Bluck et al. 2020, MNRAS
  confidence: consensus
