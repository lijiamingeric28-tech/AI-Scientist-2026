  - 宇宙切变相关函数怎么测量
  - 弱透镜测量需要报告哪些系统效应
- id: cmb_power_spectrum
  title: CMB 功率谱与声学峰
  category: cosmological_model
  tags:
  - cmb
  - power_spectrum
  - acoustic_peak
  - theta_star
  - planck
  - sound_horizon
  applies_to:
    fields:
