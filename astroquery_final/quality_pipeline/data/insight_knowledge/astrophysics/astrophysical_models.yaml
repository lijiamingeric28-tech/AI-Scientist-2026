  content: '潮汐瓦解事件 (TDE) 回落模型:

    恒星进入黑洞潮汐半径 R_t ~ R* (M_BH/M*)^(1/3) 被撕碎, 碎片按轨道能量分布回落:

    回落率 Mdot(t) ~ Mdot_peak (t/t_peak)^(-5/3) (Rees 1988; Phinney 1989)


    关键数值:

    - 峰值回落时标 t_peak ~ 数周到数月 (取决于黑洞质量与恒星密度)

    - 峰值回落率: 1e6 Msun 黑洞可达 ~10-100 Mdot_Edd (超爱丁顿), 1e8 Msun 量级 ~Eddington

    - 峰值光度: 典型观测 ~1e43-1e45 erg/s (吸积效率 x 回落率)

    - 事件率: ~1e-5 每星系每年; 光变 UV/X 射线耀发, 衰减指数 -5/3, 持续月-年级


    物理原理: 碎片轨道周期 P ~ a^(3/2) 且能量散布窄 -> 回落率幂律衰减;

    黑洞质量越大回落率相对 Eddington 越低 (潮汐半径相对 ISCO 越小)。


    判定线索: 暂现源衰减指数显著偏离 -5/3 需查尘埃回响/部分瓦解/重复耀发;

    峰值持续超 Eddington 数倍需复核黑洞质量或几何聚束。

    '
  source: Rees 1988, Nature 333, 523; Phinney 1989; van Velzen et al. 2020, Space Sci. Rev. 216, 4
