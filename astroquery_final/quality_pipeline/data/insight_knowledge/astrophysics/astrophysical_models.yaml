      hi: 5
      unit: Gyr
- id: star_formation_efficiency
  title: 恒星形成效率 (SFE/每自由落体时标)
  category: empirical_relation
  tags:
  - star_formation_efficiency
  - free_fall
  - kennicutt_schmidt
  - molecular_cloud
  applies_to:
    fields:
    - star_formation_rate
    - mass
    entities:
    - galaxy
    - ism_object
  content: '恒星形成效率 (SFE):

    定义: epsilon_ff = SFR x tau_ff / M_gas (每自由落体时标的质量转化率),

    tau_ff = sqrt(3 pi / (32 G rho)) ~ 4 Myr (n ~ 100 cm^-3)


    经验值 (多尺度普适):

    - 分子云/致密气体: epsilon_ff ~ 1% (Krumholz & Tan 2007 汇总全环境 ~0.6-1%)

    - 近邻星系直接测量: 中位 ~0.7%, 散布 0.4-1.1% (PHANGS-ALMA, Utomo 2018)

    - 星系整体: Kennicutt-Schmidt 关系归一化等价于 epsilon_ff ~ 1e-2 每自由落体时标

    - 云际变化 0.1%-10% (云际差异不改变整体普适性)


    物理原理: 湍流+磁场支撑使气体只能慢速塌缩;

    若无反馈调节, 银河系气体应 ~250 Msun/yr 恒星形成而非 ~1 Msun/yr。


    判定线索: 声称 epsilon_ff >> 10% 的持续恒星形成需极端证据;

    由 SFR 反推气体质量/恒星形成时间尺度必须说明所用 epsilon_ff。

    '
  source: Krumholz & McKee 2005, ApJ 630, 250; Krumholz & Tan 2007, ApJ 654, 304; Utomo et al. 2018, ApJ 861, L18
  confidence: consensus
  hypothetical_queries:
  - 恒星形成效率每自由落体时标约多少
  - 分子云恒星形成效率典型值 1%
  - Kennicutt-Schmidt 关系与 SFE 的关系
  ranges:
    epsilon_ff:
      lo: 0.003
      hi: 0.1
- id: black_hole_growth_history
  title: 黑洞增长历史 (Soltan 论证/吸积主导)
  category: galactic_model
  tags:
  - soltan
  - black_hole_growth
  - accretion
  - radiative_efficiency
  - mass_density
  applies_to:
    fields:
    - luminosity
    - stellar_mass
    - redshift
    entities:
    - black_hole
    - agn
    - quasar
  content: '黑洞增长历史 (Soltan 论证):

    守恒关系: 吸积释放能量 E = epsilon M_acc c^2 (epsilon 辐射效率 ~0.1);

    积分类星体光度函数得光度密度 -> 反推已吸积质量密度:

    rho_BH = (1-epsilon)/(epsilon c^2) x 积分(Phi(L,z) L dL dt/dz dz)


    关键数值: 局域 SMBH 质量密度 (M-sigma 关系+质量函数) ~(2.5 +/- 0.4) e5 Msun/Mpc^3;

    光学类星体光度函数积分 ~2.1e5 (0.1/epsilon) Msun/Mpc^3;

    X 射线背景积分 (含强遮挡 AGN) ~6e5 Msun/Mpc^3;

    两者一致 -> 辐射效率 ~0.1 (0.1-0.3), 增长以辐射有效吸积为主。


    物理原理: 类星体辐射能量与黑洞质量增长的等价性;

    并合只重组质量不增加总量 (贡献小于最后 1-2 个 e-fold)。


    判定线索: 声称的黑洞质量密度偏离 2-6e5 Msun/Mpc^3 超 2 倍需复核

    (遮挡改正/效率假设/样本完整度); 个别系统证据不能推翻统计性论证。

    '
  source: Soltan 1982, MNRAS 200, 115; Yu & Tremaine 2002, MNRAS 335, 965; Fabian & Iwasawa 1999, MNRAS 303, L34
  confidence: consensus
