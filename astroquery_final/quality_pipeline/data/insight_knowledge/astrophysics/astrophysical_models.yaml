  content: '爱丁顿极限推导: 电子受辐射压向外、质子受引力向内, 平衡时:

    F_rad = L sigma_T / (4 pi r^2 c) (每个电子的辐射力) = F_grav = G M m_p / r^2

    → L_Edd = 4 pi G M m_p c / sigma_T = 1.26e38 (M/Msun) erg/s = 3.3e4 (M/Msun) Lsun

    假设: 完全电离氢等离子体、Thomson 散射主导不透明度、球对称。

    通用光度标尺: 白矮星 ~1e34 erg/s, 中子星/恒星质量黑洞 ~1e38-1e39,

    1e8 Msun 的 SMBH ~1e46 erg/s — 与距离无关的第一性锚点。

    超 Eddington 存在 (光球瓦解、光子气泡、slim disk), 但持续超 Eddington 数倍需解释;

    O 型星 L/L_Edd ~ 0.5, 接近 Eddington 是强星风驱动条件。

    判定线索: 各质量尺度天体的光度上限; AGN 应用细节见 eddington_accretion 条目。'
  source: Eddington 1926; JILA 爱丁顿讲义
