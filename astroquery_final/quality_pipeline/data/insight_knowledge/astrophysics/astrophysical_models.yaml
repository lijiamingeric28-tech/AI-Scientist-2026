  content: 'Shakura-Sunyaev 标准薄盘 (1973): 开普勒旋转、几何薄 (H/R << 1)、局部冷却稳态吸积盘,

    粘滞用 alpha 参数化: nu = alpha c_s H (alpha 无量纲, 典型 0.1-0.4, MHD 模拟下限 ~0.02)。

    温度分布 (与粘滞机制无关的普适结果):

    T_eff(R) = (3 G M Mdot / (8 pi sigma R^3))^(1/4) (1 - sqrt(R_in/R))^(1/4) ~ R^(-3/4)。

    特征温度: 恒星质量黑洞内区 T ~ 1e7 K (热 X 射线), AGN 盘 T ~ 1e4-1e5 K (紫外大蓝包),

    内边界取 ISCO (Schwarzschild: R_isco = 6 GM/c^2)。

    不稳定性: 辐射压主导区热不稳定性 (SS 1976) → 矮新星/X 射线暂现源爆发;

    适用范围: 亚 Eddington 吸积率, 高 Mdot 需 slim disk / ADAF。

    判定线索: 盘温-半径组合违反 T ~ R^(-3/4) 温差量级需复核;

    标准薄盘用于 L > L_Edd 的超 Eddington 光度是模型误用。'
  source: Shakura & Sunyaev 1973, A&A 24, 337; 吸积盘理论综述 (arXiv 1201.2060)
