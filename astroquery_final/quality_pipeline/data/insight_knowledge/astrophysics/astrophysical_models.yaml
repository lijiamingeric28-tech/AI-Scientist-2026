- id: mond_modified_gravity
  title: MOND 修正引力 (星系旋转曲线)
  category: galactic_model
  tags:
  - mond
  - modified_gravity
  - rotation_curve
  - tully_fisher
  - a0
  applies_to:
    fields:
    - rotation_velocity
    - mass
    entities:
    - galaxy
    - spiral_galaxy
    - low_surface_brightness_galaxy
  content: 'MOND (Milgrom 1983): 加速度低于普适标度 a0 ~ 1.2e-8 cm/s^2 (≈ cH0/6, THINGS

    拟合 a0 = 1.22 +/- 0.33e-8) 时牛顿动力学修正: 深 MOND 极限有效加速度 g = sqrt(g_N a0),

    旋转速度趋平 v^4 = G M a0 — 无需暗物质解释螺旋星系平坦旋转曲线。


    插值函数: mu(x) = x/sqrt(1+x^2) (x = a/a0), x >> 1 回归牛顿; 特征面密度

    Sigma_m ~ a0/(pi G) ~ 1e2 Msun/pc^2 量级, 低于此表面亮度才入深 MOND 区

    (LSB 星系全域)。


    成功预言: 重子 Tully-Fisher (v^4 ∝ M, 近红外斜率 3.9 +/- 0.2) 与径向

    加速度关系 (RAR, 内禀弥散 ~0.1 dex) 由单一参数 a0 拟合。


    物理原理: 低加速度极限 g = sqrt(g_N a0) 使圆轨道速度 v^4 = G M a0 与半径

    无关 (平坦旋转曲线); 属现象学修正 (惯性或引力), 底层机制尚未确定。


    挑战: 星系团尺度仍需暗物质或附加机制 (速度弥散 ~1000 km/s); 并合团气体

    与透镜质量分离要求不可见质量; 相对论化版本 (TeVeS) 受 2017 引力波速度

    多信使约束强烈限制。


    判定线索: 无暗晕假设的旋转曲线拟合属 MOND 框架结论, 引用需注明框架;

    a0 应取 1.0-1.5e-8 cm/s^2; 团级数据不可仅用 MOND 解释。'
  source: Milgrom 1983, ApJ 270, 365; Famaey & McGaugh 2012, Living Rev. Rel. 15, 10
  confidence: established
  ranges:
    a0:
      lo: 1.0e-08
      hi: 1.5e-08
      unit: cm/s^2
  hypothetical_queries:
  - MOND 特征加速度 a0 是多少
  - MOND 怎么解释旋转曲线平坦
  - MOND 能否解释星系团尺度的观测
- id: pulsar_spin_down_model
  title: 脉冲星磁偶极自转减慢模型
  category: physical_law
  tags:
  - pulsar
  - spin_down
  - magnetic_dipole
  - characteristic_age
  - braking_index
  applies_to:
    fields:
    - spin_period
    - period_derivative
    - magnetic_field_strength
    - age
    entities:
    - pulsar
    - neutron_star
  content: '磁偶极辐射模型: 旋转磁化中子星 (磁矩 mu = B R^3, R ~ 10 km) 的转动能经

    电磁辐射与粒子风损失: L_dip = 2 mu^2 Omega^4/(3 c^3), 自转减慢率

    P Pdot = 4 pi^2 B^2 R^6/(3 I c^3)。


    推导量: B = 3.2e19 sqrt(P Pdot) G (P 秒、Pdot 无量纲); 特征年龄

    tau_c = P/(2 Pdot) (n = 3); 自转能损 L = 4 pi^2 I Pdot/P^3 (I ~ 1e45 g cm^2)。


    典型值: 正常脉冲星 P ~ 0.1-2 s, Pdot ~ 1e-15 → B ~ 1e12 G, tau_c ~ 1e6-1e9 yr;

    毫秒脉冲星 P ~ 1-10 ms, Pdot ~ 1e-20 → B ~ 1e8-1e9 G (吸积回收退磁), tau_c

    可达数百亿年 (超宇宙年龄, 真实年龄由伴星白矮星冷却约束); 磁星 B ~ 1e14-1e15 G。


    braking index: n = 2 - P Pdotdot/Pdot^2; 纯偶极 n = 3, 实测 0.9-3

    (粒子风把 n 压向 1, 进动/磁偶极演化修正)。


    物理原理: 磁场与导电星体共同旋转切割磁通 → 坡印廷流 + 相对论性粒子风;

    真空偶极公式是理想近似, 磁层电流实际主导损失。


    判定线索: P/Pdot 组合的 B 超出 1e7-1e17 G 或 tau_c 与已知年龄矛盾需复核

    单位 (P 的秒/毫秒, Pdot 的 s/s vs 1e-15); Pdot < 0 (自转加速) 需吸积

    或进动解释。'
  source: Pacini 1967; Ostriker & Gunn 1969, ApJ 157, 1395; Lorimer & Kramer, Handbook of Pulsar Astronomy
  confidence: consensus
  ranges:
    magnetic_field_strength:
      lo: 100000000.0
      hi: 1000000000000000.0
      unit: G
  hypothetical_queries:
  - 脉冲星磁场强度怎么由自转参数推导
  - 脉冲星特征年龄的计算公式
  - 毫秒脉冲星的磁场量级
- id: mri_accretion_disk
  title: 磁旋转不稳定性 MRI 与吸积盘粘滞
  category: physical_law
  tags:
  - mri
  - accretion_disk
  - magnetorotational
  - viscosity
  - balbus_hawley
  applies_to:
    entities:
    - black_hole
    - xray_binary
    - white_dwarf
    - agn
  content: '磁旋转不稳定性 (MRI, Balbus & Hawley 1991): 弱磁场 + 开普勒较差旋转的

    导电流体对微扰指数不稳定, 产生的湍流是吸积盘角动量输运 (Shakura-Sunyaev

    alpha 粘滞) 的物理来源。


    判据: 角速度随半径减小 (d Omega^2/d ln r < 0, 开普勒盘恒满足) 且磁场足够弱;

    最强增长模增长率 ~0.75 Omega (轨道频率), 波长 ~ v_A/Omega; 需 Rm >> 1 维持。


    结果: 剪切盒 MHD 模拟给出有效 alpha ~ 0.01-0.1 的湍流应力 (Reynolds +

    Maxwell), 解释标准薄盘 alpha 量级 (见 shakura_sunyaev_disk); 净磁通边界

    条件使输运效率差异达 ~10 倍 (零净通量更弱)。


    死区 (dead zone): 电离度低的中面/外盘区 MRI 被抑制 → alpha 骤降; 与热-粘滞

    不稳定性结合解释矮新星/X 射线暂现源爆发循环与原行星盘结构。


    物理原理: 磁力线连接内快外慢的流体环, 类弹簧拉伸产生 Maxwell 应力传输

    角动量并释放引力能 — 磁场湍流自维持, 与分子粘滞无关。


    判定线索: 声称吸积盘 alpha 远小于 1e-4 (无强净磁通) 或大于 1 需复核;

    爆发型吸积系统的时标与热-粘滞循环理论一致属正常。'
  source: Balbus & Hawley 1991, ApJ 376, 214; Balbus & Hawley 1998, Rev. Mod. Phys. 70, 1
  confidence: consensus
  ranges:
    alpha_eff:
      lo: 0.005
      hi: 0.1
  hypothetical_queries:
  - 磁旋转不稳定性的判据和增长率
  - 吸积盘 alpha 粘滞的物理来源
  - 吸积盘死区与矮新星爆发的关系
- id: agn_variability_model
  title: AGN 变光模型 (阻尼随机游走 DRW)
  category: empirical_relation
  tags:
  - agn
  - variability
  - damped_random_walk
  - structure_function
  - red_noise
  applies_to:
    fields:
    - apparent_magnitude
    - flux_density
    entities:
    - agn
    - quasar
  content: 'AGN 变光模型 — 阻尼随机游走 (DRW):

    协方差 cov(dt) = sigma^2 exp(-dt/tau) (CAR(1)/Ornstein-Uhlenbeck 过程)


    功率谱: 低频平坦, 高频 PSD ~ f^-2, 拐点频率 ~ 1/(2 pi tau);

    结构函数: 短时标 SF ~ dt^0.5, 长时标渐近 SF_inf ~ sqrt(2) sigma


    典型参数 (光学): tau ~ 200 天 (数千 SDSS AGN, Kozlowski 2016), 长基线 (20 年) 样本中位数 ~750 天;

    渐近幅度 SF_inf ~ 0.1-0.2 mag, 与光度/爱丁顿比反相关, 与 M_BH 正相关;

    tau 与 M_BH 相关: log M_BH ~ 1.85 log(tau/200 天) + 7.6, 弥散 ~0.4 dex。


    物理原理: 吸积盘局域磁流体湍流涨落向光球传播叠加成红噪声;

    DRW 是最简可用模型而非唯一 (约 13% AGN 光学 PSD 比 f^-2 更陡)。


    判定线索: 基线短于 ~10 tau 的光变曲线测出的 tau 严重偏低;

    声称的周期性信号必须做红噪声蒙特卡洛假警报检验。

    '
  source: Kelly, Bechtold & Siemiginowska 2009, ApJ 698, 895; MacLeod et al. 2010, ApJ 721, 1014; Kozlowski 2016, ApJ 826, 118
  confidence: consensus
  hypothetical_queries:
  - AGN 阻尼随机游走时标典型值多少天
  - 类星体变光功率谱密度斜率
  - AGN 结构函数幅度与黑洞质量关系
  ranges:
    damping_timescale:
      lo: 30
      hi: 1000
      unit: day
    sf_amplitude:
      lo: 0.05
      hi: 0.5
      unit: mag
- id: galaxy_quenching_models
  title: 星系熄灭机制 (环境/反馈/时标)
  category: galactic_model
