    entities:
    - supernova
  content: 'SN Ia 光变曲线模型 (Arnett 规则):

    峰值光度由 56Ni -> 56Co -> 56Fe 衰变链供能:

    L_peak = alpha x E_Ni56(t_rise) ~ 2.0e43 (M_Ni/Msun) erg/s (上升期 19 +/- 3 天)


    关键数值: 56Ni 质量正常 Ia ~0.4-0.8 Msun (最概然 ~0.6), 超亮事件可超 1;

    上升时间 ~19 天 (t_rise ~ 17.5 - 5(dm15 - 1.1) 天); 后期 56Co 衰变时标 ~111 天;

    峰值绝对星等 ~ -19.3 +/- 0.3 (散布 ~0.15 mag, 经 dm15/颜色改正)。


    物理原理: 峰值时光球透明度使辐射率 = 核衰变产率 (能量守恒);

    峰值光度直接测 M_Ni, 是标准烛光与距离测量的基础。


    判定线索: 峰值光度与 M_Ni 显著不符的 Ia 需查红移/消光/上升期假设;

    超钱德拉塞卡质量事件不满足 Arnett 规则 (超亮类);

    上升期误设 (19 vs 20 天) 引入 ~0.16 mag 峰值偏移。

    '
  source: Arnett 1982, ApJ 253, 785; Branch 1992, ApJ 392, 35; Dhawan et al. 2016, A&A 588, A84
  confidence: consensus
