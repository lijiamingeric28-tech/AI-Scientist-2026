  content: 'NFW 剖面 (Navarro, Frenk & White 1997): 冷暗物质晕的普适密度分布 (N 体模拟):

    rho(r) = rho0 / [(r/Rs) (1 + r/Rs)^2]

    内区 rho ~ r^-1 (cusp), 外区 rho ~ r^-3; Rs 标度半径, R_vir = c Rs (c 集中度);

    内区斜率 -1 与矮星系观测平坦核 (cusp-core 问题) 的争议仍未解决。

    集中度: 星系团 c ~ 5-10, 银河系尺度晕 c ~ 10-15, 低质量晕可达 40;

    c 随质量增大而减小, 随红移增大而略降。

    R200 定义: 平均密度 = 200 x 临界密度的半径, M200 = (200/3) rho_crit 4 pi R200^3;

    X 射线观测常用 R500; 包络质量 M(<R) = 4pi rho0 Rs^3 [ln(1+R/Rs) - (R/Rs)/(1+R/Rs)]。

    判定线索: 由半径反推质量必须说明 overdensity 定义 (200c/200m/500c),

    不同定义换算差 ~30%; 核斜率 -1 (NFW) 与 -1.5 (Hernquist) 不可混用。'
