  content: '维里定理: 引力束缚稳态自引力系统 2K + W = 0 (K 动能, W 势能),

    由速度弥散估计质量: M_vir ~ 3 sigma_v^2 R / G (sigma_v 一维速度弥散, R 有效半径)。

    星系团 (sigma_v ~ 500-1200 km/s, R ~ 1 Mpc) → M ~ 1e14-1e15 Msun。

    X 射线静水平衡: M(<r) = -(k T r / (G mu m_p)) (d ln rho_g/d ln r + d ln T/d ln r),

    ICM kT ~ 3-10 keV; 团质量-温度标度律 M ~ T^(3/2) 量级。

    维里比检验: 2K/|W| 显著偏离 1 → 系统未弛豫 (并合中), 质量估计不可靠。

    判定线索: 团质量与速度弥散不满足 M ~ sigma^2 (如 M=1e15 但 sigma ~ 300 km/s) 需复核;

