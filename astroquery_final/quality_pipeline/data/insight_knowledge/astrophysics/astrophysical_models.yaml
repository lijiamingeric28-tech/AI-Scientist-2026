- id: weak_lensing_theory
  title: '弱引力透镜理论: 剪切、收敛与相关函数'
  category: physical_law
  tags:
  - weak_lensing
  - shear
  - convergence
  - cosmic_shear
  - correlation_function
  applies_to:
    fields:
    - shear
    - convergence
    - redshift
    entities:
    - galaxy
    - galaxy_cluster
  content: '弱引力透镜: 大尺度结构的引力势使背景星系像被统计性扭曲 (剪切 gamma) 与放大

    (收敛 kappa), 单源不可分辨, 需对大量源星系统计测量。


    定义: kappa = Sigma / Sigma_crit, 临界面密度 Sigma_crit = c^2 D_S / (4 pi G D_L D_LS);

    gamma 与 kappa 均为透镜势二阶导数的组合 (弱场线性近似); Kaiser-Squires 反演

    可由剪切场重建收敛场。


    两点统计: 剪切相关函数 xi_±(theta) = ∫ dℓ ℓ/(2pi) P_kappa(ℓ) J_{0,4}(ℓ theta)

    (E/B 模分解检验系统误差 — B 模显著提示 PSF 校正不完善或固有取向污染)。


    典型量级: 星系团弱透镜 gamma ~ 0.05-0.3; 宇宙切变 (大尺度平滑) ~ 1e-2 量级;

    剪切随角距衰减, 与暗晕质量分布 (NFW, 见 nfw_halo_profile) 拟合得团质量。


    物理原理: 与强透镜同一物理 (广义相对论光线偏折), 弱场近似下不可见质量直接

    投影为可测形变; 固有取向 (intrinsic alignment) 需模型扣除 (II/GI 项)。


    判定线索: WL 测量必须报告源红移分布 P(z) 与 PSF 校正方式; 同一团 WL 与 X 射线

    质量比 M_X/M_WL ~ 0.7-0.9 属正常系统差 (见 cluster_mass_estimation)。'
  source: Bartelmann & Schneider 2001, Phys. Rep. 340, 291; Kilbinger 2015, Rep. Prog. Phys. 78, 086901
  confidence: consensus
  ranges:
    shear:
      lo: 0.001
      hi: 0.3
  hypothetical_queries:
