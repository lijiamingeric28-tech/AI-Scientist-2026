  content: '恒星风质量损失: 大质量热星由辐射驱动 (CAK 1975; Vink 2000 Monte Carlo 模型),

    O/B 型星 Mdot ~ 1e-7 到 1e-5 Msun/yr, 随光度陡增 (~L^2 量级);

    Vink 2000/2001 经验配方: Mdot ~ Z^0.85 (金属度依赖, 低 Z 星风弱),

    B1 双稳定性跳变 (Teff ~ 25000 K) 处 Mdot 突增 (vinf/vesc 从 2.6 降至 1.3)。

    红超巨星: Mdot ~ 1e-6 到 1e-5 Msun/yr (尘粒驱动);

    Wolf-Rayet: Mdot ~ 1e-5 Msun/yr (极端动量问题); AGB: Mdot ~ 1e-7 到 1e-4 Msun/yr。

    累积效应: 10-30 Msun 恒星可经主序+RSG 阶段损失大半质量,

    影响演化终态 (白矮星 vs 中子星); O 星 1e-6 Msun/yr x 1e7 yr ~ 10 Msun。

    判定线索: 大质量恒星的演化年龄/终态推断必须计入 Mdot;

    记录的恒星质量与终态不一致 (如 25 Msun 恒星标为白矮星) 需星风解释或复核。'
  source: Vink, de Koter & Lamers 2000/2001, A&A; Castor, Abbott & Klein 1975
