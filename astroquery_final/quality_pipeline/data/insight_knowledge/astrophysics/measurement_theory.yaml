- id: sed_fitting_method
  title: SED 拟合方法 (模板网格/χ² 最小化)
  category: measurement_principle
  tags:
  - sed
  - template_fitting
  - chi_square
  - bayesian
  - energy_balance
  - photometry
  hypothetical_queries:
  - SED拟合怎么做
  - CIGALE/MAGPHYS输出哪些参数
  - 能量平衡约束是什么
  applies_to:
    fields:
    - redshift
    - flux_density
    entities:
    - galaxy
    - agn
    methods:
    - photometry
  content: 'SED 拟合: 将多波段测光点与模型 SED 库比对, 通过 χ² 最小化估计物理参数: χ² = Σ_i (F_obs,i - F_model,i)² / σ_i²。


    模型通量 = 模板光谱经滤光片透过率卷积: F_model,i = ∫ T_i(λ) F_λ dλ / ∫ T_i(λ) dλ。


    物理原理: 天体 SED 由恒星合成 (Bruzual & Charlot) + 尘埃消光 (Calzetti/Charlot-Fall 律) + 尘埃再辐射 (远红外) + 星云发射 + AGN 供体 (torus) 组成。


    能量平衡约束: 紫外-光学被尘埃吸收的能量必须由远红外再辐射补足, 违反能量平衡的拟合结果不可信。


    现代代码 (CIGALE/MAGPHYS) 输出参数后验分布而非单点最优: P(θ|D) ∝ exp(-χ²/2) × p(θ), 网格穷举或 MCMC 采样。


    常用输出: 恒星质量、SFR、消光 A_V、尘埃质量; 恒星质量与尘埃温度等参数存在简并, 需多波段覆盖缓解。


    污染源: 孔径混入邻星/核光使颜色变蓝 → 系统性低估年龄与质量 (光斑污染)。


    发射线落入宽带滤光片 (高 z 时 Hα 进入 J/K 带) 是系统性偏差, 拟合高 z 或低质量星系必须开启 nebular 模块; AGN 污染需中红外成分建模。


    判定线索: 参数后验双峰/多峰 = 简并未解决; 拟合残差单波段 >3σ 需复核该波段测光。


    单点最优 χ² 无不确定度直接当物理量引用是常见错误; 仅宽带测光 (σ_z > 0.05) 时高 z 参数外推不可靠。'
  source: Boquien et al. 2019, A&A 622, A103 (CIGALE); da Cunha, Charlot & Elbaz 2008, MNRAS 388, 1595 (MAGPHYS); Conroy 2013, ARA&A 51, 393
  confidence: consensus
- id: aperture_photometry
  title: 孔径测光 (孔径半径/天空扣除/孔径改正)
  category: measurement_principle
  tags:
  - aperture
  - photometry
  - fwhm
  - sky_annulus
  - aperture_correction
  - curve_of_growth
  hypothetical_queries:
  - 孔径测光怎么选半径
  - 天空背景怎么扣除
  - 孔径改正为什么必要
  applies_to:
    fields:
    - apparent_magnitude
    - flux_density
    entities:
    - star
    - galaxy
    methods:
    - photometry
  content: '孔径测光: 以源为中心的圆孔径内累加计数, 扣除天空背景: F = Σ(孔径内像素值) - B × N_pix。


    天空背景 B 由源外环形区 (annulus, 内径常取 2-3 倍孔径) 的 sigma-clipped 中位数估计; 拥挤场用 3×median - 2×mean 稳健估计。


    孔径半径选择: 半径越大含通量越多, 但天空噪声与邻源混染越大。


    天空主导时点源 S/N 最优半径 ~0.7 × FWHM (高斯 PSF 理论解); 常用 1.5-2 × FWHM 兼顾通量完整与视宁稳健, ~2.5 × FWHM 包住绝大部分通量。


    延展源 (星系) 用 Kron 半径 R = 2.5 × 一阶矩半径 (SExtractor FLUX_AUTO)。


    孔径改正: 小孔径漏掉的 PSF 翼通量 (2 × FWHM 外仍残留 ~1-5%) 由孤立亮星曲线增长 (curve of growth) 测得, 统一加到所有目标。


    物理原理: 天空噪声 ∝ sqrt(面积), 目标信号集中在 PSF 内 — 孔径是信噪比与通量完整性的折中; 时序测光固定孔径 + 统一改正可消除视宁变化影响。


    判定线索: 无孔径改正的星等与全通量口径星等差 0.05-0.2 mag 属正常。


    天空环混入亮星 → 背景偏高 → 目标偏暗; 不同孔径配置的星等直接比较是错误。


    混染源的孔径测光需标记或改用 PSF 拟合; 混染使信号与背景同时失真, 是拥挤场孔径测光的失效模式。'
  source: Stetson 1987, PASP 99, 191; Bertin & Arnouts 1996, A&AS 117, 393; Naylor 1998, MNRAS 296, 339
  confidence: consensus
  ranges:
    aperture_radius_fwhm:
      lo: 1.0
      hi: 2.5
      unit: '1'
- id: surface_brightness_measure
  title: 表面亮度测量与单位 (mag/arcsec²)
  category: measurement_principle
  tags:
  - surface_brightness
  - mag_arcsec2
  - isophote
  - ellipse
  - selection_effect
  hypothetical_queries:
  - 表面亮度单位mag/arcsec²怎么换算
  - 低面亮度星系为什么难探测
  - D25等光度直径的定义
  applies_to:
    fields:
    - surface_brightness
    entities:
    - galaxy
    methods:
    - photometry
  content: '表面亮度 SB 定义: 单位天区面积内的亮度, 单位 mag/arcsec²。


    换算关系: μ = m + 2.5 × log10(A), A 为面积 (arcsec²); 由每像素标定通量换算: μ = -2.5 × log10(I) + 零点常数。


    物理原理: 对延伸源, 表面亮度与距离无关 — 距离增大 N 倍, 总流量与张角面积各减 N², 比值不变。


    这使低面亮度星系在所有距离上同样难以探测, 是面亮度选择效应 (SB 限制巡天) 的物理根源。


    典型值: 暗夜夜空 V 带 ~21.5-22 mag/arcsec² (好台址, 月光/黄道光使其更亮)。


    正常星系中心面亮度 μ0(B) 大多 14-21, 低面亮度星系 μ0(B) > 23 (操作定义); 深巡天有效极限 ~26-28 mag/arcsec²。


    测量: 沿椭圆等光度线积分 (ELLIPSE) 或圆孔测光换算; 参考等光度 D25 即 B 带 25 mag/arcsec² 等光度直径 (RC3)。


    等光度半径随限值变化, 不同限值 (23.5/25/27) 不可直接比较。


    判定线索: mag 与 mag/arcsec² 混用 (差 2.5 log10 A) 是常见单位错误; 声称面亮度暗于夜空 2 mag 以上需核对天空扣除。


    用 PSF 口径星等直接换算面亮度会把点源误判为极亮面亮度源; 未做 PSF 展宽改正的核心面亮度系统性偏高。'
  source: Jedrzejewski 1987, MNRAS 226, 747; RC3 (de Vaucouleurs et al. 1991); Disney 1976, Nature 263, 573
  confidence: established
  ranges:
    surface_brightness:
      lo: 15.0
      hi: 30.0
      unit: mag/arcsec2
- id: ccd_calibration
  title: CCD 校准 (偏置/暗流/平场/非线性)
  category: measurement_principle
  tags:
  - ccd
  - bias
  - dark_current
  - flat_field
  - read_noise
  - gain
  - nonlinearity
  hypothetical_queries:
  - CCD减偏置减暗流除平场的顺序
  - 读出噪声与增益怎么测量
  - 平场精度如何限制测光精度
  applies_to:
    fields:
    - apparent_magnitude
    methods:
    - photometry
    - spectroscopy
  content: 'CCD 校准链: 原始计数 ≈ (目标光子 + 暗流 + 偏置) × 平场响应 + 读出噪声。


    处理顺序: 减偏置 (零曝光帧或过扫区) → 减暗流 (按曝光时间标定) → 除平场 (归一化像素响应); 顺序颠倒会引入系统误差。


    关键参数 (光子转移曲线测量): 增益 G ~0.4-2 e-/ADU; 读出噪声 RN ~2-15 e-/pix (慢读出低, 快读出高)。


    满阱 ~1e5-3.5e5 e- (深耗尽芯片更高); 暗流随温度近似指数增长, 温度每降 ~6-7 °C 暗流减半。


    深冷科学 CCD 暗流 <0.01-0.3 e-/s/pix; 非线性: 满阱 ~80-90% 以上响应偏离线性, 典型非线性 ~0.3-2%。


    饱和像素及非线性区不可用于定量测光; 光子转移曲线斜率偏离 1 即非线性指示。


    平场: 天空平场优于圆顶平场 (照明色温更接近夜间光谱); 多帧平均压低泊松噪声, 平场精度 ~0.2-1%, 直接限制测光精度下限。


    物理原理: 暗流与偏置是加法噪声, 平场是乘法 (响应) 改正; 读出噪声每帧固定叠加, 是快读出/短曝光的主导噪声。


    判定线索: 计数接近满阱 (如 >60k ADU, gain ~1) 的源误差列不可信 (非线性)。


    未平场的图像像素间响应差 ~1% 直接进入测光; 长曝光需检查暗流稳定性与宇宙线比例; 暗流减除前必须先减偏置。'
  source: Howell 2006, Handbook of CCD Astronomy (2nd ed.); Janesick 2001, Scientific Charge-Coupled Devices
  confidence: established
  ranges:
    read_noise:
      lo: 2.0
      hi: 30.0
      unit: e-/pixel
- id: flux_calibration_standards
  title: 流量定标 (标准星/大气消光/仪器响应)
  category: measurement_principle
  tags:
  - flux_calibration
  - standard_stars
  - extinction
  - airmass
  - color_term
  - zero_point
  hypothetical_queries:
  - 测光定标的标准流程
  - 大气消光系数典型值
  - 零点与色项改正的作用
  applies_to:
    fields:
    - apparent_magnitude
    - flux_density
    methods:
    - photometry
    - spectroscopy
  content: '定标链: 仪器星等 → 大气消光改正 → 零点与色项改正 → 标准系统星等/物理通量。


    观测标准星建立零点: m_std = m_inst - k × X - c × color - Z; 大气消光 (Bouguer 定律): m = m0 + k(λ) × X, X 为气团。


    典型消光系数: V 带 ~0.1-0.2 mag/airmass (好台址 ~0.1), U 带 ~0.4-0.5, I 带 ~0.05-0.1。


    物理原理: 瑞利散射 ∝ λ^-4 使蓝端消光强, 叠加臭氧/水气吸收带。


    标准星网络: 测光标准星 Landolt UBVRI 星场 (与目标同视场/同气团观测), 分光标准星 CALSPEC (精度 ~1-2%), 合成测光可校验零点。


    色项: 仪器滤光片+探测器与标准系统响应不同, 需色项改正 c × (color - color_std), 典型 ~0.01-0.1 mag/mag。


    未色项改正的仪器星等与标准系统星等不可互换 (差值随颜色变化)。


    定标精度受标准星固有误差、大气消光时变、滤光片透射老化限制; 非测光夜 (薄云) 零点漂移可 >0.05 mag; 分光响应函数须每夜重建。


    判定线索: 无气团/时刻记录的测光不可信; 同一夜零点散差 >0.05 mag 提示云或仪器漂移。


    不注明零点系统 (AB vs Vega) 的星等无法跨目录比较 (差值可达 ~1 mag); 单标准星定标且无误差传播报告是常见缺陷。'
  source: Landolt 1992, AJ 104, 340; Bohlin et al. 2020, AJ 160, 21 (CALSPEC); Harris, Fitzgerald & Reed 1981, PASP 93, 507
  confidence: established
  ranges:
    extinction_coefficient_v:
      lo: 0.05
      hi: 0.35
      unit: mag/airmass
- id: time_resolution_sampling
  title: 时间分辨率与采样 (Nyquist 与混叠)
  category: measurement_principle
  tags:
  - nyquist
  - sampling
  - aliasing
  - cadence
  - exposure_time
  - spectral_window
  hypothetical_queries:
  - 采样定理与周期混叠
  - 曝光时间对短周期信号的影响
  - 如何避免混叠假周期
  applies_to:
    fields:
    - variability_period
    - epoch
    entities:
    - star
    methods:
    - photometry
  content: '采样定理: 规则采样间隔 Δt 只能可靠恢复周期 P ≥ 2 × Δt 的信号 (Nyquist 频率 f_Nyq = 1/(2Δt))。


    高于 Nyquist 的频率折叠为假峰 (混叠): f_alias = |f ± k × f_sample|。


    曝光时间同样设限: 曝光 τ 相当于与矩形窗卷积, 高频振幅被 sinc 因子衰减, 短周期信号 (P < ~4τ) 明显被抹平。


    可探测的最短时标由 max(采样间隔, 曝光时间) 决定。


    物理原理: 混叠是采样过程的固有模糊 — 周期图必须对照频谱窗 (spectral window) 函数判别假峰。


    夜间近同时观测的 ~1 d 采样可将真周期 ~0.8 d 折叠为假周期 ~4 d; 谐波相关采样 (如 30 min 与 10 min) 保留相同混叠峰。


    对策: 非谐波相关采样间隔; 日心/质心改正的时间戳调制打破严格周期性 (超 Nyquist 恢复); Lomb-Scargle 周期图处理非均匀采样。


    判定线索: 声称周期 P < 2 × 采样间隔的检测需非规则采样或显式建模支持; 周期峰与窗口函数峰重合 = 混叠嫌疑。


    同一源不同巡天周期差 2 倍 = 谐波混淆; 曝光长于周期 1/4 时振幅系统性低估。'
  source: Kurtz 1983, IBVS 2285; VanderPlas 2018, ApJS 236, 16; Murphy, Shibahashi & Kurtz 2013, MNRAS 430, 2986
  confidence: consensus
- id: isophotal_analysis
  title: 等光度分析 (椭圆拟合/位置角/轮廓)
  category: measurement_principle
  tags:
  - isophote
  - ellipse_fitting
  - position_angle
  - ellipticity
  - sersic
  - surface_photometry
  hypothetical_queries:
  - 等光度椭圆拟合输出什么参数
  - 等光度扭转说明什么结构
  - 面亮度轮廓怎么展开
  applies_to:
    fields:
    - surface_brightness
    entities:
    - galaxy
    methods:
    - photometry
  content: '等光度分析: 以同心椭圆拟合星系表面亮度分布 (IRAF ELLIPSE / GALFIT)。


    每环输出面亮度 μ、椭圆度 ε = 1 - b/a、位置角 PA 及高次形变参数 a4/a; 轮廓按等效圆半径 r = a × sqrt(1-ε) 展开为 μ(r)。


    拟合策略: 中心/ε/PA 允许逐环变化 (探测等光度扭转与盘-核球过渡), 内外环固定为平均。


    天空扣除误差会致外圈假上翘, 拟合范围选择是关键。


    物理原理: 等光度形状反映恒星分布的三维结构 — PA/ε 随半径变化指示盘、棒、螺旋结构; 等光度线偏离纯椭圆 (a4 项显著) 指示盘形或块状结构。


    亮度轮廓: Sérsic 律 I(r) = I_e × exp[-b_n × ((r/r_e)^(1/n) - 1)], b_n ≈ 2n - 1/3; n=1 指数盘 (旋涡), n=4 de Vaucouleurs (经典椭圆)。


    单分量残差大的星系需核球+盘双分量; μ_e 与 n 构成基本结构参数对。


    口径定义: D25 = B 带 25 mag/arcsec² 等光度直径 (RC3), logD25 用于几何修正; 不同等光度限值 (23.5/25/27) 的直径不可直接比较。


    判定线索: PA/ε 急剧随半径变化而用单椭圆模型外推 = 系统偏差; 未扣天空的轮廓外圈上翘会被误认为额外成分。


    面亮度口径不匹配 (等光度半径 vs 有效半径) 混用是常见错误; n > 8 或 < 0.2 的拟合值需复核。'
  source: Jedrzejewski 1987, MNRAS 226, 747; Sérsic 1963; Ciotti & Bertin 1999, A&A 352, 447; RC3
  confidence: established
  ranges:
    sersic_index:
      lo: 0.2
      hi: 8.0
      unit: '1'
- id: narrowband_imaging
  title: 窄带成像 (发射线滤光片/连续谱扣除)
  category: measurement_principle
  tags:
  - narrowband
  - emission_line
  - halpha
  - oiii
  - filter
  - continuum_subtraction
  hypothetical_queries:
  - 窄带成像怎么做连续谱扣除
  - Hα窄带怎么估算恒星形成率
  - 窄带滤光片怎么按红移调谐
  applies_to:
    fields:
    - equivalent_width
    - flux_density
    entities:
    - galaxy
    - emission_line_galaxy
    methods:
    - photometry
    - spectroscopy
  content: '窄带成像: 用窄带滤光片 (FWHM ~30-100 Å, 巡天常用 60-80 Å) 隔离发射线: Hα 6563 Å、[OIII] 5007 Å、[SII] 6716/6731 Å、Hβ 4861 Å、[NII] 6584 Å。


    滤光片中心波长须按红移调谐到 λ0 × (1+z)。


    连续谱扣除: 窄带图 = 线发射 + 连续谱; 用宽带/邻线窄带图按通量比缩放后相减得纯线图, 比例由视场内无发射恒星测得。


    等值宽度近似: EW ≈ Δλ_NB × (f_NB/f_BB - 1), 无需绝对定标。


    物理原理: 窄带同时削减夜空辉光噪声 (点源 S/N 增益 ∝ sqrt(带宽比))。


    Hα 直接示踪恒星形成: log SFR(Msun/yr) ≈ log L(Hα)(erg/s) - 41.27; [OIII]/Hβ 与 [NII]/Hα 比区分电离机制 (BPT 图); [SII] 6716/6731 比定电子密度。


    噪声与选择: 带宽越窄天空噪声越小但线中心失配风险越大; OH 夜空线残留需剔除。


    发射线天体选择判据: 窄带图 S/N ≥ 5 且颜色超出 ~3σ (对应 EW 下限 ~15-20 Å)。


    判定线索: 未连续谱扣除的 "线通量" 系统性偏高; Hα 与 [NII] 6584 (间隔 21 Å) 在 ~60 Å 窄带内不可分离, 报告 Hα 通量须说明混叠处理。


    滤光片中心波长与目标红移失配 → 通量系统性低估; 强线天体误配红移 (如 [OIII] 当 Hα) 是常见目录错误。'
  source: Kennicutt 1998, ARA&A 36, 189; Baldwin, Phillips & Terlevich 1981, PASP 93, 5; 窄带巡天方法 (NBS)
  confidence: consensus
  ranges:
    narrowband_fwhm:
      lo: 20
      hi: 200
      unit: Angstrom
- id: spectrum_snr_optimization
  title: 光谱信噪比优化 (曝光/拼接/抖动)
  category: measurement_principle
  tags:
  - signal_to_noise
  - exposure_time
  - stacking
  - binning
  - dithering
  - spectroscopy
  hypothetical_queries:
  - 光谱信噪比怎么提高
  - 曝光时间与S/N的标度关系
  - 抖动观测的目的是什么
  applies_to:
    fields:
    - equivalent_width
    entities:
    - star
    - galaxy
    methods:
    - spectroscopy
  content: '光谱 S/N 公式: S/N = S / sqrt(S + n_pix × (B_sky + D) + n_pix × n_read × RN²), S/B/D 为每像素目标/天空/暗流计数。


    n_pix 为积分像素数, RN 为读出噪声; 各噪声项平方相加。


    三种主导区: 目标光子主导 S/N ≈ sqrt(S); 天空主导 S/N ∝ sqrt(t) 且与 PSF 尺寸成反比; 读出噪声主导 (短曝光/小像素) 时需加长曝光或 binning。


    好视宁直接换 S/N (天空主导时)。


    曝光与抽取: S/N ∝ sqrt(总曝光), S/N 翻倍需 4 倍曝光; 长缝光谱沿缝最优抽取长度 ~1.4 × FWHM (视宁方向)。


    天空主导时先保证单帧读出噪声可忽略, 再多次拼接。


    拼接与抖动: N 帧合并 S/N 增益 sqrt(N), 按方差加权; 抖动 (dither) 不直接提 S/N 但可剔除宇宙线、热像素与干涉条纹, 子像素抖动 + drizzling 改善采样。


    合并帧曝光差异悬殊时须按权重处理; 物理原理: 噪声为光子泊松 + 读出固定项, 连续谱归一化误差与像素间响应误差为系统项, 不随叠加减少。


    判定线索: S/N 随曝光线性增长 (而非 sqrt) = 口径错误; 误差只含光子项的光谱 S/N 偏高。


    同源不同谱 EW 散差超 Cayrel 预期 (ΔW ~ 1.5 × sqrt(FWHM×pixel)/S/N) 先查连续谱归一再查 S/N; S/N < 10 的谱线参数误差 >10-30% 属正常。'
  source: STIS Instrument Handbook (exposure-time 计算); ESO ETC 公式书; Cayrel de Strobel 1988
  confidence: consensus
  ranges:
    spectral_snr:
      lo: 3.0
      hi: 1000.0
      unit: '1'
- id: astrometry_plate_solution
  title: 天体测量板解 (切点投影/参考星/畸变)
  category: measurement_principle
  tags:
  - astrometry
  - plate_solution
  - gnomonic
  - distortion
  - reference_stars
  - wcs
  hypothetical_queries:
  - 天体测量板解怎么建立
  - WCS切点投影原理
  - 畸变改正怎么处理
  applies_to:
    fields:
    - right_ascension
    - declination
    - proper_motion_ra
    - proper_motion_dec
    entities:
    - star
  content: '板解: 建立像面 (x, y) 与天球坐标的映射, 基准为切点 (gnomonic) 投影。


    以板心为切点: ξ = cos δ × sin(α - α0) / D, η = (cos δ0 × sin δ - sin δ0 × cos δ × cos(α - α0)) / D, D = sin δ0 × sin δ + cos δ0 × cos δ × cos(α - α0); 小视场近似 ξ ≈ 角距 × cos δ。


    基本参数: 板心 (α0, δ0)、比例尺 (arcsec/pix)、旋转角。


    参考星: 实测 (x, y) 与目录坐标最小二乘拟合, 须 >10 颗且覆盖全视场; 现代首选 Gaia (mas 级), 历史用 Tycho-2/UCAC3。


    畸变改正: 光学/探测器几何畸变需高阶改正; 经典径向立方模型: 半径因子 (1 + q × (ξ²+η²)), Schmidt 相机 q ≈ -1/3, q > 0 枕形 / q < 0 桶形。


    现代 WCS 用 SIP 像元多项式或 SCAMP PV 关键字表达高阶项。


    精度: CCD 单帧板解 RMS ~0.01-0.1 arcsec (受视宁与参考星限制); 扫描底片经 6 阶多项式畸变改正后 RMS ~0.1-0.3 arcsec。


    残差随距板心距离系统性增大 = 畸变未改正特征; 物理原理: 板解把测量坐标转化为标准坐标, 光学畸变、温度、读数误差全部折叠进映射系数。


    参考星自行须外推到板历元。


    判定线索: 残差随半径系统增大 = 畸变阶数不足; 参考星集中局部 → 外推区不可信。


    跨目录比较前必须统一历元与自行 (高自行源 μ > 0.1 arcsec/yr 混历元引入 >1 arcsec 差); 像素坐标直接当天球坐标引用是常见错误。'
  source: Servillat et al. 2011, arXiv:1102.4874 (DASCH); Lang et al. 2010, AJ 139, 1782 (astrometry.net); Bertin 2006 (SCAMP)
  confidence: consensus
  ranges:
    astrometric_residual:
      lo: 0.001
      hi: 1.0
      unit: arcsec
- id: psf_fitting_photometry
  title: PSF 拟合测光 (拥挤场点源)
  category: measurement_principle
  tags:
  - psf_fitting
  - daophot
  - moffat
  - crowded_field
  - point_source
  hypothetical_queries:
  - PSF拟合测光是什么
  - 拥挤场测光为什么用PSF拟合
  - DAOPHOT怎么构建经验PSF
  applies_to:
    fields:
    - apparent_magnitude
    entities:
    - star
    methods:
    - photometry
  content: 'PSF 拟合测光: 对源周围像素以点扩散函数做最小二乘拟合, 同时求解重叠源通量与位置: I_model(x,y) = Σ_k F_k × PSF(x - x_k, y - y_k) + B。


    DAOPHOT ALLSTAR/ALLFRAME 为经典实现。


    PSF 构建: 由 10-50 颗亮孤立星平均 (经验表格) 或 Moffat 解析式 I(r) = I0 × (1 + (r/α)²)^(-β), 地面视宁 β 典型 2.5-4.5。


    跨视场 PSF 变化用多项式插值, 欠采样需掩膜处理。


    物理原理: 拥挤场孔径混染无法靠扣背景消除, PSF 拟合以已知形状为先验分离重叠源, 良好条件下可达接近光子统计的精度 (内部 ~0.005-0.03 mag)。


    精度限制: PSF 误差 (非圆/视场变化)、饱和与变光邻星是主要误差源; 拟合半径 ~2-3 × FWHM 最优。


    输出 PSF 星等须经孔径改正归一到无限口径。


    判定线索: 残差图源位置残留正/负结构 = PSF 不匹配, 结果不可信; 大视场未建模 PSF 变化 → 场边缘误差 ~0.05 mag 起。


    饱和源 PSF 拟合失效须剔除; PSF 星等与孔径星等系统差 >0.1 mag = 缺孔径改正。'
  source: Stetson 1987, PASP 99, 191; Anderson & King 2000, PASP 112, 1360; Trujillo et al. 2001, MNRAS 328, 977
  confidence: established
- id: lucky_imaging
  title: 幸运成像 (短曝光选帧叠加)
  category: measurement_principle
  tags:
  - lucky_imaging
  - strehl
  - seeing
  - short_exposure
  - diffraction_limited
  - shift_and_add
  hypothetical_queries:
  - 幸运成像的原理
  - 幸运成像选帧比例怎么定
  - 幸运成像能达到多高的分辨率
  applies_to:
    fields:
    - apparent_magnitude
    entities:
    - star
    methods:
    - photometry
  content: '幸运成像 (lucky imaging): 高帧率拍摄极短曝光 (10-30 ms, 冻结大气湍流), 按像质 (Strehl 比/锐度) 排序, 仅选最佳一小部分帧平移叠加 (shift-and-add), 逼近衍射极限。


    物理原理: 大气湍流偶有瞬时波前近乎平滑的 "幸运" 时刻; 单帧幸运概率 (Fried 1978): P ≈ 5.6 × exp(-0.1557 × (D/r0)²), D 为口径, r0 为 Fried 参数 (好台址 ~0.5-1 m)。


    D/r0 增大概率骤降 — 适用口径 ~2.5 m 以下, D/r0 ~ 7 附近最优。


    选帧: 典型选最佳 1-10% (依亮度与目标折中, 0.3-50% 均有使用); 选帧越严 Strehl 越高但有效曝光越短。


    需低读出噪声快速相机 (EMCCD/L3Vision), 帧率 10-100 Hz。


    性能: 2 m 级望远镜 I/z 带可达 ~0.1 arcsec FWHM、Strehl ~0.2-0.3 (长波长有利); 与快速自适应光学联合已扩展到 5 m 级。


    最佳工作波段 ~800-1000 nm。


    判定线索: 声称亚角秒分辨必须说明选帧比例与有效曝光; D/r0 > 10 时幸运概率极低, 高 Strehl 声明需核实。


    Strehl 与口径须自洽 (小口径高 Strehl 但角分辨低); 未说明选帧条件的 "幸运成像" 结果不可复现。'
  source: Fried 1978, JOSA 68, 1651; Baldwin et al. 2001, A&A 368, L1; Tubbs 2003, lucky exposures (剑桥学位论文)
  confidence: established
  ranges:
    lucky_frame_fraction:
      lo: 0.003
      hi: 0.5
      unit: '1'
- id: spectral_resolution_rvalue
  title: 光谱分辨率 R 值与仪器轮廓
  category: measurement_principle
  tags:
  - resolving_power
  - spectral_resolution
  - instrument_profile
  - velocity_resolution
  - echelle
  applies_to:
    fields:
    - spectral_line_width
    - radial_velocity
    methods:
    - spectroscopy
  hypothetical_queries:
  - 光谱分辨率R值怎么算
  - R=5000的光谱能分辨多快的速度
  - echelle光谱仪分辨率为什么高
  content: '分辨本领 R = lambda/delta_lambda (delta_lambda 为可分辨最小波长差, 常用 FWHM 定义)。

    速度分辨率 delta_v = c/R: R = 1e3 → 300 km/s, R = 5e3 → 60 km/s, R = 1e4 → 30 km/s, R = 4e4 → 7.5 km/s, R = 1e5 → 3 km/s。

    仪器实现: 光栅光谱仪 R = m N (m 级次, N 照射刻线数); echelle 掠射光栅 (刻角 ~63-76°) 以高次 (m ~ 60-130) 工作, R 达 5e4-1.5e5 且十字色散覆盖全波段。

    狭缝宽度控制 R (缝窄 R 高但光损大, 像切分器缓解); 光纤光谱仪 R 由光纤芯径与谱仪参数固定。

    采样要求: 每分辨元需 ≥2-3 像素采样 (欠采样丢失信息/产生伪峰); 观测线宽^2 = 物理^2 + 仪器^2 (卷积) — R 低于物理线宽时测得 FWHM 即仪器轮廓, 只能给线宽上限。

    与测光关系: R 是光谱仪固有属性, 与视宁无关 (狭缝损失另计); 分辨率越高每像素光子越少, 连续谱 S/N 随 sqrt(R) 下降 — 高 R 观测需要更高总曝光。

    物理原理: 衍射极限与狭缝投影决定最小分辨元; R 与色散、准直比、相机焦距互锁, 高 R 通常牺牲波长覆盖或效率。

    判定线索: 声称速度精度优于 c/R 需高 S/N 质心拟合支撑 (可达 ~1/10 分辨元, 但要求 S/N >> 100); 不同 R 的谱线 FWHM/EW 直接比较引入系统差 (低 R 抹平窄线、吸收 EW 系统性偏小); 记录的 R 与刻线数/级次/狭缝宽不自洽 = 记录错误。'
  source: 光谱仪设计教科书 (Schroeder); echelle 设计文献; 光谱分辨率综述
  confidence: established
- id: twod_spectroscopy
  title: 二维光谱 (长缝与积分视场单元)
  category: measurement_principle
  tags:
  - long_slit
  - ifu
  - integral_field_unit
  - data_cube
  - spatial_resolved_spectroscopy
  applies_to:
    entities:
    - galaxy
    - star
    - hii_region
    - agn
    methods:
    - spectroscopy
  hypothetical_queries:
  - IFU积分视场光谱是什么
  - 长缝光谱和IFU有什么区别
  - 星系数据立方体怎么做运动学分析
  content: '二维光谱: 同时获取空间二维与波长维 (x, y, lambda) 数据立方体。

    三类实现 — 长缝 (沿缝 1D 空间 + 波长, 每缝位置一条谱)、狭缝扫描 (多条缝拼接, 效率低)、积分视场单元 IFU (一次曝光覆盖二维视场)。

    IFU 技术路线: 微透镜阵列 (TIGER 型, 空间填充率高、无光纤弯折损失)、光纤束 (MaNGA 型, 127 根/束、束径 12-32 角秒、采样 0.5-2 角秒)、像切分器 (MUSE/SINFONI 型, 视场切条重排上狭缝, 填充因子高, 光谱不受光纤制约)。

    典型参数: 视场 5 角秒-1 角分量级 — MUSE 宽场 1''x1'' @0.2 角秒采样 (窄场 7.5 角秒 @0.025 角秒); 光谱分辨率 R ~ 2e3-4e4 (R 与空间采样互锁)。

    数据规模: 立方体 ~1e5-1e7 空间元素 × 1e3-1e4 通道 (数 GB-数十 GB)。

    测量要点: 天空背景逐空间像素单独扣除 (立方体天光随波长/位置变化); PSF 随波长演化 (大气色散、衍射) 需逐层建模; 波长定标须逐层进行 (色散弯曲与畸变)。

    物理原理: 成像的空间分辨 × 光谱的物理诊断 — 旋转曲线/速度场、外向流与喷流、恒星形成分布、逐像素 BPT 诊断 (AGN-星暴分离)、恒星族与运动学解耦。

    判定线索: 立方体逐像素光谱与小孔径测光/单缝光谱系统性不符 = 天空扣除或 PSF 混叠问题; 声称空间分辨优于视宁/采样极限需复核; 未定标立方体 (通道号当波长) 是常见导出错误; 长缝数据标 ''''二维'''' 却无空间维 = 字段错位。'
  source: Allington-Smith 2006, New Astron. Rev. 50, 244; Bacon et al. 2010 (MUSE); Bundy et al. 2015 (MaNGA)
  confidence: established
- id: sky_background_estimation
  title: 天光背景估计与扣除
  category: measurement_principle
  tags:
  - sky_background
  - airglow
  - zodiacal_light
  - sky_subtraction
  - night_sky
  applies_to:
    fields:
    - apparent_magnitude
    - surface_brightness
    methods:
    - photometry
    - spectroscopy
  hypothetical_queries:
  - 暗夜天空背景有多亮
  - 天光背景怎么扣除
  - 气辉对观测有什么影响
  content: '夜空背景: 暗夜无月好台址天顶 V 带 ~21.8-22 mag/arcsec^2。

    实测值: La Palma V=21.9/B=22.7/R=21.0; Paranal U=22.35/B=22.67/V=21.71/R=20.93/I=19.65; 光污染城区 ~18 mag/arcsec^2。

    成分与量级: 气辉主导 (OI 557.7/630 nm、Na 589 nm、OH 近红外转动带; 太阳极大年亮 ~0.5 mag, 分钟-小时尺度时变)。

    黄道光 ~60 S10 (高黄纬, 黄道面内 ~140 S10, 随季节变化); 未分辨恒星与弥散银河光 ~10-15 S10; 河外背景光 <1 S10。

    扣除方法 (成像): 源外环形区 sigma-clipped 中位数 (孔径测光), 或全图背景模型 (SExtractor BACK_SIZE ~ 128 像素量级网格)。

    光谱扣除: 长缝源两侧天空区 + AB 交替/抖动逐帧扣除; IFU/立方体逐层天空模型; 近红外天光被 OH 发射线主导 (数万根线), 需高分辨率分辨线间窗口或 OH 抑制滤光片; 气辉时变使长曝光天空模型失效。

    物理原理: 天空是加法背景, 其泊松噪声是暗源探测极限的主导项 (暗源 S/N ∝ 1/sqrt(sky)); 扣除残余误差线性进入目标测光。

    判定线索: 未标天空扣除方法的暗源测光不可跨目录比较; 天空高估 → 星等偏暗, 低估 → 偏亮 (同一目标不同孔径系统差 = 扣空不一致); 光谱负值连续谱 = 过扣; OH 线残余呈梳状条纹 = 近红外扣空不彻底; 声称面亮度暗于夜空 2 mag 以上需核对扣空。'
  source: Benn & Ellison 1998, New Astron. Rev. 42, 503; Patat 2008, A&A 481, 575; ESO Paranal 天光测量文档
  confidence: established
  ranges:
    sky_brightness_v:
      lo: 21.5
      hi: 22.5
      unit: mag/arcsec2
- id: radio_channel_dm_smearing
  title: 射电通道内色散涂抹
  category: measurement_principle
  tags:
  - dispersion_smearing
  - channel_bandwidth
  - dedispersion
  - time_resolution
  - radio_spectrometer
  applies_to:
    fields:
    - dispersion_measure
    - scattering_timescale
    entities:
    - pulsar
    - FRB
    methods:
    - radio
    - pulsar_timing
  hypothetical_queries:
  - 色散涂抹是什么
  - 通道带宽怎么影响脉冲宽度
  - 为什么低频脉冲搜索需要窄通道
  content: '通道内色散涂抹: 有限频率分辨率 delta_nu 内色散延迟差把脉冲展宽 delta_t_smear = 8.3 × DM × delta_nu[MHz] × nu[GHz]^(-3) μs。

    推导: 由 delta_t = 4.15 ms DM (nu1^-2 - nu2^-2) 对频率微分; 涂抹与 DM、通道宽成正比, 与频率三次方成反比。

    数值: L 波段 (1.4 GHz), DM = 100, delta_nu = 1 MHz → ~300 μs; 低频 (400 MHz) 同参数 → ~13 ms — nu^-3 使低频涂抹严重数十倍, 低频巡天必须用窄通道。

    对搜索的影响: 涂抹并入观测脉宽使 S/N 下降 (窄脉冲损失最大), 有效脉宽 W_eff = sqrt(W^2 + delta_t_smear^2 + delta_t_scat^2)。

    通道带宽减半 → 涂抹减半; 非相干消色散 (通道化后延迟对齐) 无法恢复通道内涂抹, 相干消色散 (电压域) 可完全消除。

    设计权衡: 窄通道涂抹小但数据量与通道噪声增大 — 典型搜索系统低频用 ~0.1-1 MHz 通道, L 波段以上用 ~0.5-4 MHz; 时间采样与通道宽互锁 (要求涂抹 < 采样间隔)。

    物理原理: 色散延迟 ∝ nu^-2, 通道内高低频端到达时间差即涂抹; 与散射展宽 (∝ nu^-4) 联合可约束视线介质与 DM 精度。

    判定线索: 记录脉宽与 DM/通道宽/频率违反 delta_t = 8.3 DM delta_nu nu^-3 量级 = 通道宽或 DM 字段错误; 低频宽通道观测声称亚毫秒结构 = 不可信 (已被涂抹抹平); 跨望远镜脉宽比较必须先扣除各自涂抹与散射项, 直接比较差 2-3 倍属正常。'
  source: 'Lorimer & Kramer 2004 脉冲星天文手册; Swinburne COSMOS: Pulsar Dispersion Measure'
  confidence: established
- id: faraday_rotation_measurement
  title: 法拉第旋转与旋转量测量
  category: measurement_principle
  tags:
  - faraday_rotation
  - rotation_measure
  - rm
  - depolarization
  - magnetic_field
  - rm_synthesis
  applies_to:
    fields:
    - polarization_angle
    - rotation_measure
    entities:
    - agn
    - galaxy
    - galaxy_cluster
    methods:
    - radio
    - polarimetry
  hypothetical_queries:
  - 法拉第旋转测量是什么
  - 旋转量RM怎么计算
  - 银河系对河外源RM贡献多大
  content: '法拉第旋转: 线偏振波穿越磁化等离子体时偏振角旋转 chi = chi_0 + RM lambda^2 (lambda^2 律)。

    RM = 0.81 ∫ n_e B_∥ dl rad/m^2 (n_e 单位 cm^-3, B_∥ 单位 μG, l 单位 pc) — 电子密度与视线磁场的路径积分, 正负指示 B_∥ 方向。

    测量方法: 多频段 (≥3-4 个) 偏振角对 lambda^2 线性拟合, 斜率即 RM; 频段须覆盖足够 delta_lambda^2 以解 180 度周期模棱两可 (n pi 模糊)。

    拟合残差大 = 多 RM 成分 (法拉第厚介质) 或去偏振, 需 RM 合成 (宽频偏振谱傅里叶重构)。

    典型值: 河外源视向银河系贡献 ~10-100 rad/m^2 (低银纬可达上千); AGN 核区 pc 尺度 ~1e3-1e4 rad/m^2 (吸积流/喷流外鞘), 喷流 ~1e2-1e3; 星系团内背景源 ~5e3-1.2e4 (团磁场 ~5-10 μG)。

    去偏振: 观测带宽内 RM 色散 (delta_chi > 180 度) 或分辨单元内 RM 涨落使偏振度下降 — 低频更严重 (lambda^2 放大); 圆偏振不受法拉第旋转影响 (用于诊断去偏振是否 Faraday 起源)。

    物理原理: 圆偏振正常/异常模折射率差 → 两模相位差随 lambda^2 累积。

    判定线索: 单频段无法测 RM (偏振角单点无 lambda^2 斜率); 目录 RM 须附 lambda^2 拟合残差与频段覆盖说明; 自洽性检查: chi(lambda1) - chi(lambda2) = RM (lambda1^2 - lambda2^2); |RM| 与声称 n_e B_∥ l 违反 0.81 换算量级 = 单位错误。'
  source: Burn 1966, MNRAS 133, 67; Brentjens & de Bruyn 2005, A&A 441, 1217 (RM 合成)
  confidence: established
