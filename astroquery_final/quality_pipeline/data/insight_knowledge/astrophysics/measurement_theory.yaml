- id: radial_velocity_precision
  title: 径向速度测量精度与抖动源
  category: measurement_principle
  tags:
  - radial_velocity
  - precision
  - jitter
  - granulation
  - stellar_activity
  hypothetical_queries:
  - 视向速度能达到多高的精度
  - 恒星活动引起的RV抖动有多大
  - m/s级精度需要什么条件
  applies_to:
    fields:
    - radial_velocity
    entities:
    - star
  content: 'RV 精度层次: 常规中低分辨光谱 ~1-10 km/s; 高分辨光纤光谱仪 (HARPS 级) 光子噪声 ~0.3 m/s、仪器长期稳定 ~1 m/s (13 年波长解漂移 <0.75 m/s); ESPRESSO 设计精度 ~0.1 m/s, 此时微水气线等成为新误差源。


    光子噪声极限: σ_v ∝ c / (Q × S/N), Q 为品质因子 ~ sqrt(N_lines) × R 相关项 — 需高 S/N (>100)、窄谱线与多条谱线联合提取。


    恒星抖动 (jitter) 是 m/s 级精度的主要瓶颈: 米粒组织 ~0.5 m/s (日尺度), 超米粒 ~0.6 m/s, 星斑/磁活动 ~1-5 m/s (随自转与活动周期演化), 磁周期长时标 ~3 m/s (10 年尺度, 可用活动指数建模扣除)。


    判定线索: 同星跨历元 RV 散差 >50 km/s = 双星/谱线混合或测量错误; 宣称 m/s 级精度必须说明 jitter 与活动建模; RV 与活动指数 (S-index/H alpha) 强相关 = 活动伪信号而非轨道信号。'
  source: Dumusque et al. 2021 (HARPS-N solar decade); Pepe et al. 2021, A&A 645, A96 (ESPRESSO)
  confidence: established
