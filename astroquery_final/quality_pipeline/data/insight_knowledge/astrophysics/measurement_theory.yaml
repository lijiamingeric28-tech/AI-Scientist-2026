- id: stokes_polarimetry
  title: 偏振测量与 Stokes 参数
  category: measurement_principle
  tags:
  - polarimetry
  - stokes
  - polarization
  - degree_of_polarization
  - position_angle
  hypothetical_queries:
  - Stokes参数怎么测量
  - 线偏振度与偏振位置角怎么计算
  - 低信噪比偏振测量的系统性偏差
  applies_to:
    fields:
    - polarization_degree
    - polarization_angle
    entities:
    - star
    - galaxy
    - radio_source
  content: 'Stokes 参数 (I, Q, U, V): I 总强度, Q/U 描述线偏振 (两垂直方向强度差及旋转 45 度后再测之差), V 圆偏振; 由多个方向偏振片/双线偏振馈源的强度测量联立求解。


    线偏振度 p_L = sqrt(Q^2 + U^2) / I, 偏振位置角 θ = 0.5 × atan2(U, Q) (IAU 约定, 自北向东); 总偏振度 p = sqrt(Q^2 + U^2 + V^2) / I。


    关键统计问题: p 为正定有偏量, 低 S/N 时噪声使 p 系统性偏大 — 需 Rice 分布去偏 (Serkowski 1958 查表校正); σ(p) ~ σ_r/I, σ(θ) ~ σ(p)/(2p); 仪器偏振需偏振定标/Mueller 矩阵扣除。


    典型精度: 高信号偏振测量 p 精度 ~0.1-0.5%, 位置角 ~1 度; 多数天体线偏振度 <5%, 声称 >30% 的偏振度极罕见、需强证据。


    判定线索: p 列无误差列不可信; p ~ 0 时位置角无定义 (记为 0 度是常见假值); 未去偏的低 S/N p 系统性偏高, 跨目录比较需同 S/N 水平。'
  source: Serkowski 1958; Simmons & Stewart 1985, A&A 142, 100; Myserlis et al. 2018
  confidence: established
  ranges:
    polarization_degree:
      lo: 0.001
      hi: 0.3
      unit: '1'
- id: light_curve_phase_folding
  title: 光变曲线相位折叠与周期搜索
  category: measurement_principle
  tags:
  - light_curve
  - period
  - lomb_scargle
  - phase_folding
  - ephemeris
  - variability
  hypothetical_queries:
  - Lomb-Scargle周期搜索方法
  - 相位折叠图怎么判断周期正确性
  - 谐波混淆导致的周期错误
  applies_to:
    fields:
    - variability_period
    - epoch
    entities:
    - star
    - galaxy
  content: '周期搜索: Lomb-Scargle 周期图处理非均匀采样; 总基线 T 决定频率分辨率 Δf ~ 1/T, 即周期相对误差 ΔP/P ~ P/T; PDM (相位弥散最小化) 对非正弦波形更稳健; 需检查窗口函数引入的混叠峰。


    相位折叠: φ = ((t - T0) mod P) / P; 折叠图按相位 bin 平均后应呈平滑曲线; 真周期判别要点 — 谐波混淆 (P/2 与 2P 均可产生峰值)、消食双星奇偶次极小不对称 (揭示真实周期为 2 倍)、折叠散差最小化。


    食/掩事件计时: 极小时刻 (O-C) 图用于精化历元; 数十年基线的高精度计时可达秒级 (O-C 散差 ~10-40 s); O-C 二次项揭示周期演化 (质量转移/轨道变化), 周期导数 |P_dot/P| 典型 < 1e-10 每周期量级。


    判定线索: 周期列与折叠图不符 (折叠平坦无结构) = 周期错误或采样假峰; 不同目录周期相差 2 倍 = 谐波混淆; 短周期 (P < 0.1 d) 记录需警惕混叠与混染; 相位 bin 内散差远大于测光误差 = 周期不准或次生周期。'
  source: Lomb 1976; Scargle 1982; VanderPlas 2018, ApJS 236, 16
  confidence: consensus
  ranges:
    variability_period:
      lo: 0.01
      hi: 1000.0
      unit: d
- id: astrometric_precession_nutation
  title: 岁差/章动/自行修正与历元转换
  category: measurement_principle
  tags:
  - precession
  - nutation
  - proper_motion
  - aberration
