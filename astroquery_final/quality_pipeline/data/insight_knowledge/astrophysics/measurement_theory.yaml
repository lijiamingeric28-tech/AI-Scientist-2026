    指数定义: (b-y) 为温度指示; m1 = (v-b) - (b-y) 为金属丰度指数; c1 = (u-v) - (v-b) 为表面重力/光度指数; Hβ 对温度敏感且对红化与金属度相对不敏感。


    精度: CCD 观测内部精度 0.005-0.02 mag (亮至 V~17), 微分金属度可达 ~0.01-0.06 dex; 红化换算 E(b-y) ≈ 0.74 E(B-V)。


