    - spectral_line_width
    entities:
    - star
    - galaxy
  content: '谱线基本参数: 中心波长 (质心法或高斯/福格特轮廓拟合), FWHM (半高全宽), 等值宽度 W = ∫(1 - F_l/F_c) dλ (吸收线; 发射线为负)。未饱和时 EW 正比于谱线强度且不依赖分辨率, 但依赖连续谱归一化。


    测量精度: Cayrel 经验公式 ΔW ~ 1.5 × sqrt(FWHM × pixel) / (S/N) (Gaussian 线); 弱线极限 σ(W) ∝ W/(S/N); 总误差 = 光子噪声项 ⊕ 连续谱定位不确定项 (Vollmann & Eversberg 2006)。


    FWHM 由天然展宽、热/湍流展宽与仪器轮廓 (R = λ/Δλ) 卷积: 观测线宽^2 = 天然^2 + 物理^2 + 仪器^2; 未分辨线 FWHM 即仪器轮廓宽度, 只能给出上限。


    判定线索: S/N < 10 时 EW 相对误差 >30% 属正常; 低分辨率 (R < 3000) 下吸收 EW 系统性偏小, 比较需同分辨率; 连续谱窗口选择不同引入 ~5-10% 系统差; 发射线 EW 为负值, 与吸收线混用比较会误判。'
  source: Cayrel de Strobel 1988; Vollmann & Eversberg 2006, AN 327, 12
  confidence: consensus
