  content: 'SDSS u''g''r''i''z'' 五色宽带系统 (Fukugita 1996): 有效中心波长约 3550/4770/6230/7630/9130 A, 覆盖 3000-11000 A; 滤光片设计避开强夜天光发射线, 带宽比 Johnson-Cousins 更宽, 利于暗弱源探测。


    AB 零点定义: m_AB = -2.5 log10(f_nu) - 48.60 (f_nu 单位 erg/s/cm^2/Hz), 对应恒定谱 f_nu = 3631 Jy 的物理通量; SDSS 零点基于 Oke & Gunn (1983) 的 AB_95 绝对定标。


    与 Vega 系统换算: 同一物理通量下两系统差值取决于滤光片有效波长与源颜色, u 波段可达 ~1 mag 量级; g/r/i 与 Johnson V/R/I 亦存在 ~0.1-0.5 mag 的颜色相关差, 数值不可直接互换。


    判定线索: 同一源 u 星等跨系统差 >1 mag 属正常而非数据错误; 标称 AB 却按 Vega 零点还原通量会系统性偏移; 星等误差列与波段不匹配 (如 g 带误差与 r 带星等混用) 是常见错误。'
