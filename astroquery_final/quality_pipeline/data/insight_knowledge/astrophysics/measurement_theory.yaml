  hypothetical_queries:
  - 多目标光谱观测是什么
  - 光纤光谱和长缝光谱有什么区别
  - 巡天光谱分辨率一般是多少
  content: '多目标光谱 (MOS): 一次曝光获取大量目标光谱 — 两大路线: 光纤定位与多缝掩膜。

    光纤定位: SDSS 640 根/3 度视场, BOSS 1000 根 2 角秒光纤, DESI 5000 根/3.2 度; 多缝掩膜 (DEIMOS 型) 每掩膜 ~100 缝。

    复用效率: N 目标同时观测等效单目标曝光 ×N — 巡天光谱 (测光红移定标、星系巡天、盲测证认) 的主力, 典型巡天每晚数千-数万条光谱。

    限制: 光纤碰撞 (最小间距 ~1 角分量级, 密场目标系统性遗漏); 光纤口径 (~1.5-2 角秒天区) 与视宁失配 → 通量系统损失 (孔径损耗, 依赖星等与大气视宁); 目标分配算法与平铺重叠区。

    测量要点: 光纤谱绝对通量标定需同视场标准星 + 孔径改正 (与缝谱/测光比较); 巡天光谱多为单次曝光 (S/N 10-20), 弱线参数误差大。

    典型巡天光谱: R ~ 2e3-3e3, 覆盖 3600-10400 A; 目标与天空光谱分开观测 (专用天光光纤)。

    物理原理: 复用因子决定巡天吞吐量; 光纤采样目标核心 (非全通量) — 延展源 (星系核) 存在孔径偏差。

    判定线索: 光纤谱通量与测光/缝谱系统性差 ~0.1-0.3 mag = 孔径损耗 (正常), 更大偏差查定标; 拥挤场光纤光谱缺失源 = 碰撞限制而非源不存在; 延展星系光纤谱报全通量星等 = 口径混淆错误。'
  source: York et al. 2000 (SDSS); DESI Collaboration 2016 (DESI 设计报告); 多目标光谱综述
  confidence: established
