  applies_to:
    fields:
    - spectral_index
    methods:
    - radio
    - radio_interferometry
  content: '谱指数定义: 通量密度幂律 S(ν) ∝ ν^α; 两点指数 α = log(S1/S2) / log(ν1/ν2), 通常取 1.4 GHz 与另一频段的积分通量组合。


    典型值: 同步辐射非热成分 α ≈ -0.5 至 -1.1 (典型 ~-0.7 至 -0.8); 自由-自由热辐射 α ≈ -0.1 (近平坦); 恒星形成星系整体谱指数 ~-0.5 至 -0.8; 反坡 (α > 0) 常见于恒星射电/行星大气而非河外同步辐射。


    误差: σ(α) = (1/ln(ν1/ν2)) × sqrt((σ1/S1)^2 + (σ2/S2)^2); 频段间隔越大误差越小; 流量定标系统差 (5-10%) 常主导误差, 必须并入; 谱曲率 (两段斜率差) 指示自吸收或辐射老化。


    判定线索: 不同目录谱指数须同频段比较 (α 随频段变化); 平坦谱可能是热 + 非热混合而非单一成分; 仅两点且缺误差列的 α 不可直接用于物理推断; 低 S/N (S/N < 10) 时 α 误差急剧增大。'
  source: Condon 1992, ARA&A 30, 575; MIGHTEE-COSMOS 2023
  confidence: consensus
