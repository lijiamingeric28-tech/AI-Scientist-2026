  - 跨目录位置比较要注意什么
  applies_to:
    fields:
    - right_ascension
    - declination
    - proper_motion_ra
    - proper_motion_dec
    entities:
    - star
  content: '跨历元坐标转换 (如 J2000.0 → 观测历元) 需依次施加: 自行 (μ × Δt)、岁差、章动、周年光行差与视差, 各效应幅度差异巨大。


    岁差: 黄经总岁差 ~50.29 角秒/年 (IAU 2006 模型); 春分点移动使给定恒星赤经按 Newcomb 公式变化 (m = 3.074 + 1.337 sin(α) tan(δ) s/yr, n = 20.043 cos(α) 角秒/yr, 即典型 ~46 角秒/yr 量级)。


    章动: 主轴振幅 Δψ ~ 17.2 角秒 (黄经) 与 Δε ~ 9.2 角秒 (黄赤交角), 主周期 18.6 年; 周年光行差由地球轨道速度 (v/c ~ 1e-4) 引起, 幅度 ~20.5 角秒; 恒星周年视差一般 <1 角秒, 需单独施加。


    判定线索: 跨目录位置比较必须先统一历元与参考系 (ICRS 与旧 FK5/历元系统差异 ~0.02-0.1 角秒); 高自行源 (μ > 0.1 角秒/yr) 混用不同历元坐标会引入 >1 角秒系统差; 视差/自行/历元不一致是交叉证认失败的常见原因。'
  source: IAU 2006 岁差模型 (Capitaine et al. 2003); Astronomical Almanac; Lieske et al. 1977
  confidence: established
  ranges:
    proper_motion:
      lo: 0.0
