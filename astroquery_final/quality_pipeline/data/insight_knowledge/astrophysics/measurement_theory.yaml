  hypothetical_queries:
  - 脉冲星计时怎么做
  - TOA精度取决于什么
  - 脉冲星glitch是什么
  content: 'TOA 测量: 高时间分辨率折叠脉冲轮廓与高 S/N 模板互相关, 得单脉冲到达时间 (TOA)。

    计时精度: sigma_TOA ∝ W/(S/N) (W 为脉宽) — 毫秒脉冲星 (W ~ 0.1-1 ms, 高 S/N) 数十年观测可达 ~100 ns-1 μs, 普通脉冲星 ~10-100 μs。

    计时模型: 自转参数 (P, Pdot)、天体测量 (位置/自行/视差)、色散 (DM 及其时变)、双星轨道 (Kepler 参数 + 相对论效应: 夏皮罗延迟/爱因斯坦延迟)。

    全参数最小二乘拟合, 残差随机化检验模型完备性; 残差 = 模型与数据之差, 系统残差揭示未建模效应。

    DM 时变: 视线电子柱密度随季节与星际介质结构变化, 使低频 TOA 抖动 — 需多频同时计时分离 DM 项 (见射电 DM 测量条目)。

    计时噪声与事件: 低频红噪声 (自转不稳定, 以活动参数表征); 年轻脉冲星 glitch — 相位突跳 (delta_nu/nu ~ 1e-9-1e-6, 恢复时标天-年)。

    毫秒脉冲星计时噪声小, 是引力波探测 (PTA) 与双星质量测量 (见质量函数条目) 的主力; 物理原理: 脉冲星是天然时钟, TOA 编码自转相位 = 频率积分 + 各物理效应的到达时间偏移。

    判定线索: 残差呈周年正弦 = 位置误差或周年视差未建模; 残差线性漂移 = Pdot 错误; 残差阶跃 = glitch 或时钟/历元错误; 声称 TOA 精度优于 W/(S/N) 需高 S/N 与窄轮廓支撑; 双星系统残差随轨道相位变化 = 轨道参数错误。'
  source: Lorimer & Kramer 2004 脉冲星天文手册; Hobbs, Edwards & Manchester 2006, MNRAS 369, 655 (TEMPO2)
  confidence: established
- id: multi_object_spectroscopy
  title: 多目标光谱观测 (光纤/多缝)
  category: measurement_principle
