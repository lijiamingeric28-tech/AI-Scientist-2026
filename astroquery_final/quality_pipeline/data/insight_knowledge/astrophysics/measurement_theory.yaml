      unit: mas/yr
- id: radio_interferometry_uv
  title: 干涉测量 uv 覆盖与综合孔径
  category: measurement_principle
  tags:
  - interferometry
  - uv_coverage
  - aperture_synthesis
  - visibility
  - cleaning
  - synthesis_imaging
  hypothetical_queries:
  - uv覆盖是什么
  - 综合孔径成像的基本原理
  - 短基线缺失对延展源成像的影响
  applies_to:
    fields:
    - flux_density
    methods:
    - radio_interferometry
    - VLBI
    - interferometry
  content: '综合孔径: 每对天线测量一个复可见度 V(u,v) = ∫ I(l,m) exp(-2πi(ul + vm)) dl dm, 即天空亮度的一个空间傅里叶分量; N 天线给出 N(N-1)/2 条基线, 地球自转使基线投影旋转, 跟踪观测逐步填充 uv 平面。


    分辨与视场: 角分辨率 θ ~ λ/B_max (最长基线决定); 可成像的最大延展尺度 ~ λ/B_min (最短基线决定) — 短基线缺失造成零间隔问题, 延展发射整体不可见; 视场受单天线主波束限制。


    成像: 可见度逆傅里叶变换得脏图 = 真天图 ⊗ 脏束 (uv 采样函数的变换), 需 CLEAN/最大熵去卷积; 加权方案: natural (∝1/σ², 灵敏度最高), uniform (分辨率最高), robust (折中), tapering (抑制旁瓣、牺牲分辨率)。


    误差: 相位定标误差 (大气 + 仪器) 主导像质量; 带宽/时间平均涂污 ∝ 离相位中心角距; 流量定标 ~5-10%; 天体赤纬低时 uv 覆盖变差 (近一维)。


    判定线索: 宣称的高分辨结构须与 λ/B_max 分辨率自洽; 延展源通量在短基线不足的阵列上系统性低估; 不同配置/历元观测的延展源通量差异 >20% 应复核。'
  source: Thompson, Moran & Swenson 2017, Interferometry and Synthesis in Radio Astronomy
  confidence: established
  ranges:
    angular_resolution:
      lo: 1.0e-05
      hi: 1000.0
      unit: arcsec
- id: error_propagation_weighted
  title: 误差传播与加权平均
  category: measurement_principle
  tags:
  - error_propagation
  - weighted_mean
  - inverse_variance
  - bessel
  - statistics
  hypothetical_queries:
  - 误差传播公式怎么用
  - 逆方差加权平均怎么合并测量
  - 测量散差大于误差预期怎么办
  content: '误差传播: 对 f(x1, x2, ...), σ_f^2 = Σ (∂f/∂xi)^2 σ_xi^2 (独立误差相加); 幂律 f = x^a y^b → (σ_f/f)^2 = a^2 (σ_x/x)^2 + b^2 (σ_y/y)^2; 相关误差需引入协方差项。


    加权平均: x̄ = Σ w_i x_i / Σ w_i, 权重 w_i = 1/σ_i^2 (逆方差加权, 高斯噪声下即最大似然估计), 合并不确定度 σ_x̄ = 1/sqrt(Σ w_i); N 个等精度测量合并 → σ/√N。


    注意: 方差由有限样本估计时需 Bessel 修正 — 第 i 源由 n_i 个样本估计方差时权重 ∝ (n_i - 1)/v_i; 测量间散差超过误差预期 (MSWD >> 1) 表示过离散, 需随机效应模型 w_i = 1/(v_i + τ^2) 或分层模型, 否则 σ_x̄ 被系统性低估。


    判定线索: 加权平均误差显著小于任一单测量误差时应检查一致性; 合并值必须说明是否含系统差 (定标误差不随 N 减小); 加权平均只对同量纲、同口径定义的量有效; 个别坏点会破坏逆方差加权, 需稳健统计 (中位数/剔除)。'
  source: Taylor 1997, An Introduction to Error Analysis; Hogg et al. 2010, arXiv:1008.4686
  confidence: consensus
- id: spectral_index_measurement
  title: 谱指数测量 (连续谱幂律斜率)
  category: measurement_principle
  tags:
  - spectral_index
