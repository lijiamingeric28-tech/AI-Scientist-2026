  - 红移后验出现多峰说明什么问题
  - 恒星光谱模板拟合的有效温度误差量级
- id: photometry_astrometry_quality_control
  title: 测光/天测数据质量控制
  category: best_practice
  tags:
  - quality_control
  - photometry
  - astrometry
  - repeatability
  - systematic
  applies_to:
    fields:
    - apparent_magnitude
    - right_ascension
    - declination
    - parallax
    - proper_motion_ra
    - proper_motion_dec
    - flux_density
    entities:
    - star
    - galaxy
  content: "测光/天测数据质量控制 (重复观测与系统差检测):\n\n1. 内部一致性: 重复观测同一源的弥散决定精度地板\n   - 例: 2MASS 要求 SNR >> 20 点源测光重复性 < 5% (0.054 mag); 大巡天全天空零点一致性可达 7-12 mmag (随波段)\n\n2. 系统差检测: 与独立外部目录对比残差 vs 位置/星等/气根\n   - 零点空间变化可达\
    \ 30-50 mmag (平场/孔径改正不足的典型信号); 天测亮星系统差地板 ~16 mas, 框架级 ~5 mas\n\n3. 交叉验证手段: 标准星场反复观测、相邻天区重叠区残差图、恒星色-色轨迹 (零点偏移使轨迹整体平移)\n\n4. 判定线索:\n   - 多个波段零点同向偏移 = 系统零点问题; 仅单波段偏移 = 该波段响应异常\n   - 残差随视位置/时间/气根变化 = 改正项缺失\n\
    \   - 不同仪器同类测量直接合并前必须完成零点一致性检验"
  source: 2MASS Explanatory Supplement; Magnier et al. 2020, ApJS (Pan-STARRS1); Gaia Collaboration 2023, A&A
