- id: robust_fitting_outliers
  title: 鲁棒拟合与离群值处理
  category: methodology
  tags:
  - robust
  - fitting
  - outliers
  - sigma_clipping
  - mad
  - lad
  applies_to:
    fields:
    - flux_density
    - radial_velocity
    - redshift
    entities:
    - star
    - galaxy
  content: "鲁棒拟合与离群值处理:\n\n1. 最小二乘 (L2) 对离群值敏感 (破坏点 0%): 单个坏点即可拉偏拟合\n   - 鲁棒替代: LAD/L1 最小绝对偏差 (破坏点 ~50%), Huber 损失 (c = 1.345, 大残差转线性惩罚), Tukey 双权估计\n\n2. 迭代 sigma 裁剪: 以中位数 (或裁剪均值) 为中心, 剔除超过 2-3 sigma 的点,\
    \ 迭代至收敛\n   - 散布用 MAD: sigma_MAD = 1.4826 x median(|x - median|), 高斯数据下与标准差等价但抗污染\n\n3. 天文场景: 测光零点拟合、径向速度测量、视差批量解算、目录间参考系旋转角估计均需鲁棒拟合\n\n4. 判定线索:\n   - 残差重尾/尖峰时普通最小二乘的参数误差被低估\n   - 裁剪阈值过小或迭代过多会削掉真实信号\
    \ (如变源/发射线)\n   - 裁剪前后统计量变化超过 1 sigma = 离群值在主导结果, 必须报告两种结果"
  source: Huber 1964, Ann. Math. Statist.; Hampel et al. 1986, Robust Statistics; astropy.stats 文档; Martin & Mortlock 2024, MNRAS
  confidence: consensus
