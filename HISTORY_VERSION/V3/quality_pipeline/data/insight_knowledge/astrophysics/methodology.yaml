  content: "机器学习分类 (随机森林/神经网络/不平衡处理):\n\n1. 常用模型: 随机森林/梯度提升树 (XGBoost) 在星-星系-类星体分离上准确率可达 99% 量级且可解释 (特征重要度); 神经网络 (MLP/CNN) 适合光谱/图像分类, 但需大数据量与调参\n\n2. 样本不平衡: 稀有类 (类星体、暂现源) 占比很低时:\n   - SMOTE/SMOTEENN 过采样、类别权重、代价敏感学习\n\
    \   - 评估用精确率/召回率/F1 与 ROC-AUC; 总体准确率会掩盖稀有类全漏\n\n3. 交叉验证: 分层 K 折保持类别比例; 训练集必须与目标巡天同源、同选择函数\n\n4. 判定线索:\n   - 验证集精度高但独立巡天数据上骤降 = 选择函数/零点差异导致的分布漂移\n   - 准确率高而稀有类召回率过低 = 不平衡未处理\n   - 输出概率接近 0.5 的样本应标注待确认,\
    \ 不要强制归类"
  source: Breiman 2001, Machine Learning; Chawla et al. 2002, JAIR (SMOTE); Ball et al. 2006, ApJ
