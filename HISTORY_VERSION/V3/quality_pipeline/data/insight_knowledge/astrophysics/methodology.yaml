- id: selection_bias_correction
  title: 选择偏差 (Malmquist 偏差) 识别与改正
  category: methodology
  tags:
  - selection
  - bias
  - malmquist
  - completeness
  - luminosity_function
  applies_to:
    fields:
    - apparent_magnitude
    - flux_density
    - luminosity
    - redshift
    entities:
    - galaxy
    - agn
    - quasar
    - star
  content: "选择偏差 (Malmquist 偏差) 的识别与改正:\n\n1. 物理原理: 流量受限 (星等受限) 巡天在远处丢失本征暗源, 观测样本的平均绝对星等系统性偏亮; 在星等 m 处偏亮量 delta M ~ sigma^2 d ln A(m)/dm (sigma 为绝对星等弥散, A(m) 为源计数函数, Malmquist 1920)\n\n2. 选择函数: 探测概率 p(S|F)\
    \ = 0.5[1 + erf((F - F_th)/(sqrt(2) sigma(F)))], 由流量极限与测量噪声决定\n\n3. 改正方法:\n   - 1/Vmax 加权: 每个源按其可探测最大体积倒数加权, 等效构造体积受限样本\n   - 极大似然法: 光度函数建模时显式包含不完备函数 f(m)\n   - 贝叶斯前向建模: 选择函数写入似然, 同时改正 Malmquist 与 Eddington\
    \ 偏差 (阈值附近噪声散射)\n\n4. 判定线索:\n   - 光度函数亮端过陡或暗端人为截断 = 选择效应未改正\n   - 视星等分布堆积在极限星等附近 = 样本不完备\n   - 平均亮度随红移系统性增加 = 亮端偏倚, 跨样本比较统计量前必须检查"
  source: Malmquist 1920; Schmidt 1968, ApJ 151; Sandage, Tammann & Yahil 1979, ApJ; Lauer et al. 2021, ApJ
  confidence: consensus
  hypothetical_queries:
  - Malmquist 偏差怎么识别和改正
  - 1/Vmax 加权法怎么构造等效体积受限样本
  - 视星等堆积在极限星等附近说明什么
- id: volume_limited_sample
  title: 体积受限样本与 V/Vmax 检验
  category: methodology
  tags:
  - volume_limited
  - v_over_vmax
  - completeness
  - redshift
  - sample
  applies_to:
    fields:
    - redshift
    - apparent_magnitude
    - luminosity
    - distance
    entities:
    - galaxy
    - agn
    - quasar
  content: "体积受限样本与 V/Vmax 检验:\n\n1. 构造: 按红移 (距离) 上限 z_max 截断, 使该体积内所有亮于光度阈值的源全部纳入; 与流量受限样本不同, 完备性不随距离恶化\n\n2. V/Vmax 检验 (Schmidt 1968): V = 源所在红移对应的体积, Vmax = 该源仍可被探测的最大红移对应体积\n   - 空间分布均匀时 V/Vmax 在 [0,1]\
    \ 均匀分布, 均值 0.5, 标准差 1/sqrt(12) ~ 0.288\n   - <V/Vmax> 显著大于 0.5 = 空间密度演化或样本不完备; 小于 0.5 = 密度随距离衰减\n   - 用 KS 检验检验均匀性; 多个流量极限 (如射电+光学) 时取先达到者的 Vmax\n\n3. 用途: 检验流量受限样本完备性; 光度函数/质量函数数密度估计的参照基准\n\n4. 判定线索:\n\
    \   - 声称体积受限的样本在 z_max 内仍缺亮源 = 不完备\n   - 体积受限与流量受限样本光度函数亮端不一致 = 改正或截断错误"
  source: Schmidt 1968, ApJ 151; Avni & Bahcall 1980, ApJ 235
