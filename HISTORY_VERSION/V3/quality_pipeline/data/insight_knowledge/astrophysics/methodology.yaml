- id: extinction_correction_method
  title: 消光改正方法
  category: methodology
  tags:
  - extinction
  - reddening
  - color_excess
  - E(B-V)
  - rv
  applies_to:
    fields:
    - extinction
    - apparent_magnitude
    - absolute_magnitude
    entities:
    - star
    - galaxy
  content: '消光改正流程:

    1. 色余法: E(B-V) = (B-V)_obs - (B-V)_0; 本征色 (B-V)_0 由光谱型校准表给出

    2. 消光换算: A_V = R_V x E(B-V); 弥散星际介质 R_V = 3.1 +- 0.2 (CCM 消光律), 视线方向实测 2.5-4.7 (大 R_V = 尘埃颗粒偏大)

    3. 多波段: A_lambda 由消光律 (CCM/Fitzpatrick) 内插; 近红外 A_lambda ~ lambda^-1.6~-2.6, 对消光不敏感

    4. 标准星法: 用光谱型已知的 OB 星测多波段色余, 拟合得到 R_V 与 A_V


    判定线索:

    - E(B-V) < 0 = 本征色估计错误或非恒星污染 (双星/发射线星)

    - 银河系前景尘埃图 (SFD/3D 消光图) 与观测色余矛盾时, 用近红外交叉验证 (红外对消光不敏感)

    - 远红外/射电波段无需光学消光改正

    - 改正后颜色应落回恒星/星系本征色序列; 改正过量会使颜色异常过蓝'
  source: Cardelli, Clayton & Mathis 1989, ApJ; Rieke & Lebofsky 1985, ApJ; Fitzpatrick 1999, PASP; Schlafly et al. 2016, ApJ
  confidence: consensus
  hypothetical_queries:
  - E(B-V) 为负说明什么
  - 消光换算 R_V 取 3.1 还是按视线方向实测值
  - 近红外波段需要做光学消光改正吗
- id: mcmc_sampling_astro
  title: 马尔可夫链蒙特卡洛 (MCMC) 参数采样
  category: methodology
  tags:
  - mcmc
  - markov_chain
  - monte_carlo
  - sampling
  - emcee
  - posterior
  applies_to:
    fields:
    - redshift
    - stellar_mass
    - luminosity
    - orbital_period
    - effective_temperature
  content: "MCMC: 从后验分布采样的标准方法, 贝叶斯参数估计的默认工具 (常用 affine-invariant 集成采样器 emcee)\n\n1. 配置: walkers 通常 30-100, 每链数万步量级; 初始位置散布整个先验范围\n2. 收敛判据 (结果报告必须包含):\n   - burn-in: 丢弃未收敛初始段 (通常前 10-30%)\n   - 自相关时间 tau:\
    \ 有效样本数 N_eff = N / tau, N_eff > 100 才可靠 (粗略)\n   - 多链混合检验: Gelman-Rubin R_hat < 1.1\n3. 输出: 后验中位数 + 16%/84% 分位或 HPDI; 参数高度相关时只报边缘分布会误导\n\n判定线索:\n- 结果缺少链长度与收敛诊断 = 可靠性存疑\n- 后验峰堆积在参数边界 = 先验或模型问题\n- 后验与最小二乘最佳值相差\
    \ > 3 sigma 且非对称 = 非高斯后验, 均值不可靠\n- 与贝叶斯推断条目配套使用: 先验选择决定采样空间"
  source: Foreman-Mackey et al. 2013, PASP (emcee); Hogg & Foreman-Mackey 2018, ApJS
  confidence: consensus
