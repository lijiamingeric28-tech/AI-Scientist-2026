  - error_estimation
  applies_to:
    fields:
    - redshift
    - luminosity
    - flux_density
    entities:
    - galaxy
    - star
  content: "Bootstrap/Jackknife 重采样误差估计:\n\n1. Bootstrap (Efron 1979): 从样本有放回重抽样 B 次 (通常 1000-10000), 每次重算统计量, 由分布给出标准误与 68%/95% 百分位区间\n   - 适用于任意统计量 (中位数、相关、拟合参数), 无需解析误差公式\n\n2. Jackknife: 依次剔除一个 (或一块)\
    \ 观测后重算 n 次; 计算量小但方差估计有偏\n\n3. 天文注意事项:\n   - 强相关/成团数据 (如星系相关函数) 须按子体积块重采样, 逐天体 bootstrap 使方差偏高 ~40%\n   - 样本过小 (n < 20) 时 bootstrap 区间不稳; 非对称分布用 BCa 偏差校正区间\n\n4. 判定线索:\n   - 误差报告无方法说明时优先怀疑简单高斯假设\n \
    \  - bootstrap 与解析误差显著不一致 = 分布非高斯或存在相关结构"
  source: Efron 1979, Ann. Statist.; Barrow, Bhavsar & Sonoda 1984, MNRAS; Norberg et al. 2009, MNRAS 396
