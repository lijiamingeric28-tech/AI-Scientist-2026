  - 未去混叠的测光会有什么系统偏差
- id: lomb_scargle_periodogram
  title: Lomb-Scargle 周期图
  category: methodology
  tags:
  - periodogram
  - period_search
  - time_series
  - lomb_scargle
  - variability
  applies_to:
    fields:
    - orbital_period
    - apparent_magnitude
    - flux_density
    entities:
    - star
    - galaxy
    - agn
  content: "Lomb-Scargle 周期图: 非均匀采样时间序列周期搜索的标准方法, 等价于对正弦 y = A sin(2 pi f t) + B cos(2 pi f t) 做最小二乘拟合; 传统 FFT 在缺测/非等间隔数据上不可用\n\n1. 功率谱峰值对应候选周期; 峰值高度本身不是显著性\n2. 假警报概率 FAP: 噪声产生同高功率的几率\n   - FAP < 0.01 (或\
    \ 0.001) 才认为显著, 需考虑独立频率数修正\n   - 计算: Baluev (2008) 解析公式 或 蒙特卡洛置换检验 (bootstrap)\n3. 窗口函数: 采样模式产生混叠峰 — 地面观测 1 天混叠 (f_alias = f_true +- n/day), 月相 ~1/27 天; 分析前先检查窗口函数\n\n判定线索:\n- 周期接近观测基线长度或采样间隔倍数的峰不可信\n\
    - 谐波峰 (P/2, 2P) 常见, 需确认基频\n- 报告必须给出 FAP 而非裸功率; 不同 FAP 方法结果差异大时取保守值\n- 周期值跨目录比较: 核对采样基线是否覆盖周期 (基线过短测不到长周期)"
  source: Lomb 1976, Ap&SS; Scargle 1982, ApJ; VanderPlas 2018, ApJS; Baluev 2008, MNRAS
  confidence: consensus
