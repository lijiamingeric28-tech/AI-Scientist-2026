    - apparent_magnitude
    entities:
    - galaxy
    - agn
    - quasar
    - star
  content: "上限值 (未检出) 数据处理 — 生存分析:\n\n1. 问题: 未检出的源给出流量上限而非真实值; 丢弃上限、填 0 或填流量极限都会系统性偏倚统计量 (光度分布/光度函数偏亮)\n\n2. Kaplan-Meier 乘积限估计 (Feigelson & Nelson 1985 引入天文): 无参数估计含删失数据的分布, 得到均值/中位数/百分位\n   - 上限是左删失,\
    \ 用变换 Y = M - X 转为右删失后处理 (ASURV 软件)\n\n3. 两样本检验 (Gehan/logrank/Peto-Prentice) 与删失回归 (Schmitt, Buckley-James) 用于子样本比较与相关性检验\n\n4. 有效性条件: 删失必须与变量本身无关 (随机删失); 最亮源也删失时均值未定义, 中位数始终可定义\n\n5. 判定线索:\n   - 数据库上限标记\
    \ (is_upper_limit 类字段) 被当作真实值 = 统计结论不可信\n   - 仅用检测源推导的分布系统性偏亮, 与含上限的 KM 估计对比可量化偏差"
  source: Kaplan & Meier 1958, JASA; Feigelson & Nelson 1985, ApJ; Isobe, Feigelson & Nelson 1986, ApJ; ASURV (LaValley, Isobe & Feigelson 1992)
