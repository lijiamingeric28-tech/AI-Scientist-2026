  content: "天文聚类分析方法 (DBSCAN/层次/图聚类):\n\n1. DBSCAN: 参数 eps (邻域半径) + min_samples (核心点最小邻居数); 无需预设簇数, 抗噪, 支持任意形状\n   - 天文惯例: min_samples ~ 2 x 维数 (5D Gaia 天体测量数据取 ~10); eps 由 k 近邻距离曲线拐点确定\n   - 密度不均的场用 HDBSCAN\
    \ (层次扩展版, 自动选尺度)\n\n2. Friends-of-Friends (FoF): 链接长度内互相连通的点成团; 宇宙学模拟找暗晕的标准工具 (链接长度取 ~0.2 x 平均粒子间距量级)\n   - 链接长度过大合并簇, 过小分裂簇\n\n3. 层次/图聚类: 树状图按成员数或致密度切分; 谱聚类用于速度场/组群划分\n\n4. 判定线索:\n   - 成员数低于场污染预期 =\
    \ 虚假簇 (需背景扣除)\n   - 位置聚集但红移弥散大 = 前景/背景混合, 需速度信息确认\n   - 结果对超参数敏感时不可靠; 用轮廓系数等内部指标评估稳健性"
  source: Ester et al. 1996, KDD (DBSCAN); Huchra & Geller 1982, ApJ (FoF); Castro-Ginard et al. 2018, A&A; Hunt & Reffert 2021, A&A
  confidence: consensus
