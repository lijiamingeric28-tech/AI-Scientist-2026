- id: monte_carlo_simulation
  title: 蒙特卡洛模拟 (不确定度传播与合成观测)
  category: methodology
  tags:
  - monte_carlo
  - simulation
  - uncertainty
  - synthetic
  - injection
  applies_to:
    fields:
    - flux_density
    - luminosity
    - redshift
    - stellar_mass
    entities:
    - galaxy
    - star
    - agn
  content: "蒙特卡洛模拟 (不确定度传播与合成观测):\n\n1. 不确定度传播: 对每个测量按其误差分布采样 N 次 (通常 N = 1000-10000), 重算导出量, 由结果分布给出中位数与 68%/95% 区间\n   - 适用于非线性公式与相关误差 (相关时需按误差协方差联合采样)\n\n2. 合成观测 (mock catalog): 按物理模型生成模拟巡天并注入真实选择函数与噪声,\
    \ 用于:\n   - 注入-回收试验: 注入已知源统计回收率, 得到完备函数与检测极限\n   - 估计系统偏差与协方差矩阵 (外部误差参考)\n\n3. 注意: 模拟结果的统计误差 ~ 1/sqrt(N); 采样分布必须反映真实误差, 误差低估会伪造显著性\n\n4. 判定线索:\n   - 报告误差仅来自解析传播而无 MC 检验 = 未计入系统误差\n   - 注入-回收完备曲线在极限星等/流量处陡降是正常形态,\
    \ 非数据错误"
  source: Metropolis & Ulam 1949, JASA; Andrae 2010, arXiv:1009.2755; Norberg et al. 2009, MNRAS 396
  confidence: consensus
  hypothetical_queries:
  - 蒙特卡洛不确定度传播一般采样多少次
  - 注入回收实验怎么测量巡天完备性
  - 相关误差在蒙特卡洛模拟里怎么联合采样
- id: k_correction_method
  title: K 改正 (波段平移改正)
  category: methodology
  tags:
  - k_correction
  - photometry
  - redshift
  - bandshift
  - absolute_magnitude
  applies_to:
    fields:
    - apparent_magnitude
    - absolute_magnitude
    - redshift
    - flux_density
    entities:
    - galaxy
    - agn
    - quasar
  content: "K 改正 (波段平移):\n\n1. 定义 (Hogg et al. 2002): m_R = M_Q + DM + K_QR, 即观测波段 R 的视星等与发射系波段 Q 的绝对星等之间的桥; DM = 5 log10(D_L/10 pc)\n   不做 K 改正直接比较不同红移源 = 比较不同静止波段的光, 结果无物理意义\n\n2. 波段平移特例: 改正到蓝移 (1+z)\
    \ 的波段时 K = -2.5 log10(1+z) (AB 系统), 与源 SED 无关 — SDSS 的 0.1r 带即采用此思路\n\n3. 幂律近似: SED 为 f_nu ~ nu^-alpha 时经典 K = 2.5(alpha - 1) log10(1+z); alpha = 1 (nu f_nu 常数) 时 K = 0\n\n4. 典型值: 光学波段红星系 z ~ 0.3-0.7\
    \ 时 K ~ +0.3 至 +1.0 mag; 忽略改正会使绝对星等偏暗、光度偏低\n\n5. 判定线索:\n   - 高红移源绝对星等/光度系统性偏小 = 未做 K 改正\n   - 外推远超模板覆盖波长范围时 K 改正不确定度剧增, 应标注"
  source: Oke & Sandage 1968, ApJ; Hogg et al. 2002, PASP 114; Blanton & Roweis 2007, AJ
  confidence: consensus
  hypothetical_queries:
  - K 改正公式怎么使用
  - 不做 K 改正直接比较高红移星系会有什么偏差
  - 红移 0.5 附近红星系 K 改正典型值多少
- id: spectral_template_fitting
  title: 光谱模板拟合 (红移/恒星参数/发射线分解)
  category: methodology
  tags:
  - template_fitting
  - photometric_redshift
  - sed
  - stellar_parameters
  - emission_line
  applies_to:
    fields:
    - redshift
    - spectral_type
    - effective_temperature
    - surface_gravity
    - metallicity
    - flux_density
    entities:
    - galaxy
    - star
    - agn
  content: "光谱模板拟合 (红移估计/恒星参数/发射线分解):\n\n1. 红移估计 (SED 模板法): 在模板网格 x 红移网格上最小化 chi2 = sum (m_obs - m_model)^2 / sigma^2 (BPZ/LePhare/EAzY 范式), 结合光度函数先验与断带位置约束\n   - 亮样本典型精度 sigma ~ 0.02-0.03 (NMAD ~3% 量级);\
    \ 深场有 1-3% 灾难性失败 (photo-z 偏差 > 0.1(1+z), 颜色简并)\n\n2. 恒星参数: 观测光谱与合成谱网格 (Teff/log g/[Fe/H], 如 PHOENIX/BT-Settl) 匹配或机器学习回归, 高信噪比时 Teff 误差 ~100 K 量级\n\n3. 发射线分解: 每根线用高斯/洛伦兹分量拟合 (宽窄线成分、恒星形成区多分量), 线比如 [OIII]/Hbeta\
    \ 用于激发分类\n\n4. 判定线索:\n   - 红移后验多峰 = 模板简并 (年轻恒星+消光与高红移模式相似)\n   - 拟合残差含强发射线特征 = 模板缺发射线成分\n   - 恒星参数与光谱型矛盾时优先怀疑模板覆盖范围而非数据"
  source: Arnouts et al. 1999, MNRAS; Benitez 2000, ApJ (BPZ); Ilbert et al. 2006, A&A; Brammer et al. 2008, ApJ (EAzY); Cavuoti et al. 2017, MNRAS
  confidence: consensus
  hypothetical_queries:
