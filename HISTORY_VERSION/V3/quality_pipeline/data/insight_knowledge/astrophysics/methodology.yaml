- id: limiting_magnitude_estimation
  title: 极限星等估计 (曝光/口径/天光公式)
  category: methodology
  tags:
  - limiting_magnitude
  - signal_to_noise
  - exposure_time
  - sky_background
  - depth
  applies_to:
    fields:
    - apparent_magnitude
    - flux_density
  content: '极限星等估计 (背景受限点源):

    m_lim = zp - 2.5 log10(SNR x sqrt(n B / t))  (zp 零点星等, n 源覆盖像素数, B 天光每像素电子数, t 总曝光秒)


    三种噪声区制: 源噪声受限 SNR ~ t^0.5; 背景受限 (最常见) SNR = N_src/sqrt(N_sky);

    读出噪声受限 SNR ~ t (读出噪声不随曝光累积) — 极限星等 ~ zp - 1.25 log10(t)


    经验标度: 曝光 4 倍 -> 深 0.75 mag; 天光亮 2 倍 -> 曝光需 2 倍补偿;

    视宁度差 2 倍 -> 损失 0.4-0.75 mag (源像素 n ~ FWHM^2);

    SNR 要求 3 -> 5 -> 暗 0.4-0.55 mag、需 ~2.8 倍曝光。


    物理原理: 泊松统计 + 天光本底主导噪声; 深度随 t 只按 1.25 log10(t) 增长。


    判定线索: 声称极限星等与曝光/口径/天光组合不符时用公式核算;

    深场叠加深度 m_coadd = 1.25 log10(Σ 10^(0.8 m_i))。

    '
  source: McLean 1997; LSST Science Requirements SM TN-016; INGRID/LIRIS 灵敏度文档
  confidence: consensus
  hypothetical_queries:
  - 1 米望远镜 1 小时曝光在暗天光下的极限星等是多少
  - 如何用信噪比公式估算点源探测极限星等
  - 曝光时间翻倍极限星等能提高多少
- id: signal_noise_trading
  title: 信噪比权衡 (时间/波段/空间分辨率分配)
  category: methodology
  tags:
  - signal_to_noise
  - tradeoff
  - exposure_time
  - resolution
  - sky_background
  applies_to:
    fields:
    - flux_density
    - apparent_magnitude
  content: '信噪比权衡: 观测时间/波段/空间分辨率的分配规则

    SNR = N_src / sqrt(N_src + N_sky + RN^2)  (N_src 源光子, N_sky 天光, RN 读出噪声)


    关键标度 (固定其他条件): 背景受限 SNR ~ sqrt(t) (翻倍需 4 倍曝光);

    读出噪声受限 SNR ~ t; 源噪声受限 SNR ~ sqrt(t);

    空间分辨率: PSF 半宽减半 -> 源像素 n 减为 1/4 -> 背景受限 SNR 约增 2 倍 (拥挤场代价: 混叠);

    光谱分辨率: R 翻倍 -> 每像素光子减半 -> 连续谱 SNR 降 ~sqrt(2), 线/连续对比提高;

    天光: 月夜亮 1-3 mag, 暗弱源需大幅加曝光或换窄带。


    物理原理: 背景受限时天光是独立于源的泊松本底;

    分辨率-深度权衡由源像素数 n 与孔径范围决定。


    判定线索: 声称配置 A 比 B 深 1 mag 而曝光/口径相同, 用上式核算;

    比较不同空间/光谱采样配置必须固定总光子预算。

    '
  source: LSST SM TN-016; 曝光时间计算器文档; 观测策略文献
  confidence: consensus
  hypothetical_queries:
  - 观测时间与信噪比如何权衡
  - 空间分辨率和光谱分辨率如何影响信噪比
  - 暗弱源观测选择窄带还是宽带
- id: astrometric_calibration_method
  title: 天体测量校准 (参考网/畸变模型/内部一致性)
  category: methodology
  tags:
  - astrometry
  - calibration
  - plate_solution
  - gaia
  - reference_frame
  applies_to:
    fields:
    - right_ascension
    - declination
    - parallax
    - proper_motion_ra
    - proper_motion_dec
  content: '天体测量校准: 参考星网 + 畸变模型两步

    1. 参考网: 用 Gaia 参考星 (G~20 时精度 ~0.7 mas) 或自建合成主框架

    2. 匹配: 星象检测 -> 参考目录匹配 -> 拟合切平面多项式/几何畸变模型 (SCAMP 范式)

    3. 残差评估: 内部 RMS 与外部 RMS 分开报告


    典型值: 地面 CCD 单帧天测解算 ~10 mas (受畸变模型限制, 非 Gaia 精度限制);

    底片扫描重归算内部 RMS ~20-40 mas, 外部 ~0.15-0.3 arcsec;

    差分天测 (小视场相对测量) 可至微角秒级; Gaia DR2 亮星框架旋转 ~0.15 mas/yr (EDR3 已修正)。


    物理原理: 位置误差 = 星象定心、畸变模型与参考网误差的卷积;

    参考网不自洽时拟合会把系统差吸收进畸变模型。


    判定线索: 单帧残差 > 50 mas 提示畸变阶数不足/参考星太少/含自行大源;

    跨历元合并前必须统一参考框架 (ICRS) 并外推自行到共同历元。

    '
  source: Zheng, Peng & Lin 2021, MNRAS; Lindegren et al. 2021, A&A (Gaia EDR3); NAROO 项目
  confidence: consensus
  hypothetical_queries:
  - 用 Gaia 参考星做天体测量校准的精度能达到多少
  - CCD 图像天测解算内部一致性多少 mas
  - 底片扫描天测校准方法
- id: spectroscopy_template_redshift
  title: 光谱红移模板匹配 (交叉相关/发射线红移)
  category: methodology
  tags:
  - redshift
  - cross_correlation
  - emission_line
  - spectroscopy
  - spec_z
  applies_to:
    fields:
    - redshift
    - spectral_type
  content: "光谱红移测量 (模板匹配法):\n1. 交叉相关法 (Tonry & Davis 1979): 观测谱与模板谱傅里叶交叉相关, 峰位移给红移/速度;\n   误差估计 sigma_v ~ k/(1+r) (r 为相关峰信噪比), 可靠性阈值 r >= 3-4\n2. 发射线拟合法: 拟合 [O II] 3727/H-beta/[O III] 4959,5007 等多线联合定红移;\n\
    \   单线精度 ~30-70 km/s (波长定标限制), 弱谱 ~150-300 km/s\n3. 吸收线星系: 模板匹配精度 ~50-100 km/s, 模板失配是主要误差源\n\n典型精度: spec-z 相对误差 1e-3 到 1e-4; photo-z 3-6% — 两者不可混用\n\n物理原理: 谱线位移 z = (lambda_obs - lambda_rest)/lambda_rest;\n\
    交叉相关把整谱信息压缩为单峰, 抗噪且自动按强线加权。\n\n判定线索: r < 3 的红移应标注不可靠; 单发射线红移须警惕\n[O II] 3727 与 H-alpha 6563 错认 (对应 z 差 ~0.76);\n与 photo-z 差 > 0.1(1+z) 属灾难性失败。\n"
  source: Tonry & Davis 1979, AJ 84, 1511; Kurtz & Mink 1998, PASP (RVSAO); SDSS 光谱处理文档
  confidence: consensus
  hypothetical_queries:
  - 光谱红移交叉相关法 r 值多少才可靠
  - 发射线星系光谱红移测量精度多少 km/s
  - 如何判断光谱红移是否可靠
- id: photometric_variability_detect
  title: 变光检测 (统计显著性/超额方差/结构函数)
  category: methodology
  tags:
  - variability
  - excess_variance
  - fvar
  - structure_function
  - significance
  applies_to:
    fields:
    - apparent_magnitude
    - flux_density
  content: "变光检测 (统计显著性):\n1. 常量假设检验: chi2 = Σ (m_i - <m>)^2 / sigma_i^2, 自由度 N-1;\n   概率 < 1e-3 判显著变光 (注意误差低估会伪造显著性)\n2. 超额方差/分数变幅: sigma_XS^2 = chi2/(N-1) - <err^2>;\n   Fvar = sqrt((sigma_XS^2)/<m>^2)\
    \ (Vaughan 2003) — 单段光变 Fvar 散布大,\n   跨段/跨源比较需蒙特卡洛 (红噪声使方差逐段跳动)\n3. 结构函数 SF(dt) = sqrt(<(m_i - m_j)^2>): 幅度-时标关系,\n   平稳红噪声 SF ~ dt^gamma (DRW: gamma ~ 0.5, 见 agn_variability_model)\n\n物理原理: 天文光变为红噪声\
    \ (PSD ~ f^-alpha, alpha ~ 1-2),\n短窗口方差估计剧烈涨落 — 显著性必须对红噪声蒙特卡洛校准。\n\n判定线索: 仅两点星等差 > 3 sigma 仍可能是噪声; 报告必须含\nFAP 或卡方概率; 先排除孔径/零点系统漂移再谈变光。\n"
  source: Vaughan et al. 2003, MNRAS 345, 1271; Kozlowski 2016, ApJ 826, 118; Sesar et al. 2010, ApJ
  confidence: consensus
  hypothetical_queries:
  - 如何判断一颗恒星的光变是否显著
  - 超额方差 Fvar 计算变光幅度
  - 光变结构函数怎么计算
- id: multi_epoch_combination
  title: 多历元合并 (加权平均/去趋势/系统差处理)
  category: methodology
  tags:
  - multi_epoch
  - coadd
  - weighted_mean
  - zero_point
  - detrending
  applies_to:
    fields:
    - apparent_magnitude
    - flux_density
  content: '多历元合并 (加权平均/叠加):

    1. 历元间零点归一: 每帧先校准到共同零点; 随时间/位置变化的零点需模型化

    2. 加权平均: m = Σ(w_i m_i)/Σ(w_i), w_i = 1/sigma_i^2; 合并误差 sigma_comb = 1/sqrt(Σ w_i)

    3. 超散检验: chi2 = Σ (m_i - m_comb)^2/sigma_i^2 >> N-1 -> 历元间系统差未消除 (或真实变光)

    4. 图像叠加 (coadd): 加权平均 + sigma 裁剪剔坏帧; 深度 m_coadd = 1.25 log10(Σ 10^(0.8 m_i))

    5. 去趋势: 剔除大气/仪器慢漂移, 注意别削掉真实长时标信号


    物理原理: 独立高斯误差的加权平均最优; 残留系统差 (零点/PSF 变化)

    是合并精度天花板, 大巡天相对零点一致性 ~3-10 mmag。


    判定线索: 合并后 chi2 过大 -> 零点未对齐而非随机误差;

    声称精度好于单历元散布/sqrt(N) 需系统差已完全消除的证据。

    '
  source: LSST DRP coadd 文档; DES DR1 校准; 2MASS Explanatory Supplement
  confidence: consensus
  hypothetical_queries:
  - 多历元测光加权平均怎么合并
  - 多帧图像叠加如何提高信噪比
  - 历元间零点差异如何校正
- id: survey_completeness
  title: 巡天完备性 (完备函数/注入-回收/选择函数)
  category: methodology
  tags:
  - completeness
  - selection_function
  - injection_recovery
  - limiting_magnitude
  - sample
  applies_to:
    fields:
    - apparent_magnitude
    - flux_density
    - redshift
  content: "巡天完备性 (选择函数):\n1. 注入-回收检验: 在真实图像中注入人工源 -> 统计回收率 vs 星等/流量,\n   得完备函数 c(m) (常报 50%/80%/90% 完备星等为指标)\n2. 形态依赖: 点源与延展源完备性不同; 延展源由表面亮度而非总流量决定\n   (低面亮度星系最易丢失)\n3. 几何依赖: 探测器边缘/离轴响应/掩星区 -> 完备性与天区位置有关\n\
    4. 运动学完备: 自行/速度受限样本 (如白矮星、高速星) 需在速度空间做完备改正\n5. 统计使用: 光度函数/质量函数/事件率必须除以 c(m) 或按 1/c(m) 加权;\n   90% 完备点通常比 50% 点亮 0.5-1 mag, 报道极限星等须注明完备度水平\n\n物理原理: 探测是阈值过程, 阈值附近噪声散射使回收率平滑下降 (erf 形)。\n\n判定线索: 样本完备在极限附近陡降是正常形态;\n\
    统计量在 50% 完备点附近急剧变化 = 未做完备性改正。\n"
  source: Hopkins et al. 2003 (Phoenix Deep Survey); 注入-回收完备性范式综述
  confidence: consensus
  hypothetical_queries:
  - 巡天完备性函数如何测量
  - 注入回收实验 50% 完备星等是多少
  - 样本选择函数对统计结果的影响
