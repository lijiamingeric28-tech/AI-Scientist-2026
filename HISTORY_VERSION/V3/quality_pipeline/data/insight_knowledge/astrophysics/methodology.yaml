    - SpT 与 Teff 矛盾 (标 M 型却给 20000 K) = 字段错位或解析错误

    - 光度级对应 log g (dex): V ~ 4.0-4.5, III ~ 2.5-3.0, I ~ 0-1; 与 log g 不符需复核

    - 同一源跨目录 SpT 差 1-2 子型属正常 (目视分类主观性); 差 > 3 子型或跨光度级 = 数据冲突

    - 低金属丰度使金属线变弱, 易误判为更热型; 双星 (SB2) 线型模糊

