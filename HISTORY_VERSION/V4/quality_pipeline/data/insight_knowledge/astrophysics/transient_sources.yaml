  content: '磁星巨耀斑: 超强磁场中子星 (表面偶极场 1e14-1e15 G, SGR/AXP 类) 罕见的极端爆发:


    - 能量: 巨耀斑各向同性能量 1e44-1e46 erg, 比常规短暴大 3-4 个量级; 2004 年银河系外事件为迄今最强 (接近上限), 银河系内事件更弱


    - 光变: 初始尖锐硬脉冲 (0.1-1 s, 内含毫秒结构) + 随旋转周期调制的振荡尾 (指数衰减, 持续 100-1000 s); 尾部为被磁束缚火球 (tau ~ 1e4-1e5 s 冷却, 光度近爱丁顿) 的泄漏辐射


    - 触发机制: 全球性磁层重排/地壳破裂释放磁能; 诱发模 (coupled crust-core modes) 使尾部出现准周期振荡 (数十-数百 Hz, 与星体整体振荡模相关)


    - 常规活动: 同一类源持续发射短暴 (能量 1e38-1e43 erg, 毫秒-秒级, 峰值光度 1e38-1e41 erg/s), 频率数天-数月; 巨耀斑复发时标 1e3-1e4 年 (每源/每星系), 历史记录极少


    - 静止期: 软 X 射线热辐射 (kT 0.3-0.7 keV) + 幂律非热成分, 光度 1e33-1e36 erg/s; 长期自转减慢 ~ 1e-11 s/s 量级 (磁场制动)


    物理: 磁能密度 B^2/8pi 远超引力束缚能; 巨耀斑释放的磁场自由能 (~1e44-1e46 erg) 与 1e15 G 量级磁场储能自洽


    判定线索: 峰值能量 >1e46 erg 的 ''磁星巨耀斑'' 需复核 (超越已知上限, 疑为短暴混淆); 无旋转周期调制的尾部或能量在短暴量级的 ''巨耀斑'' 分类存疑; 银道面外的短暴若谱与时标特征相似需做磁星巨耀斑鉴别'
  source: Hurley et al. 2005, Nature 434, 1098; Mereghetti 2008, A&ARv 15, 225; Kaspi & Beloborodov 2017, ARAA 55, 261
  confidence: established
  hypothetical_queries:
  - 磁星巨耀斑的峰值能量范围是多少
  - 巨耀斑的初始尖峰与振荡尾的持续时间是多少
  - 如何区分磁星巨耀斑与短暴伽马射线暴
