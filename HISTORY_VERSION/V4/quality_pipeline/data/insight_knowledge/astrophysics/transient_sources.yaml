      unit: erg/s
  content: 'GRB 余辉: 相对论喷流与星际介质作用的前向激波同步辐射 (F_nu ~ t^(-alpha) nu^(-beta)):


    - 典型 X 射线衰减指数 alpha ~ 1.2 (Swift 大样本主流值 1.0-1.5), 光学 alpha ~ 0.8-1.2, 谱指数 beta ~ 0.6-1.0 (同步辐射冷却段)


    - 标准光变四段: 极陡早期衰减 (t^-3, 高纬发射, 持续数百秒) -> 浅衰减平台 (alpha ~ 0.5, 能量注入或结构喷流) -> 正常衰减 (alpha ~ 1.1-1.4, 持续至数天) -> 晚期射电/X 射线 (数天-数年)


    - X 射线平台持续 1e3-1e5 s, 平台期与末段之间常伴随再耀发 (alpha 阶跃); 平台亮度与喷流能量和介质密度相关


    - 射电余辉: 早期自吸收抑制, 通量先升 (F ~ t^(1/2)) 数天-数周达峰 (典型 1-30 天, 低频更晚), 之后按 alpha ~ 1.2 衰减; 射电峰值时间反推介质密度与喷流开角


    - 早期 X 射线光度 1e44-1e49 erg/s (秒-小时标度), 与爆发能量 E_iso 相关性弱


    物理: 同步辐射冷却与绝热衰减共同决定幂律指数; 衰减与谱指数满足闭包关系 (ISM 介质: alpha = (3 beta + 1)/2 无冷却段), 偏离闭包关系提示能量注入或介质结构


    判定线索: 无平台/无陡早期段的 ''余辉'' 需复核; X 射线衰减 alpha > 2 持续数天的 ''余辉'' 多为 AGN 或银河系源混淆; 射电峰值早于 1 天需检查自吸收或同步自康普顿贡献'
  source: Sari, Piran & Narayan 1998, ApJL 497, L17; Zhang et al. 2006, ApJ 642, 354; Granot & Sari 2002, ApJ 568, 820
  confidence: consensus
  hypothetical_queries:
  - GRB 余辉 X 射线光变的典型衰减指数是多少
