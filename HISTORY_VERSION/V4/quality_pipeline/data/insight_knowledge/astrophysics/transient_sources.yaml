  content: '多信使对应体: 不同信使 (引力波/中微子/电磁) 指向同一物理事件:

    - 双中子星并合: 引力波 (SNR ~8-32) + 短暴 GRB (时延 ~1-2 s) + 千新星 (光学/近红外, 数小时-数天) + 余辉 (X 射线/射电, 数天-数年)

    - 定位精度阶梯: 引力波 10-数千 deg^2 (三探测器 10-数百, 双探测器数百-数千) -> 伽马暴仪器定位 ~1-15 deg (大面积监视器) 或 ~arcmin (成像望远镜) -> 余辉/宿主星系亚角秒

    - 中微子定位: 径迹事件 ~0.1-1 deg, 级联事件 ~10 deg; 高能中微子与耀变体耀发成协显著性 ~3 sigma 级, 需结合时间窗与背景统计

    - 时间符合: 引力波-短暴时延秒级 (光速同源); 电磁后随需覆盖 ~90% 定位区 (数十-数百平方度巡天)

    - 警报链路: 引力波低延迟管道秒-分钟级发布 skymap; 伽马暴监视器秒级即时警报; 中微子实时警报小时级

    物理: 信使速度一致 (光速) -> 时间延迟约束源区尺度; 不同信使穿透与产生环境互补

    判定线索: 声称 GW 对应体但定位完全不重叠或时延超分钟级 (对 BNS) 需复核; 无电磁证认的单一信使发现不算多信使事件'
  source: Abbott et al. 2017, ApJL 848, L12; Metzger 2019, Living Rev. Rel. 22, 3; IceCube Collab. 2018, Science 361, eaat1378
