  content: 'AGN 变光: 吸积盘+冕区固有随机涨落, 时标小时-年:

    - 阻尼随机游走 (DRW) 模型: PSD 为 1/f^2 高频幂律 + 低频白噪声, 转折频率对应阻尼时标 tau (自相关 ~ exp(-dt/tau))

    - 光学 tau: 10-1000 天 (Kepler 样本 10-135 天; Stripe 82 大样本 ~1 年; 20 年基线中位 ~750 天); tau ~ M_BH^0.5-1 质量标度

    - 结构函数 SF ~ tau^beta, beta ~ 0.5; 渐近振幅 SF_inf ~ 0.1-0.4 mag, 与光度/爱丁顿比反相关

    - X 射线涨落远大于光学: 分数 rms 可达 100-200% (光学仅 ~10%); 满足 rms-流量线性关系与流量对数正态分布

    - 快速时标: 耀变体日-小时级伽马/光学耀发; 最短变时标受发射区光穿越时间限制

    物理: 粘滞涨落自外向内传播并被放大 (Lyubarskii 机制)

    判定线索: 光学变幅 >1 mag 的 ''AGN'' 需怀疑引力透镜或恒星混淆; 变光时标 <1 小时且偏离 DRW = 潮汐瓦解或恒星耀斑混淆'
  source: Kelly, Bechtold & Siemiginowska 2009, ApJ; Kasliwal et al. 2015, MNRAS 451, 4328; Kozlowski 2016; Stone et al. 2022, MNRAS
  confidence: consensus
  hypothetical_queries:
  - AGN 光学变光的典型时标是多少
