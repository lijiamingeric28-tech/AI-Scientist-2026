    coronal_heating_flux:
      lo: 1000000.0
      hi: 10000000.0
      unit: erg/cm^2/s
  content: 'X 射线耀斑物理: 日冕磁环内存储的自由磁能在电流片处磁重联释放 (CSHKP 标准耀斑模型):


    - 重联产生向外/向下的高速出流与快激波, 加速非热电子 (硬 X 射线轫致辐射) 并加热等离子体; 热等离子体通过色球蒸发填充磁环, 辐射热软 X 射线


    - GOES 软 X 射线 (1-8 A) 分级: A/B/C/M/X 类, X 类峰值通量 1e-4-1e-3 W/m^2, 相邻级差 10 倍; M 级以下为常见小耀斑


    - Neupert 效应: 硬 X 射线 (非热) 的时间积分与软 X 射线上升相相关 — 非热电子加热主导软 X 射线上升 (色球蒸发延迟数十秒-分钟)


    - 耀斑等离子体: 温度 10-40 MK (热软 X 射线谱拟合 kT 1-3 keV), 发射量度 1e48-1e51 cm^-3; 上升相 1-10 分钟 (长时耀斑可达小时), 衰减由传导冷却转辐射冷却主导


    - 日冕加热 (非耀斑背景): 纳米耀斑 (微重联叠加) 与波加热 (Alfven 波耗散) 两种主流机制; 活动区加热通量 ~1e6-1e7 erg/cm^2/s, 磁环定标律 T ~ (p L)^(1/3)


    物理: 重联率决定能量释放率; 电流片厚度与磁场梯度控制加速效率; 加热-辐射平衡由辐射损失函数与传导通量决定


    判定线索: 软 X 射线通量超 1e-3 W/m^2 的 ''X 级耀斑'' 需复核 (超出历史分级上限); 无 Neupert 关系的耀斑可能为微波主导或加热机制不同; GOES 级与光变形态应一致, 类 X 级却无硬 X 射线需检查仪器能段'
  source: Kopp & Pneuman 1976, Sol. Phys. 50, 85; Neupert 1968, ApJL 153, L59; Benz 2017, Living Rev. Sol. Phys. 14, 2
  confidence: established
  hypothetical_queries:
  - X 射线耀斑的磁重联机制是怎样的
