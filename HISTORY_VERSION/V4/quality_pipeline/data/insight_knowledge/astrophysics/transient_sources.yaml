  content: '恒星耀斑: 磁场重联释放磁能加热冕区的爆发:

    - 能量全域 1e30-1e38 erg: 太阳耀斑 1e24-1e32 erg; M 矮星与年轻恒星耀斑 1e30-1e36; 太阳型恒星超耀斑可达 ~1e36 erg

    - 频率-能量幂律: dN/dE ~ E^(-alpha), alpha ~ 1.5-1.8 (太阳型超耀斑 1e33-1e36 erg 段 alpha ~ 1.5; 太阳-恒星联合样本 ~1.8)

    - 峰值等离子体温度 10-40 MK; 硬 X 射线、射电 (微波) 与光学白光耀斑同步出现

    - 持续时间 ~ 分钟-小时, 时标随能量 tau ~ E^0.39; 缓慢自转类太阳恒星 (P_rot ~ 25 天) 产生 ~1e34 erg 超耀斑频率约每 2000-3000 年一次

    - 辐射机制: 冕环等离子体加热 (10-40 MK 黑体/轫致辐射) + 非热电子回旋同步辐射 (射电微波暴); 峰值 X 射线光度可达 1e27-1e33 erg/s

    物理: 磁重联释放磁环中存储的自由磁能; 耀斑率与自转/发电机活动 (Rossby 数) 相关

    判定线索: 能量 >1e38 erg 的 ''耀斑'' 需复核 (多为误分类); 空间天气: 太阳 X 级耀斑 ~1e32 erg 可致地球电离层扰动'
  source: Gershberg 1972, Ap&SS; Maehara et al. 2015, Nature; Notsu et al. 2016, ApJ
  confidence: established
  hypothetical_queries:
  - 恒星耀斑的能量范围与频率分布幂律指数是多少
  - 太阳型恒星超耀斑的能量可达多少
