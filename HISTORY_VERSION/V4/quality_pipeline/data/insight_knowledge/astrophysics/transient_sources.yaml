  content: '引力波后随观测: 从低延迟警报 (分钟级) 到多波段证认的完整策略:


    - 警报与定位: 探测器网络发布 90% 概率 skymap (10-数千 deg^2), 公共警报滞后分钟级; 三探测器可压缩至 10-数百 deg^2, 双探测器数百-数千 deg^2


    - 巡天策略: 按概率密度排序分块 tiling, 优先覆盖高概率像素; 对双中子星并合, 光学深度需求 20-24 mag (40 Mpc 千新星峰值 ~17 mag, 200 Mpc ~ 20 mag, 覆盖视界内 90% 事件); 星系目录加权 (光度距离先验) 显著提升证认效率


    - 时间线: 千新星峰值在并合后约 1 天 (蓝成分 ~12 h 内), 可探测窗口 6-48 h; 射电余辉数天-数年, X 射线数小时-数天; 快速响应 (<12-24 h) 对光学证认关键


    - 候选证认: 亮度/颜色 (千新星偏红, 温度 5000-10000 K)、位置相对宿主星系偏移 (0.1-10 kpc 量级)、与已知天体 (AGN/恒星活动) 排除、光谱特征; 覆盖率 (探测到候选的概率) 典型 50-90%


    - 网络协同: 广角监视器 (伽马/X 射线) 秒-分钟级、窄视场望远镜小时级、光谱仪天级; 分层覆盖提高发现率


    物理: 千新星亮度由 r 过程加热率与喷射质量决定; 宿主偏移反映并合前双星空间分布与踢速度


    判定线索: 声称 ''后随证认'' 但候选位于低概率像素且无星系关联需复核; 光学深度不足 20 mag 对 >100 Mpc 事件大概率漏检; 与宿主偏移 >10 kpc 且光度过亮的 ''千新星'' 需怀疑背景超新星混淆'
  source: Singer & Price 2016, PRD 93, 024013; Abbott et al. 2017, ApJL 848, L12; Coughlin et al. 2019, ApJL 885, L19
  confidence: consensus
  hypothetical_queries:
  - 引力波警报发布后电磁后随的巡天深度要求是多少
  - 千新星在并合后多久达到可观测峰值
  - 如何按概率图分块巡天并选择候选宿主星系
