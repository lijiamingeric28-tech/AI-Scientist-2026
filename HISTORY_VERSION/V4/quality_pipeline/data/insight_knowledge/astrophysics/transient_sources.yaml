  content: '孤儿余辉: 只观测到余辉而无对应瞬时伽马暴的暂现源, 预期来自偏离视线 (off-axis) 或弱内禀伽马辐射的喷流:


    - 喷流伽马辐射严格束束 (半开角 0.03-0.2 rad, 几度-十几度), 视线落在束束外时看不到暴; 但余辉随喷流减速, 视束 1/Gamma 增大 (0.1-1 rad 标度), 辐射逐渐进入视线 -> 缓升后衰减的光变


    - 光变特征: 上升时标数天-数十天 (远慢于 on-axis 余辉的秒-小时), 峰值较同能量 on-axis 事件暗, 射电最易探测 (辐射近各向同性); 无伽马暴在时间窗内成协


    - 事件率: 每个 on-axis 可测 GRB 对应数十-上千个 off-axis 事件 (比例 ~ (2/theta_j)^2), 但观测上需深巡天, 射电孤儿候选率远低于此几何上限


    - 搜寻途径: 深射电巡天 (自吸收峰后数周-数年可见) + 光学大视场暂现巡天 + 宽视场 X 射线监视; 候选需排除 AGN 变源、超新星残余与恒星活动混淆 (位置/光谱/射电谱指数判定)


    - 物理意义: 孤儿余辉样本可约束喷流开角分布与伽马辐射各向同性等价, 检验结构喷流模型


    物理: off-axis 同步辐射的 Doppler 因子 gamma ~ (1 - beta cos theta_v)^(-1) 变化, 上升段通量随视线角敏感变化; 射电自吸收与横向扩展决定晚期演化


    判定线索: 快速上升 (小时-天) 的 ''孤儿余辉'' 更可能是 on-axis 低峰暴或超新星混淆; 射电谱指数非负幂律且位置与已知天体重合需复核; 无多波段后续的候选不能定论'
  source: Rhoads 1997, ApJL 487, L1; Nakar & Piran 2003, NewA 8, 141; Granot, Panaitescu, Kumar & Woosley 2002, ApJL 570, L61
  confidence: consensus
  hypothetical_queries:
  - 孤儿余辉为什么没有对应的伽马暴
  - off-axis 喷流余辉的光变上升时标是多少
  - 如何用射电巡天搜寻孤儿余辉
