      unit: keV
  content: '超新星残余 (SNR) 标准三阶段演化 (单星爆炸, E~1e51 erg):


    - 自由膨胀阶段: 抛射物质量 >> 扫过星际介质质量, 激波速度近似恒定 (5e3-3e4 km/s), 持续约百年-千年 (扫过质量约等于抛射物质量时结束, Ia 型在 n~1 cm^-3 介质中约 200-500 年)


    - Sedov-Taylor 绝热阶段: 能量守恒自相似膨胀, R ~ t^(2/5), 激波速度 ~ t^(-3/5); 前向激波加热星际介质至 keV 温度, 后向激波反向加热抛射物; 该阶段持续约 1e4-3e4 年, 结束半径约 10-20 pc


    - 辐射 (雪犁) 阶段: 冷却效率超过膨胀损失 (激波温度降至 ~1e6 K 以下), 壳层坍缩为致密冷壳, R ~ t^(1/4) 动量守恒推进, 最终与星际介质融合 (约 1e5-1e6 年)


    观测特征: 热 X 射线 (激波加热等离子体, kT 0.1-3 keV) + 非热射电同步辐射 (前向激波 Fermi 加速的相对论电子) + 光学辐射激波; 含年轻脉冲星时形成脉冲星风云 (同步辐射频谱, 射电-X 射线-伽马)


    物理: 阶段判据由扫过质量与抛射物质量之比、辐射冷却时标决定; Sedov 半径 R ~ (E/rho)^(1/5) t^(2/5); 激波温度 kT ~ 3/16 m_p v^2 (v~1000 km/s 时约 2 keV)


    判定线索: 声称 ''处于自由膨胀阶段'' 但年龄 >1e4 年需复核; X 射线温度 >10 keV 的 ''SNR'' 多为河外源或仪器混淆; 半径 >20 pc 仍标 Sedov 阶段需核对介质密度'
  source: Truelove & McKee 1999, ApJS 120, 299; Vink 2012, A&ARv 20, 49; CSEP10 超新星残余教程
  confidence: established
  hypothetical_queries:
  - 超新星残余从自由膨胀到 Sedov 阶段的转变时标是多少
  - SNR 进入辐射冷却阶段的典型年龄和半径是多少
  - 超新星残余的激波温度与激波速度有什么关系
