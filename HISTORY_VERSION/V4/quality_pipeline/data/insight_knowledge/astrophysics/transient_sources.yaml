entries:
- id: supernova_classification
  title: 超新星分类判据与光谱特征
  category: reference_range
  tags:
  - supernova
  - classification
  - spectral
  - Si_II
  - H_alpha
  - light_curve
  applies_to:
    fields:
    - spectral_type
    - sn_type
    - light_curve_shape
    entities:
    - supernova
  ranges:
    ejecta_velocity:
      lo: 10000.0
      hi: 30000.0
      unit: km/s
    si_ii_doublet_wavelength:
      lo: 6347
      hi: 6371
      unit: Angstrom
    iip_plateau_duration:
      lo: 40
      hi: 80
      unit: day
  content: '超新星分类第一判据是光谱是否含氢:

    - 含 H Balmer 线 (H-alpha): II 型; 无氢线: I 型

    - Ia: 无 H 但强 Si II 6347/6371 双线 (记 6355 A, 最大光时蓝移至 ~6150 A); 白矮星近 Chandrasekhar 极限热核爆炸

    - Ib: 无 H 无 Si II, 但 He I 5876 A 显著; 包层失氢留氦 (Wolf-Rayet 类前身)

    - Ic: H/He 均弱或缺失; 包层全剥离, 与长暴 GRB 成协

    - II-P: 光变平台 (约 40-80 天); II-L: 峰值后线性衰减; IIn: 窄发射线 (激波与星周物质相互作用); IIb: 早期显 H 后期转 He

    谱线均宽 (速度 >=1e4 km/s) 且呈 P Cygni 轮廓

    物理: 光谱差异反映前身星包层剥离程度 (II 全保留 / Ib 失 H / Ic 失 H+He), 光变形状反映包层质量与 56Ni 产量

    判定线索: Ia 缺 Si II 吸收 = 类型矛盾; 谱线半宽 <2e3 km/s 的 ''超新星'' 多为 IIn 窄线或银河系恒星光球混淆'
  source: Filippenko 1997, ARA&A; CSEP10 超新星分类教程
  confidence: established
  hypothetical_queries:
  - 如何根据光谱特征区分 Ia 型、Ib 型和 Ic 型超新星
  - 超新星 II-P 与 II-L 的光变曲线判据是什么
  - 哪些超新星类型与长暴伽马射线暴成协
- id: gamma_ray_burst_taxonomy
  title: 伽马暴长短分类与光谱硬度判据
  category: reference_range
  tags:
  - GRB
  - T90
  - short
  - long
  - hardness_ratio
  - taxonomy
  applies_to:
    fields:
    - t90
    - hardness_ratio
    - peak_energy
    entities:
    - gamma_ray_burst
    - GRB
  ranges:
    t90_short:
      lo: 0.01
      hi: 2
      unit: s
    t90_long:
      lo: 2
      hi: 1000
      unit: s
    short_t90_mode:
      lo: 0.2
      hi: 0.5
      unit: s
    long_t90_mode:
      lo: 20
      hi: 50
      unit: s
  content: 'GRB 经典双型分类 (Kouveliotou 判据, BATSE 双峰分布):

    - T90 定义: 累积 5%-95% fluence 的观测持续时间

    - 短暴: T90 0.01-2 s (分布峰 ~0.3 s), 光谱偏硬 (硬度比高); 起源: 致密双星并合 (NS-NS/NS-BH)

    - 长暴: T90 2-1000 s (分布峰 ~30 s), 光谱偏软; 起源: 大质量恒星坍缩 (常伴超新星)

    - 硬度比 HR = 高能带计数/低能带计数, ''短硬-长软'' 为第二判据 (两类内部 HR 与 T90 无相关)

    - 光谱常为 Band 函数 (低能指数+高能指数双幂律拼接), 峰值能量 E_peak 数十-数百 keV

    注意事项: 长短分布有重叠且随仪器能段变化 (Swift 与 BATSE 定界不同); 短暴可含扩展发射 (~100 s 尾); 高红移长暴固有时标可 <2 s

    物理: 时标由中心引擎活动时间决定, 硬度差异源于喷流内耗与光子化效率

    判定线索: 短暴却 HR 极低需复核; 短暴伴引力波 = 并合起源直接证据; 银道面附近的 ''短暴'' 需排除磁星巨耀发'
  source: Kouveliotou et al. 1993, ApJ 413, L101; Qin et al. 2000; 长短硬度-时长统计检验 (ChinaXiv 2022)
  confidence: consensus
  hypothetical_queries:
  - 短暴和长暴的 T90 分界与光谱硬度差异是什么
  - 如何判断一个伽马暴属于短暴还是长暴
  - 短暴的物理起源是并合还是恒星坍缩
- id: kilonova_properties
  title: 千新星观测性质 (r 过程供能暂现源)
  category: reference_range
  tags:
  - kilonova
  - r_process
  - neutron_star_merger
  - lanthanide
  - transient
  applies_to:
    fields:
    - bolometric_luminosity
    - color
    - timescale
    entities:
    - kilonova
  ranges:
    peak_luminosity:
      lo: 1.0e+40
      hi: 1.0e+42
      unit: erg/s
    peak_time:
      lo: 1
      hi: 5
      unit: day
    ejecta_velocity:
      lo: 0.1
      hi: 0.3
      unit: c
    ejecta_mass:
      lo: 0.001
      hi: 0.1
      unit: Msun
  content: '千新星: 双中子星 (或 NS-BH) 并合喷射的 r 过程物质放射性衰变供能暂现源:

    - 峰值热光度 1e40-1e42 erg/s (典型 ~1e42, 约为超新星的 1/10, 新星的 100 倍)

    - r 过程加热率 e_dot ~ 9e14 (t/1 day)^(-0.3) erg/g/s; 峰值在并合后约 1-5 天, 总持续数周

    - 颜色演化蓝->红 (数天内): 低不透明度 Fe 族 (kappa~0.5 cm^2/g) 到高不透明度镧系 (kappa~10 cm^2/g) 成分先后主导

    - 喷射质量 ~1e-2 Msun, 速度 0.1-0.3 c

    - 光度供能: r 过程核 (锕系/镧系) 放射性衰变加热, 加热率随 t^(-1.3) 缓降, 支撑数周光变

    物理: r 过程在喷出物中合成重元素 (含镧系), 镧系高不透明度延迟光子逃逸并红化 SED; 快慢双成分 (蓝/红) 反映喷射角度与成分差异

    判定线索: 与短暴 GRB/引力波事件成协 (时延秒-天); 快速衰减 (数周) + 近红外红化 = 千新星判据; 峰值 >1e43 erg/s 需怀疑超新星混淆'
  source: Cowperthwaite et al. 2017, ApJL; Metzger 2019, Living Rev. Rel. 22, 3
  confidence: established
  hypothetical_queries:
  - 千新星的峰值光度和峰值时间大约是多少
  - 千新星为什么颜色会从蓝变红
  - 如何从光变曲线上识别千新星
- id: tidal_disruption_event
  title: 潮汐瓦解事件判据与吸积率
  category: reference_range
  tags:
  - TDE
  - tidal_disruption
  - supermassive_black_hole
  - fallback
  - accretion
  applies_to:
    fields:
    - fallback_rate
    - accretion_rate
    - blackbody_temperature
    entities:
    - tidal_disruption_event
    - TDE
  ranges:
    tidal_radius_factor:
      lo: 10
      hi: 100
      unit: R_schw
    fallback_timescale:
      lo: 30
      hi: 3650
      unit: day
    peak_mdot_edd:
      lo: 0.1
      hi: 100
      unit: Eddington
    hills_mass:
      lo: 10000000.0
      hi: 1000000000.0
      unit: Msun
  content: 'TDE: 恒星被超大质量黑洞潮汐撕裂后碎片回吸产生的瞬变辐射:

    - 潮汐半径判据: R_t = R_star (M_BH/M_star)^(1/3); 恒星须在视界外被撕裂, 要求 M_BH < Hills 极限 (~1e8 Msun)

    - R_t 典型为数十个 Schwarzschild 半径 (10-100 R_schw)

    - 回吸率 Mdot ~ t^(-5/3) (碎片轨道周期分布 + 质量平坦近似); 峰值 Mdot 可超爱丁顿 (10-100 Mdot_Edd), 1e6 Msun 黑洞 Mdot_Edd ~ 5e-2 Msun/yr

    - 光变: 上升数天-数十天, 衰减 t^(-5/3) 持续数月-数年; 黑体温度 ~2-5e4 K 衰减期近乎恒定 (区分超新星冷却)

    - 峰值光度 1e43-1e45 erg/s (近爱丁顿); 事件率 ~1e-5 至 1e-4 每星系每年, 依赖核区恒星密度

    - 中心集中型恒星衰减更平缓, 可反推被撕裂恒星性质

    物理: 潮汐能差使碎片轨道周期连续分布 -> 回吸随时间 t^(-5/3) 减少; 完全撕裂 vs 部分撕裂决定衰减形状与晚期演化

    判定线索: 衰减显著快于 t^(-5/3) 且 <1 月熄灭需复核; 中心黑洞 >1e8 Msun 星系的 TDE 极罕见; 温度持续下降则更像超新星'
  source: Rees 1988, Nature; Stone, Sari & Loeb 2013, MNRAS 435, 1809
  confidence: established
  hypothetical_queries:
  - 恒星在什么条件下会被黑洞潮汐撕裂
  - TDE 光变为什么按 t 的 -5/3 幂律衰减
  - 潮汐瓦解事件的峰值吸积率是否超爱丁顿
- id: fast_radio_burst_population
  title: FRB 群体性质 (重复/非重复与事件率)
  category: reference_range
  tags:
  - FRB
  - repeater
  - event_rate
  - fluence
  - population
  applies_to:
    fields:
    - dispersion_measure
    - fluence
    - burst_width
    entities:
    - FRB
  ranges:
    sky_rate:
      lo: 500
      hi: 900
      unit: sky^-1 day^-1
    repeater_fraction:
      lo: 0.02
      hi: 0.1
      unit: ''
    energy_index_gamma:
      lo: 1.0
      hi: 2.0
      unit: ''
    fluence_power_index:
      lo: -1.6
      hi: -1.2
      unit: ''
  content: 'FRB 群体统计 (CHIME/FRB 首个大样本, 400-800 MHz):

    - 天空事件率: ~500-900 每天空每天 (fluence >5 Jy ms 阈值; 不同定标版本 525-820)

    - 重复源比例: 首目录 536 源含 18 个重复源 (~3-10%), 但模拟不能排除 ''所有 FRB 均重复'' 的单一群体

    - 重复暴与非重复暴的 DM 分布一致, 但重复暴更宽 (时宽更长、带宽更窄)

    - 累积 fluence 分布幂律 alpha ~ -1.4 (接近欧氏空间 -3/2); 能量分布 N(>E) ~ E^(-gamma), 1 < gamma < 2

    - 已定位宿主: 多为低质量恒星形成矮星系 (少数早型星系), 指向磁星/中子星起源

    物理: 视样本为能量分布亮端 + 体积效应; 重复性探测受仪器灵敏度与观测时长限制

    判定线索: DM >2000 需核查宿主贡献或银河系扣除错误; 未见二次暴不能判定为非重复源 (采样不足)'
  source: CHIME/FRB Collaboration 2021, ApJS 257, 59; Caleb et al. 2019, MNRAS; Ma et al. 2025, ApJ 981, 24
  confidence: consensus
  hypothetical_queries:
  - FRB 重复源和非重复源的比例是多少
  - FRB 的全天空事件率有多大
  - 重复暴与非重复暴在观测性质上有什么差异
- id: neutrino_astronomy_sources
  title: 中微子天文源与通量参考
  category: reference_range
  tags:
  - neutrino
  - solar
  - supernova
  - IceCube
  - diffuse_flux
  applies_to:
    fields:
    - neutrino_flux
    - neutrino_energy
    entities:
    - neutrino_source
  ranges:
    solar_pp_flux:
      lo: 55000000000.0
      hi: 65000000000.0
      unit: cm^-2 s^-1
    sn_nu_energy:
      lo: 10
      hi: 20
      unit: MeV
    sn_nu_total:
      lo: 5.0e+57
      hi: 2.0e+58
      unit: count
    diffuse_e2phi:
      lo: 5.0e-09
      hi: 2.0e-08
      unit: GeV cm^-2 s^-1 sr^-1
  content: '中微子天文三类已探测源:

    - 太阳: pp 链主导, 通量 ~6e10 cm^-2 s^-1 (E < 0.5 MeV); 8B 中微子 ~5e6 cm^-2 s^-1 (~MeV) — 检验标准太阳模型

    - 超新星中微子暴 (SN 1987A 类事件): 银河系内超新星释放 ~1e58 个中微子, 总能量 ~3e53 erg (引力束缚能, 占爆炸能量 99%); 单事件能量 10-20 MeV, 脉冲持续 ~10 s; 50 kpc 处水切伦科夫探测器仅见 ~20 个事件

    - 高能河外弥漫流 (IceCube): TeV-PeV 能段, 谱 E^(-2.5), 每味通量 E^2 Phi ~ 1e-8 GeV cm^-2 s^-1 sr^-1 (100 TeV), 逼近 Waxman-Bahcall 上限; 到达味比 1:1:1; 候选源类: 耀变体/活动星系核/星暴星系 (宇宙线加速器)

    - 超新星中微子与 GW 并合源同为银河系内事件类, 探测要求 >1e53 erg 总能量且距离 <100 kpc

    - 太阳中微子另含 CNO 循环与地热中微子成分 (keV-MeV), 可用于约束太阳内部金属丰度

    物理: 反贝塔衰变 nu_e_bar + p -> n + e+ (阈值 1.8 MeV) 为 MeV 段主探测道; 高能中微子产生于质子-光子/质子-质子反应

    判定线索: 声称银河系超新星中微子暴但能量 >100 MeV 或事件数 >100 = 不符; 弥漫通量超 Waxman-Bahcall 上限一个量级需质疑'
  source: Hirata et al. 1987, PRL 58, 1490; Bionta et al. 1987, PRL 58, 1494; IceCube Collab. 2015, ApJ 809, 98
  confidence: established
  hypothetical_queries:
  - 太阳中微子的通量大约是多少
  - 超新星中微子暴能探测到多少个事件
  - IceCube 探测到的河外高能中微子通量是多少
- id: gravitational_wave_events
  title: 引力波事件探测参数
  category: reference_range
  tags:
  - gravitational_wave
  - LIGO
  - Virgo
  - SNR
  - chirp_mass
  - localization
  applies_to:
    fields:
    - snr
    - luminosity_distance
    - chirp_mass
    entities:
    - gravitational_wave_event
  ranges:
    detection_snr:
      lo: 8
      hi: 35
      unit: ''
    luminosity_distance:
      lo: 40
      hi: 5000
      unit: Mpc
    sky_localization:
      lo: 10
      hi: 5000
      unit: deg^2
    bns_chirp_mass:
      lo: 1.1
      hi: 1.25
      unit: Msun
  content: '地面探测器 (LIGO/Virgo/KAGRA) 引力波事件探测参数:

    - 信噪比: 探测阈值 SNR=8 (双中子星视界定义), 已测事件 SNR ~8-35 (双中子星并合首例综合 SNR ~32)

    - 光度距离: 40 Mpc (近邻双中子星) 至 ~5 Gpc (高红移双黑洞)

    - 天区定位: 三探测器网络 90% 区域 10-数百 deg^2; 双探测器数百-数千 deg^2

    - 啁啾质量 M_c = (m1 m2)^(3/5) / (m1+m2)^(1/5): 双中子星 ~1.19 Msun; 双黑洞 5-35 Msun; 决定频率演化率 df/dt

    - 波形三阶段: 旋进-并合-铃宕; 带内持续: 双中子星 ~数十秒-分钟, 大质量双黑洞亚秒-秒

    物理: 应变振幅 h ~ 1e-21; 引力波频率约为轨道频率 2 倍; 距离精度 ~10-30% 受天线响应与定位限制

    判定线索: SNR < 8 的 ''探测'' 多为噪声误报; 并合总质量 >300 Msun 需怀疑非恒星起源或测量错误'
  source: Abbott et al. 2017, PRL 119, 161101; LIGO/Virgo/KAGRA GWTC-3; IGWN Public Alerts 指南
  confidence: established
  hypothetical_queries:
  - 引力波事件的探测信噪比阈值是多少
  - 双中子星并合的天区定位精度是多少
  - 引力波事件的啁啾质量怎么计算
- id: nova_recurrent_nova
  title: 新星与再发新星参数
  category: reference_range
  tags:
  - nova
  - recurrent_nova
  - thermonuclear_runaway
  - white_dwarf
  - accretion
  applies_to:
    fields:
    - peak_luminosity
    - recurrence_period
    - accretion_rate
    entities:
    - nova
    - recurrent_nova
  ranges:
    peak_luminosity:
      lo: 1.0e+37
      hi: 1.0e+39
      unit: erg/s
    cn_recurrence:
      lo: 1000.0
      hi: 100000.0
      unit: yr
    rn_recurrence:
      lo: 10
      hi: 100
      unit: yr
    accretion_rate:
      lo: 1.0e-10
      hi: 1.0e-07
      unit: Msun/yr
  content: '新星: 白矮星表面吸积氢层热核失控 (TNR) 爆发:

    - 峰值光度 ~ 爱丁顿光度 (1 Msun 白矮星 ~1e38 erg/s, 早期可短暂超 10 倍); 光度跳增 ~1e5-1e6 Lsun

    - 白矮星越重, 逃逸层越薄, 爆发越亮越快 (t3 数天-数月); 喷射速度 500-3000 km/s, 抛射质量 1e-7-1e-4 Msun

    - 经典新星 (CN): 吸积率 1e-10-1e-8 Msun/yr, 复发周期 1e3-1e5 yr (人类时标不可观测)

    - 再发新星 (RN): 吸积率 ~1e-7 Msun/yr 的近 Chandrasekhar 极限大质量白矮星, 复发 10-100 yr (典型数十年)

    - 爆发后残余氢燃烧呈超软 X 射线源 (接近 L_Edd)

    物理: 简并压力使燃烧压力不敏感 -> 温度失控升高; 吸积率过高则稳态燃烧而不爆发

    判定线索: 复发 <10 yr 却标 ''经典新星'' = 分类混淆; 再发新星为 Ia 型超新星前身候选; 极慢新星 (t3 > 1 年) 需复核'
  source: Bode & Evans 2008, Classical Novae; Darnley et al. 2019, Nature 565, 460; Schaefer 2010, ApJS
  confidence: established
  hypothetical_queries:
  - 经典新星和再发新星的复发周期差异是什么
  - 新星爆发峰值光度与白矮星质量的关系
  - 再发新星为什么被认为是 Ia 型超新星前身
- id: xray_transients
  title: 'X 射线暂现源: 爆发时标与吸积态转换'
  category: reference_range
  tags:
  - xray
  - transient
  - type_I_burst
  - state_transition
  - LMXB
  applies_to:
    fields:
    - burst_duration
    - peak_luminosity
    - spectral_state
    entities:
    - xray_transient
  ranges:
    type_i_burst_duration:
      lo: 10
      hi: 100
      unit: s
    type_i_burst_luminosity:
      lo: 1.0e+36
      hi: 1.0e+38
      unit: erg/s
    state_transition_timescale:
      lo: 1
      hi: 30
      unit: day
    burst_recurrence:
      lo: 0.1
      hi: 2
      unit: day
  content: 'X 射线暂现源主要含两类:

    - I 型 (热核) X 射线暴: 中子星表面累积 H/He 热核闪燃, 持续 10-100 s, 峰值光度 1e36-1e38 erg/s (亮暴达爱丁顿限 ~2e38), 复发小时-天; 谱为黑体 1-3 keV, 上升 1-10 s 后随冷却尾软化为铁证; 仅中子星可产生 (黑洞无表面)

    - 黑洞 X 射线双星爆发: 快升慢降 (升数天, 衰减数月), 峰值 1e38-1e39 erg/s; 硬态 (幂律, 光子指数 ~1.5) <-> 软态 (热盘黑体 ~1 keV) 转换, 上升期硬->软转换光度高于衰减期软->硬 (滞后效应, q 型硬度-强度图); 粘滞时标 ~8-12 天

    - 宁静期光度 1e30-1e33 erg/s, 爆发峰/宁静比可达 1e6-1e9; 另类暂现: 磁星巨耀发 (毫秒-秒级, 峰值 1e44-1e47 erg/s, 银道面方向)

    - 新一类: 快速 X 射线暂现 (FXRT, 数秒-数分钟) 与超软暂现, 需多波段证认排除混叠

    - 爆发类型与峰值光度组合可区分致密体: 热核暴=中子星, 周期脉冲+吸收线=吸积磁化中子星, 态转换+无表面=黑洞

    物理: 吸积态由质量吸积率与内盘半径决定; L ~ G M Mdot / R; 爱丁顿限 1.3e38 (M/Msun) erg/s; 热核暴由表层燃料累积触发

    判定线索: 黑体冷却尾 = I 型暴判据; 2-10 keV 峰值 >1e39 erg/s 的 ''暂现'' 多为 ULX 或河外源混淆; 持久源出现态转换仍需吸积率变化驱动'
  source: Lewin, van Paradijs & Taam 1993, SSRv; Remillard & McClintock 2006, ARA&A; Weng et al. 2021, ApJL 915, L15
  confidence: established
  hypothetical_queries:
  - I 型 X 射线暴的持续时间与峰值光度是多少
  - 黑洞 X 射线双星硬态到软态转换的时标
  - 哪些暂现源类型只在中子星上出现
