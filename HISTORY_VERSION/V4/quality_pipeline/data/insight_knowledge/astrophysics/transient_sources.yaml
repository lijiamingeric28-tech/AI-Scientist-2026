  content: '喷流拐折 (jet break): 当喷流洛伦兹因子衰减至 Gamma ~ 1/theta_j (视束角等于喷流开角) 时光变曲线斜率增大的时标:


    - 开角典型值 2-10 度 (0.03-0.2 rad), 对应拐折时标约 0.1-30 天 (典型数小时-数天); 未观测到拐折只能给开角下限 (视束未出射)


    - 拐折后衰减指数增大 Δalpha ~ 0.5-1.0 (顶帽喷流 + 星际介质典型 ~0.75); 理想情形拐折为无色差 (光学/X 射线/射电同时变陡), 但能量注入、观测覆盖或喷流横向扩展可使之色差或模糊


    - 时标-开角定标: theta_j ~ (t_j/E/n)^(1/8) 弱依赖, 由拐折时标可反推几何开角: theta_j ~ 0.06 (t_j/1 天)^(3/8) (E_52/n_1)^(-1/8) rad


    - 拐折后能量修正: E_j = E_iso (1 - cos theta_j) ~ 1e50-1e52 erg, 消除 E_iso 跨 5 个量级的表观弥散 (准直修正); 长暴修正能量分布窄 (喷流能量近标准烛光)


    - 与 X 射线平台的区分: 平台期后 alpha 阶跃是能量注入结束而非喷流拐折; 拐折要求色差性检验与多波段同时覆盖


    物理: 视束角 1/Gamma 随时间增大 (减速), 出射视束超过开角后横向扩展与边缘发射主导, 辐射由球对称近似转入喷流几何


    判定线索: 声称拐折但无多波段同步变陡需复核; 拐折时标与平台跃变混淆是常见错误; 拐折前衰减 alpha < 0.5 的 ''拐折'' 多为能量注入末段'
  source: Sari, Piran & Halpern 1999, ApJL 519, L17; Frail et al. 2001, Nature 413, 499; Ghirlanda, Ghisellini & Lazzati 2004, ApJ 616, 331
  confidence: established
  hypothetical_queries:
  - 喷流拐折时标与喷流开角如何换算
  - jet break 前后光变衰减指数变化多少
  - 如何区分喷流拐折与 X 射线平台结束
