  content: '快速暂现源检测: 毫秒-秒级单脉冲/短暴事件的搜寻与证认:


    - 射电单脉冲搜寻: 对去色散 (DM 网格扫描, 典型 0-5000 pc/cm^3) 后时间序列做匹配滤波, 宽度模板 0.01-100 ms (巨脉冲可达 ns-mu s, FRB 典型 1-10 ms, RRAT 2-30 ms); 阈值 6-10 sigma, 再经 RFI 抑制与重复性检查


    - 目标类: FRB (河外, 重复/非重复), 脉冲星巨脉冲 (能量 1e3-1e6 倍平均脉冲), 旋转射电暂现源 RRAT (仅在爆发时可见, 推断数量可与普通脉冲星相当), 快速射电暂现 (秒级)


    - 光学快速暂现 (FOT/LFBOT): 上升 ~1 天, 峰值光度 1e42-1e44 erg/s, 蓝而快衰 (数天); 高光度快速蓝暂现源需宽视场巡天 (秒-天级巡天相机) 捕获


    - X 射线快速暂现 (FXRT): 数秒-数分钟事件, 宽视场监视器发现后需多波段证认 (排除脉冲星耀发、X 射线双星混淆)


    - 巡天策略: 大视场 + 高频次 (每小时-每天重访), 实时处理流水线秒-分钟级发布警报; 事件率与灵敏度幂律相关, 搜寻深度不足会系统性低估短时标事件率


    物理: 色散使宽频脉冲随频率延迟 (dt ~ DM/f^2), 去色散正确性由 S/N-DM 峰值验证; 单脉冲探测概率受散射与采样率限制


    判定线索: DM 与银河系模型不符且无宿主贡献的 ''河外单脉冲'' 需复核; 仅见一次而声称 ''新重复源'' 需更长监视; 爆发宽度小于采样时间的 ''探测'' 受灵敏度衰减影响, 应检查 S/N 定义'
  source: Cordes & McLaughlin 2003, ApJ 596, 1142; Keane & Petroff 2015, MNRAS 447, 2852; CHIME/FRB Collaboration 2021, ApJS 257, 59
  confidence: consensus
  hypothetical_queries:
  - 射电单脉冲搜寻的色散量扫描范围和阈值是多少
  - 快速光学暂现源与 LFBOT 的峰值光度是多少
  - 如何区分 FRB、巨脉冲和旋转射电暂现源
