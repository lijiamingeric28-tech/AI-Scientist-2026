[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "astroquery-ai"
version = "3.0.0.dev1"
description = "天文科学数据查找、解析与整合 AI 应用（赛题方向 1）"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph==1.2.17",
    "pydantic==2.14.1",
    "jsonschema==4.26.0",
    "httpx==0.28.1",
    "astropy==7.2.3",
    "PyMuPDF==1.28.2",
    "fastapi==0.162.0",
    "openai==3.49.0",
    "sse-starlette==3.7.0",
    "uvicorn==0.54.0",
    "python-dotenv==1.2.4",
    "pywebview==6.2.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2", "pip-audit==2.10.1"]
build = ["pyinstaller==6.22.3"]

# 终端命令：pip install 后可直接 `astroquery-ai "M31 的距离"`
[project.scripts]
astroquery-ai = "astroquery_ai.api.cli:main"
astroquery-desktop = "astroquery_ai.api.desktop:main"
