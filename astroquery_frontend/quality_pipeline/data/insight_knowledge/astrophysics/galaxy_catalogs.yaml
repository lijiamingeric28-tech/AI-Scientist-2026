    - galactic_latitude
    - galactic_coordinates
    - galactic_coords
    - sglon
    - sglat
    entities:
    - star
    - high_proper_motion_star
  content: 'Gaia 天体测量 5 参数解: ra, dec, parallax, pmra, pmdec (光谱另算;

    BP/RP 光度为独立口径)。

    视差-距离: d[pc] = 1000 / π[mas] (π = 1 mas → 1 kpc; π = 0.1 mas → 10 kpc)

    视差精度 (DR3):

    - 亮源 G < 13: σ(π) ~ 0.02-0.03 mas

    - 中等 G ~ 17: σ(π) ~ 0.1-0.2 mas

    - 暗源 G ~ 19-21: σ(π) ~ 0.5-1 mas

    系统误差 ~ 0.02-0.03 mas (zonal); 负视差 = 测量噪声, 不可取倒数。

    自行典型: 盘恒星 1-20 mas/yr; 近邻/高自行天体 100-8000 mas/yr。

    质量标志: RUWE < 1.4 (单星解); σ(π)/π > 0.2 的记录不得直接换算距离

    (应改用贝叶斯/光度约束, 否则距离偏差不可控)。'
  source: Gaia Collaboration 2016, 2023; Lindegren et al. 2021 (EDR3)
  confidence: established
  ranges:
    parallax:
      lo: 0.02
      hi: 800
      unit: mas
    proper_motion:
      lo: 0.1
      hi: 8000
      unit: mas/yr
    parallax_error:
      lo: 0.02
      hi: 1.0
      unit: mas
- id: photometric_redshift_precision
  title: 测光红移精度与判据
  category: reference_range
  tags:
  - photo_z
  - photometric_redshift
  - redshift
  - sed_fitting
  hypothetical_queries:
  - 测光红移 精度 sigma_z/(1+z) 宽带 深场 0.02 0.06
  - photo-z 灾难性失败 判据 0.15 光谱红移 交叉验证
  - SED 模板拟合 Lyman break Balmer break 简并 测光红移
  applies_to:
    fields:
    - redshift
    - photo_z
    - photometric_redshift
    - z_ph
    - zphot
    - z_phot
    - phot_redshift
    methods:
    - photometry
    entities:
    - galaxy
    - G
    - quasar
  content: '测光红移 (photo-z) 精度与判据:

    - 方法: 多波段颜色 (ugriz + 近红外 JHK) 与 SED 模板/机器学习拟合 → 红移

    - 精度 σ_z/(1+z): 宽带 4-5 色 ~ 0.03-0.06; 多波段深场 (含 NIR) ~ 0.02-0.05

    - 灾难性失败比例: 1-10% (混染/红移简并), 深场与密集场更高

    - 与光谱红移区别: spec-z 精度 1e-4-1e-5 (发射线直接测量); photo-z 只有

    统计意义 — 单天体不可依赖, 大样本统计可用

    - 系统偏差来源: SED 模板不完备 (缺罕见类型), Lyman break 与 Balmer break

    简并, 相邻天体孔径混染

    - 判定: |photo_z - spec_z|/(1+z) > 0.15 视为灾难性失败候选;

    photo-z 结论必须与 spec-z 交叉验证后使用。'
  source: Hildebrandt et al. 2012; Ilbert et al. 2009; Salvato et al. 2019
  confidence: established
  ranges:
    photo_z_sigma:
      lo: 0.02
      hi: 0.06
      unit: sigma_z/(1+z)
- id: galaxy_rotation_curve
  title: 旋涡星系旋转曲线与 Tully-Fisher
  category: reference_range
  tags:
  - galaxy
  - rotation_curve
  - tully_fisher
  - v_rot
  - dark_matter
  hypothetical_queries:
  - 旋涡星系 旋转曲线 平坦段速度 典型范围 km/s
  - Tully-Fisher 关系 光度 正比 V 四次方 散射
  - 倾角改正 旋转速度 V/sin i HI 21cm 谱线宽度 W20
  applies_to:
    fields:
    - rot_velocity
    - v_rot
    - v_max
    - v_circ
    - rotation_velocity
    - rotational_velocity
    - projected_rotation_velocity
    - hi_line_width
    - hi_linewidth
    entities:
    - spiral_galaxy
    - galaxy
    - G
    - low_surface_brightness_galaxy
  content: '旋涡星系旋转曲线: 内部上升段 → 平坦段 (暗物质晕主导)。

    - V_flat (平坦段旋转速度): 普通旋涡 100-300 km/s (银河系级 ~ 220)

    - 矮/不规则星系: 20-80 km/s

    - 椭圆星系/矮椭球无旋转曲线, 用速度弥散 σ_v (~150-400 km/s)

    Tully-Fisher 关系: L ∝ V_flat^4 → M = const - 10 log10 V_flat

    (B 波段散射 ~ 0.4-0.5 mag; 近红外散射 ~ 0.3 mag)

    观测注意: 视速度需倾角改正 V_rot = V_obs / sin i; face-on 盘不可测旋转;

    HI 21cm 谱线宽度 W20/W50 比光学曲线更稳健。

    判定: 旋涡星系 V_flat < 20 或 > 400 km/s 需复核; 椭圆星系标注旋转速度

    = 类型/字段混淆。'
  source: Sofue & Rubin 2001; Courteau et al. 2007; Tully & Fisher 1977
  confidence: established
  ranges:
    rot_velocity:
      lo: 20
      hi: 300
      unit: km/s
- id: stellar_metallicity_dex
  title: 恒星金属丰度 [Fe/H] 范围
  category: reference_range
  tags:
  - metallicity
  - fe_h
  - abundance
  - dex
  - stellar
  hypothetical_queries:
  - 恒星金属丰度 [Fe/H] 典型范围 晕星 盘星 dex
  - 12 + log(O/H) 氧丰度 太阳值 8.69 换算
  - 超贫金属星 [Fe/H] 极低 核球 富金属 判据
  applies_to:
    fields:
    - metallicity
    - fe_h
    - feh
    - metal_abundance
    - oxygen_abundance
    - metallicity_fe_h
    - metallicity_feh
    - stellar_metallicity
    - sp_feh
    - spec_fe_h
    - star_feh
    - cluster_feh
    - cluster_metallicity
    - gas_metallicity
    - gas_phase_metallicity
    - o_h
    - log_o_h
    - o_abundance
    - o_abund
    - abund_o_logeps
    - abund_c_logeps
    - chemical_abundance
    - individual_element_abundance
    - he_abundance
    - helium_abundance
    entities:
    - star
    - halo_star
    - disk_star
    - red_giant_star
    - galaxy
  content: '金属丰度 [Fe/H] = log10(Fe/H)_star - log10(Fe/H)_sun, 太阳 = 0 (dex 单位)。

    银河系典型范围:

    - 极贫金属晕星: -4.0 至 -2.5 (超贫金属星, 极罕见)

    - 普通晕星: -2.5 至 -0.5

    - 盘星 (薄盘/厚盘): -0.5 至 +0.3

    - 超富金属星 (核球区): +0.3 至 +0.5 (极端可达 +0.8)

    - 河外星系: 矮星系 -2.5 至 -1.0; 巨椭圆 ~ 太阳值附近

    氧丰度口径: 12 + log(O/H), 太阳 = 8.69; Z/Zsun = 10^(12+log(O/H) - 8.69)。

    判定: [Fe/H] < -4 或 > +1 需复核; 发射线星系常用氧丰度而非 [Fe/H],

    两口径不可混用 (差异可达 0.5 dex 以上)。'
  source: Beers & Christlieb 2005; McWilliam 1997; Freeman & Bland-Hawthorn 2002
  confidence: established
  ranges:
    fe_h:
      lo: -4.0
      hi: 0.5
      unit: dex
- id: quasar_luminosity_range
  title: 类星体光度与 Eddington 上限
  category: reference_range
  tags:
  - quasar
  - qso
  - luminosity
  - eddington
  - m_b
  hypothetical_queries:
  - 类星体绝对星等 M_B 范围 与 Seyfert 分界 -23
  - Eddington 光度 类星体 黑洞质量 1e9 Msun erg/s
  - 高红移类星体 光度 红移 z 6 极亮 光变
  applies_to:
    fields:
    - abs_mag
    - m_b
    - luminosity
    - bolometric_luminosity
    - redshift
    - l_bol
    - lum_bol
    - bol_mag
    - m_bol
    - bolometric_magnitude
    - log_lum
    - log_luminosity
    - source_bolometric_luminosity
    entities:
    - quasar
    - QSO
    - blazar
    - AGN
  content: '类星体 (QSO) 光度与红移范围:

    - 绝对星等 M_B: -23 至 -29 (M_B < -23 是类星体与 Seyfert 的分界)

    - 热光度 L_bol: 1e45-1e47 erg/s (~1e11-1e13 Lsun)

    - Eddington 光度: L_Edd = 1.26e38 × (M_BH/Msun) erg/s (1e9 Msun 黑洞 →

    L_Edd ~ 1e47 erg/s; 持续超 Eddington 需要非球对称吸积几何)

    - 红移分布: z ~ 0-7.6 (最高已知 z ~ 7.64); z > 6 的亮类星体极罕见

    - 光变: 典型 0.1-1 mag, 时标 天-年 — 跨历元星等口径需对齐

    判定: L_bol > 1e47 erg/s 且红移未知 → 先怀疑距离/光度单位; M_B > -23 的

    ''类星体'' 实为 Seyfert 或测光污染。'
  source: Richards et al. 2006; Shen et al. 2011; Vanden Berk et al. 2001
  confidence: established
  ranges:
    abs_mag:
      lo: -29
      hi: -23
      unit: mag
    bolometric_luminosity:
      lo: 1e45
      hi: 1e47
      unit: erg/s
    redshift:
      lo: 0.0
      hi: 7.6
      unit: dimensionless
- id: radio_flux_typical
  title: 射电 1.4 GHz 通量典型范围
  category: reference_range
  tags:
  - radio
  - flux_density
  - spectral_index
  - synchrotron
  - jy
  hypothetical_queries:
  - 射电 1.4 GHz 通量密度 典型范围 mJy Jy 巡天极限
  - 射电谱指数 同步加速 陡谱 平谱 AGN 热辐射
  - 射电 K 修正 (1+z)^(alpha-1) 跨频率 同频比较
  applies_to:
    fields:
    - flux_density
    - fnu
    - s_1_4ghz
    - s1_4
    - radio_flux
    - fnu_1400
    - spectral_index
    - radio_flux_density
    - radio_flux_density_1400
    - radio_flux_density_20cm
    - radio_flux_density_400
    - radio_flux_density_6cm
    - radio_flux_density_multi
    - radio_flux_1_4ghz
    - radio_flux_20cm
    - radio_flux_5ghz
    - radio_flux_6cm
    - radio_flux_845mhz
    - flux_radio_1p4ghz
    - flux_radio_15ghz
    - radio_peak_flux
    - radio_core_flux
    - f_radio_2cm
    - f_radio_6cm
    - radio_spectral_index
    entities:
    - galaxy
    - AGN
    - quasar
    - supernova_remnant
    - radio_galaxy
  content: '射电连续谱 (1.4 GHz) 通量密度典型范围:

    - 深巡天极限: ~1e-5 Jy (10 µJy, VLA 深场) 至 1e-4 Jy

    - 普通恒星形成星系 (z < 0.1): 0.1-30 mJy

    - 亮恒星形成/星暴星系: 30 mJy - 0.1 Jy

    - 射电星系/亮 AGN: 0.1-10 Jy

    - 最亮银道面射电源 (SNR): 可达 1e3 Jy 量级

    谱指数: S ∝ ν^(-α); 同步加速 α ~ 0.7-0.8 (陡谱), 平谱 AGN α < 0.5,

    热辐射 α ~ +0.1 (低频翻转)。

    K 修正: S_rest = S_obs × (1+z)^(α-1) (同频比较必用)。

    1 Jy = 1e-26 W m^-2 Hz^-1。

    判定: 河外源 S > 10 Jy 需复核 (多为银河系内源); 跨巡天 (如 1.4 GHz 与

    150 MHz) 比较必须做谱指数外推, 不可直接比通量。'
  source: Condon 1992, ARA&A 30; NVSS/TGSS 巡天文档
  confidence: established
  ranges:
    flux_density:
      lo: 0.001
      hi: 1000
      unit: Jy
- id: galaxy_distance_ladder
