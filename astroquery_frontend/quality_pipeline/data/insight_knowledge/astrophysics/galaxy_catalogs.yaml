  content: "星系目录测光单位与口径 (2MASS XSC 为例):\n- 星等系统: Vega (2MASS/IRAS/WISE); AB (SDSS/Gaia) — 跨目录必须转换 (见 AB-Vega 条目)\n- XSC 常用量: j_m_k20fe/h_m_k20fe/k_m_k20fe = Ks 20 mag/arcsec² 等光度椭圆孔径\n  内积分星等 (K 波段定标孔径并施于\
    \ JHK 三波段); r_k20fe 为孔径半长轴 (arcsec);\n  j_m_ext/k_m_ext 为外推总量星等 (Sérsic/修正指数轮廓外推至 ~4 倍标长)\n- '等光度' vs '总量': 等光度 (isophotal) 偏暗 (缺外晕光), 总量 (total/extrapolated)\n  更全; 大星系两者差 0.2-0.5 mag; Kron (2.5 ×\
