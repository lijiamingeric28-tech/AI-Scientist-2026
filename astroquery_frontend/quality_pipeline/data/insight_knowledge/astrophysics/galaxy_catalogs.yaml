    \ 与孔径改正后再拟合\n- 典型星系 SED: 光学峰 (~0.5-1 μm) + 中远红外尘埃峰 (星暴 60-100 μm);\n  AGN 呈幂律 fν ∝ ν^(-1) 至 (-0.5), 中红外增强\n判定: SED 相邻波段跳动 > 0.3 mag (同口径) 多为单位/系统混用或标志位污染;\n同源多目录通量差 > 3σ 需查口径与系统差异。"
