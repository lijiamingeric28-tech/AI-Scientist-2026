  content: "目录标志位语义 (缺测/上限/质量):\n- 2MASS ph_qual (JHK 每波段一字符): A = SNR>10 且 cmsig<0.109 mag; B = SNR>7,\n  cmsig<0.155; C = SNR>5, cmsig<0.217; D = 有效但弱; U = 上限 (rd_flg=0 未探测或\n  6 未一致分解); E = 拟合质量差/不收敛;\
    \ F = 误差不可靠; X = 有探测但无数值\n  (星等为 null)\n- rd_flg: 0 = 该波段未探测, 星等为 4\" 孔径 95% 置信上限; 1/2 = 正常; 3/4 = 饱和\n  或极不可靠; 8/9 = 外部源/无效\n- 上限值 ≠ 探测: 参与 SED 拟合须用截尾 (censored) 方法或下限约束, 直接当探测\n  值使用会虚高通量\n- 缺测约定各目录不同:\
    \ 2MASS 上限为数值、X 为 null; 部分目录用 99.0/999.9 填充\n- SDSS 类标志: SATUR/BRIGHT/BLENDED/EDGE/DEBLEND 异常需剔除或修正\n- WISE: w?sigmpro 大 (SNR<3) 视作上限; w?sat = 1 为饱和\n判定: 星等直方图在探测限或 99 mag 附近堆积 = 上限记录混入; 下游分析必须过滤\n\
    ph_qual=U/X 类记录或携带 is_upper_limit 标记。"
