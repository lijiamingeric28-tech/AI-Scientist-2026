  content: "FIRST (Faint Images of the Radio Sky at Twenty-cm, VLA 1.4 GHz):\n- 分辨率 5.4\" 束 (南天 6.4x5.4\" 椭圆), 探测限 ~1 mJy (5x 当地 rms, rms ~0.15 mJy/beam),\n  覆盖南北银冠 ~10,500 deg², 目录 ~95 万源\n- 位置精度: 暗点源优于\
    \ 1\" (90% 置信), 亮源更高 — 光学/红外交叉证认的首选射电位置\n- 目录列: Fpeak 峰值通量, Fint 积分通量 (CLEAN bias 改正), 去卷积源尺寸/位置角,\n  旁瓣警告标志 (sidelobe), 当地 rms\n- 与 NVSS 配合: 点源位置用 FIRST, 积分通量用 NVSS — FIRST 缺短基线会漏延展结构通量,\n  NVSS 45\"\
    \ 束会混入邻近源; 延展源两目录 Fint 差可达 ~30%\n- 物理: 5\" 分辨率可解析射电核/喷流/延展瓣, 星系-AGN 区分能力强\n判定: Fint/Fpeak 明显 > 1 为延展源, 与 NVSS 通量对比须谨慎; 旁瓣标志源应剔除;\n暗端 (< 1 mJy) 记录注意银道面混淆与消隐。"
  source: Becker et al. 1995 (ApJ 450, 559); White et al. 1997; Helfand et al. 2015 (FIRST 目录)
  confidence: established
  ranges:
    first_detection_limit:
      lo: 1.0
      hi: 1.0
      unit: mJy
    first_beam_fwhm:
      lo: 5.4
      hi: 5.4
      unit: arcsec
    first_position_error:
      lo: 0.5
      hi: 1.0
      unit: arcsec
