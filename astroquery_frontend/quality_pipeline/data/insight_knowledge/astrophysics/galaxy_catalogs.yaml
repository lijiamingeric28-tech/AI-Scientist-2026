entries:
- id: galaxy_absolute_magnitude
  title: 星系绝对星等与距离换算
  category: reference_range
  tags:
  - galaxy
  - absolute_magnitude
  - abs_mag
  - distance_modulus
  - luminosity
  hypothetical_queries:
  - 星系绝对星等 M_B 典型范围 矮星系 旋涡 巨椭圆
  - absolute magnitude distance modulus m - 5 log10 d - 25
  - K 修正 高红移星系 绝对星等 换算 消光
  applies_to:
    fields:
    - abs_mag
    - abs_magnitude
    - m_b
    - absolute_magnitude
    - abs_gmag
    - abs_mag_g
    - abs_mag_ugriz
    - abs_v_mag
    - absolute_g_mag
    - absolute_mag_j
    - absolute_mag_ks
    - absolute_v_mag
    - absolute_v_mag_system
    - absolute_v_mag_wr
    - m_abs_b
    - mag_abs
    - mag_abs_b
    - mag_abs_r
    - mag_abs_v
    - peak_abs_mag
    - peak_absolute_magnitude
    - host_abs_mag
    - r_abs_mag
    - gaia_g_abs_mag
    - m_uv_abs
    - phot_mag_abs_v
    - mid_ir_absolute_mag_w1
    entities:
    - galaxy
    - G
    - dwarf_galaxy
    - elliptical_galaxy
    - spiral_galaxy
  content: '绝对星等 M 与视星等 m 的换算: M = m - 5 log10(d[pc]/10) = m - 5 log10(d[Mpc]) - 25。

    星系绝对星等 (B 波段, 全星系积分光度) 典型范围:

    - 矮星系: M_B ~ -14 至 -18 (矮椭球更暗, 可至 -8)

    - 普通旋涡/椭圆 (银河系级): M_B ~ -19 至 -22

    - 巨椭圆星系 (cD): M_B ~ -23 至 -24

    - 最亮团星系 (BCG): 可至 ~ -25

    M_K (K 波段) 与 M_B 同量级, 但受尘埃消光影响小 (A_K ~ 0.11 A_V)。

    完整换算必须含修正项: M = m - 5 log10(d[pc]) + 5 - A - K, A 为消光,

    K 为 K-correction (高红移星系 K 修正可达 0.5-1.5 mag)。

    判定线索: 星系 M_B > -10 或 < -26 多为距离/星等口径混淆; 恒星与星系的

    绝对星等应分对象类型统计, 不可混用。'
  source: Binggeli 1987; Faber & Gallagher 1979; Blanton & Moustakas 2009
  confidence: established
  ranges:
    abs_mag:
      lo: -24
      hi: -14
      unit: mag
- id: interstellar_extinction_av
  title: 星际消光 A_V 与波段换算
  category: reference_range
  tags:
  - extinction
  - a_v
  - reddening
  - dust
  - interstellar
  hypothetical_queries:
  - 星际消光 A_V 典型范围 银盘视线 分子云
  - E(B-V) 红化 R_V = 3.1 消光律 波段换算 A_B A_J
  - 河外源 银河系消光改正 高银纬 洁净天区 A_V
  applies_to:
    fields:
    - a_v
    - av
    - extinction
    - extinction_av
    - e_bv
    - a_b_gal
    - a_ks
    - a_sin_i
    - ak
    - av_extinction
    - extinction_aj
    - extinction_ebv
    - v_extinction_av
    - galactic_extinction
    - interstellar_extinction
    - reddening
    - reddening_ebv
    - reddening_e_bv
    - reddening_e44m55
    - reddening_ejk
    - ebv
    - e_jk
    - cluster_extinction
    - cluster_reddening
    entities:
    - star
    - galaxy
    - field_star
  content: '星际消光 A_V (V 波段) 典型范围:

    - 高银纬洁净天区: A_V ~ 0-0.1 mag

    - 典型银盘视线: A_V ~ 0.5-3 mag

    - 分子云/恒星形成区: A_V ~ 5-30 mag (银心方向可达 ~30)

    - 河外源 (非银盘方向): 一般 < 1 mag

    换算 (标准消光律, R_V = A_V/E(B-V) = 3.1):

    - A_B = 1.32 A_V; A_J = 0.28 A_V; A_H = 0.18 A_V; A_Ks = 0.11 A_V

    - 红外: A_12um ~ 0.03 A_V; A_25/60/100um < 0.01 A_V (远红外消光可忽略)

    - E(B-V) = A_V / 3.1

    判定线索: 河外记录 A_V > 3 (非银盘方向) = 多为银河系内前景星混入或

    河内源误标为河外; A_V < 0 必为错误。'
  source: Cardelli, Clayton & Mathis 1989; Schlegel et al. 1998; 2MASS 文档
  confidence: established
  ranges:
    a_v:
      lo: 0
      hi: 30
      unit: mag
    e_bv:
      lo: 0
      hi: 10
      unit: mag
- id: galaxy_redshift_typical
  title: 星系红移典型范围与距离换算
  category: reference_range
  tags:
  - galaxy
  - redshift
  - cz
  - distance
  - hubble_flow
  hypothetical_queries:
  - 星系红移典型范围 近邻 中等深度 深场 z
  - cz/H0 线性近似 距离换算 4280 倍 Mpc
  - 本动速度 低红移星系 单源距离 不可靠
  applies_to:
    fields:
    - redshift
    - z
    - cz
    - photo_z
    - z_spec
    - z_phot
    - z_gal
    - phot_redshift
    - group_redshift
    - group_mean_redshift
    - cluster_redshift
    - host_galaxy_redshift
    - void_redshift
    entities:
    - galaxy
    - G
    - dwarf_galaxy
    - elliptical_galaxy
    - spiral_galaxy
  content: '星系红移典型范围 (z):

    - 本星系群/近邻成员: -0.005 至 0.05 (负 z 为蓝移, 仅见于本星系群)

    - 近邻巡天主样本 (SDSS 类): 0.02-0.3

    - 中等深度巡天: 0.3-1.5

    - 深场巡天 (CANDELS/COSMOS 类): 1.5-5

    - 极亮类星体: 至 z ~ 7.6 (见高红移类星体条目)

    小 z 线性换算 (H0 = 70 km/s/Mpc): d[Mpc] ~ cz/70 ~ 4280 × z

    (z = 0.001 → ~4.3 Mpc; z = 0.05 → ~210 Mpc)

    z > 0.1 后线性近似失效, 需宇宙学模型求光度距离 d_L (见距离阶梯条目)。

    判定: z < 0.005 的径向速度被本动速度 (±300-1000 km/s) 主导, 单源距离

    不可靠; 单一星系 z > 10 需极高置信证据 (photo-z 灾难性失败风险)。'
  source: Steed & Weinberg; SDSS 巡天文献; COSMOS 深场
  confidence: established
  ranges:
    redshift:
      lo: -0.005
      hi: 5.0
      unit: dimensionless
