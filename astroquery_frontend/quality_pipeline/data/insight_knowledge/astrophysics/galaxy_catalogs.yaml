  content: "自行与历元外推 (位置随自行线性变化):\n- α(t) = α0 + μα·Δt / cosδ; δ(t) = δ0 + μδ·Δt (μα, μδ 单位 mas/yr, Δt 为年)\n- 位移量级: 1 mas/yr × 10 yr = 10 mas; 银盘恒星典型自行 1-20 mas/yr;\n  高自行天体 100-8000 mas/yr (极端源可达 10\"/yr\
    \ 量级)\n- 历元差效应: 25 年 (Hipparcos 1991.25 → Gaia 2016) 内 20 mas/yr 源位移 0.5\",\n  200 mas/yr 源位移 5\" — 跨目录匹配必须先外推 (见 cross-match 条目)\n- 外推局限: 无加速度项; 双星轨道摆动可达 ~100 mas; 超过 50-100 年外推不可靠;\n  极高自行源须含透视加速改正\
    \ (径向速度已知时)\n- 使用方法: 外推到共同历元后匹配, 新增修正列不覆盖原始坐标;\n  Gaia 自行精度 0.02-0.2 mas/yr, 为现行最佳基线\n判定: 两历元位置差与 PM×Δt 不符 > 3σ 提示双星/混染/源变化;\n河外天体 (星系/类星体) 自行为 0 — 记录大自行多为前景恒星混入。"
