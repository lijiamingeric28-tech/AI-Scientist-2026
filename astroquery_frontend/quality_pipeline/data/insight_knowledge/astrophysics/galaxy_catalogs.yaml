    - spiral_galaxy
    - elliptical_galaxy
    - irregular_galaxy
  content: "Galaxy Zoo 系列形态目录 (志愿众包投票分数, 无硬分类):\n- GZ1 (SDSS MGS): ~90 万星系螺旋/椭圆投票分数 (p_elliptical, p_spiral, p_merger 等)\n- GZ2: ~30 万星系细分类 (11 任务/37 答案: 光滑/盘、棒、臂数、隆起、环、透镜、潮汐扰动、合并),\n  每星系数十至上百票; 输出 *_count/*_fraction/*_weighted_fraction/*_debiased\
    \ (红移校正概率)\n- GZ DESI (Zoobot 深度学习): 870 万星系预测投票分数 (z < 0.1 子样本最可靠)\n- 判据: debiased 概率 > 0.5 得二分类 (is_barred/is_spiral 等); > 0.8 为高置信子样本;\n  近邻大质量星系主要合并比例 ~1-3%\n- 与参数关系: 形态-颜色 (红序列) 交叉验证; 棒旋与恒星形成抑制/中心质量相关\n\
    判定: 投票分数 0.4-0.6 之间为模糊分类, 不宜硬划分; 高 z 图像分辨率下降使细分类\n(棒/臂) 不可靠 — 只用 z < 0.1 子样本做细形态统计。"
  source: Lintott et al. 2008 (GZ1); Willett et al. 2013 (GZ2); Darg et al. 2010 (合并); Walmsley et al. 2023 (GZ DESI)
  confidence: established
