  content: "目录 cross-match 规范 (球面角距, 单位角秒):\n- 典型巡天对 (Gaia/SDSS/2MASS/WISE 之间) 匹配半径: 1-3 角秒\n- 半径须涵盖位置误差与自行位移两项:\n  R = Hγ × sqrt(σ1² + σ2²) + PM_max × Δt (Hγ ~ 3-5 置信因子; σ 为位置误差角秒;\n  PM 为 mas/yr 上限; Δt\
    \ 为两目录历元差, 年)\n- 历元差自行位移: Δθ[arcsec] = PM[mas/yr] × Δt[yr] / 1000\n  (20 mas/yr × 25 yr = 0.5\"; 200 mas/yr × 25 yr = 5\" — 高自行源必须先外推再匹配)\n- 真/假匹配判据: 真匹配分离分布集中在 ~0.1-0.5\", 假匹配随距离均匀分布;\n  半径 r 内随机源期望数\
    \ ~ πr²n (n 为源面密度, 角秒⁻²)\n- 一配多处理: 最近邻 + 次近邻比对, 或似然比评分 (位置+星等+颜色联合)\n判定: 分离 > 2\" 的匹配需复核 (双星/邻近源/星系核); 大样本须报告匹配率与\n虚警率; 匹配后核对物理量一致性 (如星等差、颜色) 防错配。"
