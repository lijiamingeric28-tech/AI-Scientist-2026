  content: 'IRAS 颜色-颜色图 (纵轴 log(F60/F12), 横轴 log(F100/F25)) 分区判据:

    - 恒星 (光球辐射): log(F60/F12) < -0.5 (12um 主导)

    - 正常星系 (暖尘埃 T ~ 20-30 K): 0 < log(F60/F12) < 0.6 且 log(F100/F25) > 0.4

    - 星暴星系: log(F60/F12) > 0.6 (冷尘埃主导)

    - AGN/Seyfert (热尘埃 T ~ 200 K): log(F100/F25) < 0.3 (25um 相对增强)

    - 超亮红外星系 (ULIRG): log(F60/F12) > 0.8

    物理: 尘埃温度决定通量比 — 冷源 60/100um 主导, 热源 25um 增强。

    远红外光度: L_FIR ~ 1.26e39 × D[Mpc]^2 × (2.58×F60 + F100) [erg/s]。

    判定: 12um 源多为恒星; log(F60/F12) < -1 的 ''星系'' 实为恒星;

    25um 峰 + 陡红外 SED = AGN 特征。'
