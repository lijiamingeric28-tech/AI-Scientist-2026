  content: "多波段 SED 构建规范:\n- 波段覆盖: 至少 4-5 个波段 (光学 3 + 近红外 2) 才能约束红移/星族;\n  0.1-30 μm 广覆盖可区分恒星形成与 AGN (中红外幂律/尘埃峰)\n- 测光口径统一: 所有波段用同口径总量 (Kron/Petrosian/等光度) 或同尺寸孔径;\n  不同口径混用引入 0.1-0.5 mag 系统差 (星系点源口径会漏外晕光)\n\
