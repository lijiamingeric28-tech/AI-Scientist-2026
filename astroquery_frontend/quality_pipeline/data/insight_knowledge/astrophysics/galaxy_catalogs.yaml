  content: "AKARI (2006-2011 日欧红外卫星) 全天巡天, 6 波段: IRC 中红外 9/18 um + FIS 远红外 65/90/140/160 um\n- 50% 完备点源灵敏度: 9 um ~0.09 Jy, 18 um ~0.17 Jy, 65 um ~2.6 Jy, 90 um ~0.39 Jy,\n  140 um ~2.9 Jy, 160 um ~5.9 Jy\
    \ — 比 IRAS 全天巡天深 ~3-10 倍\n- 目录: IRC 点源目录 ~87 万源 (9 um 84 万 / 18 um 19 万); FIS 亮源目录 ~43 万源\n- 分辨率: IRC PSF ~5.6\"; FIS 37-61\" (65/90/140/160 um 依次变粗)\n- 物理: 9/18 um 热尘埃/PAH (与 IRAS 12/25 um 波长不同, 须谱指数外推再比);\n\
    \  65/90 um 冷尘埃与恒星形成示踪, 140/160 um 极端冷尘埃 (与 IRAS 60/100 互补)\n- 与 WISE (3.4-22 um) 波长衔接互补, 构成中远红外完整 SED\n判定: 远红外 SED 峰位置定尘埃温度 (峰 60-100 um 冷尘/25 um 热尘); 跨巡天\n(IRAS/WISE/AKARI) 通量比较必须同波长同孔径并做 K 修正。"
  source: Murakami et al. 2007 (PASJ 59, S369); Ishihara et al. 2010 (IRC PSC); Yamamura et al. 2010 (FIS BSC)
  confidence: established
  ranges:
    akari_midir_limit:
