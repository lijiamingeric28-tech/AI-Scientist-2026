  ranges:
    mass:
      lo: 13
      hi: 75
      unit: Mjup
    surface_temperature:
      lo: 200
      hi: 2000
      unit: K
  content: '褐矮星: 质量 13-75 Mjup (0.013-0.075 Msun) 的亚恒星天体, 核心点燃氘但无法稳定氢燃烧

    表面温度全域 ~200-2000 K (接 M 矮星端 ~2300-2500 K 与行星端 <200 K)

    光谱型温度标定: L 型 1300-2500 K (Fe/硅酸盐尘云), T 型 600-1300 K (CH4 带), Y 型 <600 K (NH3 带, 最冷 ~250 K)

    半径: 简并支撑, ~0.8-1.2 Rjup 且与质量弱相关 (几乎恒定); 表面重力 log g 4.0-5.5

    冷却演化: 无稳定核能源, Teff 随年龄单调下降 — 光谱型是温度与年龄的函数, 同一 Teff 可对应不同质量-年龄组合 (质量-温度-年龄简并)

    同年龄下质量越大越热: 1 Gyr 龄 0.03-0.07 Msun 褐矮星对应 Teff ~500-1000 K 量级

    特征判据: 锂测试 (60-65 Mjup 以上可烧锂), L/T 转变 ~1200-1400 K (CO -> CH4), Y 型 NH3 吸收

    判定线索: 标褐矮星却 Teff >2500 K = M 矮星混淆; 质量 <13 Mjup = 行星 (除非注明自由漂浮行星); T 型给 2000 K 或 Y 型给 1000 K = 温度-光谱矛盾'
  source: Kirkpatrick 2005, ARA&A; Cushing et al. 2011; UNLV 光谱型表
  confidence: established
- id: white_dwarf_cooling
  title: 白矮星冷却时标与表面温度范围
  category: reference_range
