    photon_spectral_index:
      lo: 1.7
      hi: 2.7
      unit: ''
    variability_timescale:
      lo: 0.01
      hi: 1000
      unit: day
  content: '耀变体: 喷流指向观测者的射电噪 AGN, 相对论聚束使视亮度增强 ~delta^4 (多普勒因子 delta 10-50)

    分类: FSRQ (强发射线, 线等效宽度 >5 A, 高光度, 同步峰低) vs BL Lac (线弱 <5 A, 低光度, 同步峰高)

    同步峰频率分档: LSP <1e14 Hz, ISP 1e14-1e15 Hz, HSP >1e15 Hz (极端可至 1e17 Hz); 耀变体序列: 光度与同步峰频率反相关

    SED 双峰: 低能同步辐射 + 高能逆康普顿辐射, FSRQ 康普顿主导 (Compton dominance >1)

    伽马 (0.1-100 GeV) 谱指数: FSRQ 陡 (光子指数 ~2.3-2.7), BL Lac 硬 (~1.7-2.2), 以 ~1e47 erg/s 伽马光度分界

    变光时标: 小时-天-月-年多时标叠加, 日内变光 (IDV) 常见; 最短变光时标 dt 约束发射区尺寸 R < c dt delta (光速因果性)

    物理: 喷流激波加速电子产生同步+逆康普顿辐射; 观测特征: 射电噪 + 高偏振 + 强变光

    判定线索: 变光时标 <分钟级 = 需极端 delta 或观测伪影; 标 FSRQ 却无线宽 >5 A 谱线 = BL Lac 混淆; 同步峰 >1e17 Hz 与强发射线并存罕见'
  source: Fossati et al. 1998; Abdo et al. 2010 (Fermi LAT); Ghisellini et al. 2017
