  content: '超新星遗迹经历自由膨胀 → Sedov 绝热 (R ∝ t^2/5) → 辐射冷却 → 消散,

    寿命上限 ~1e5 yr。形态上分两类, 射电谱指数是核心判据 (S ∝ ν^-α):

    - 壳层型 (SNR): 陡谱 α ~ -0.8, 激波同步加速

    - 填充型 (plerion): 平谱 α ~ +0.3, 脉冲星驱动

    判定线索: 标注 SNR 却给 >1 Myr 年龄 = 与 HII 区混淆; 谱指数 +0.3 的

