  content: 'BCG (Brightest Cluster Galaxy) 是星系团中最亮的星系, 位于团密度峰 (引力中心), 常为 cD 型

    - 光度: ~10 L* (1e11-1e12 Lsun, 极端可 >1e12); M_V ~ -22 至 -24

    - 恒星质量: 1e11-1e12 Msun (cD 晕可达数倍); 有效半径 10-100 kpc (cD 外晕 > 100 kpc)

    - 位置: 居于团中心, 对应 X 射线峰与暗物质密度峰; 星系团质量 ~5e14 Msun 的团其 BCG 占比 1-5%

    - 红移: 已发现 z ~ 2 的 BCG; 低红移 BCG 普遍处于宁静演化 (星族年老)

    判定线索: 标 ''BCG'' 却非团中心/非最亮成员需复核; BCG 位置偏离 X 射线中心 > 50 kpc 多为子并合阶段 (星系团非松驰); z > 2 的 ''BCG'' 多为原星系团候选'
  source: von der Linden et al. 2007, MNRAS 379, 867; Zhao et al. 2021
