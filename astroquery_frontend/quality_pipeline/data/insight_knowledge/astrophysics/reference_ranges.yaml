  ranges:
    gw_frequency:
      lo: 10
      hi: 1000
      unit: Hz
    bbh_primary_mass:
      lo: 5
      hi: 100
      unit: Msun
    bbh_merger_rate:
      lo: 17.9
      hi: 44
      unit: Gpc^-3/yr
  content: '引力波源: 致密双星并合 (BBH/BNS/NSBH) 为地面探测器 (LIGO/Virgo/KAGRA) 的主要探测源:

    - 灵敏频带 ~10-1000 Hz (最优 ~100-300 Hz); 信号频率随旋进单调上升, 频率演化率由啁啾质量 M_c = (m1 m2)^(3/5) / (m1+m2)^(1/5) 决定

    - BBH 主星质量 5-100 Msun 全域: GWTC-3 质量分布为幂律+峰结构 (啁啾质量峰 8.3 与 27.9 Msun), ~60 Msun 以上无强抑制, 恒星起源上限 ~120 Msun (对不稳定间隙)

    - 并合总质量观测全域 ~10-150 Msun; 单次事件在带内持续 0.1-数十秒 (低质量 BNS 更长)

    - BNS 质量 1-2.5 Msun (与中子星质量分布一致); 电磁对应体 (千新星) 仅 BNS/NSBH 并合产生

    - 事件率 (90% CI): BBH 17.9-44 Gpc^-3 yr^-1 (z=0.2), BNS 10-1700, NSBH 7.8-140

    物理: 引力波频率约为轨道频率二倍 (圆轨道 f_GW = 2 f_orb); 1e2 Hz 信号对应 ~1e2 Msun 致密双星在 ~1e3 km 尺度旋进; 应变振幅 h ~ 1e-21 量级

    判定线索: 声称 GW 源却给频率 <10 Hz 或 >1e4 Hz = 与地面频带不符 (应为脉冲星计时阵或 LISA 带); BBH 总质量 >300 Msun 需怀疑非恒星起源或测量错误'
  source: Abbott et al. 2023 (GWTC-3), PRX 13, 011048; LIGO/Virgo/KAGRA 合作
