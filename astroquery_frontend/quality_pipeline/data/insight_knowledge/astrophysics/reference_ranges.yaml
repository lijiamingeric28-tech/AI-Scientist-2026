  content: '移动星群 (MGr) 是共享空间运动 (速度矢量) 的共龄恒星群, 多为已瓦解疏散星团/星协残骸, 靠运动学而非空间聚集识别

    - 年龄: 10 Myr - 1 Gyr (如 TW Hya 群 ~10 Myr, beta Pic 群 ~20-30 Myr, 大熊座流 ~300-500 Myr, 毕星团 ~600-800 Myr)

    - 距离: 近邻 20-150 pc (可探测性随距离下降, 因自行误差放大)

    - 速度: 群内速度弥散 < 5 km/s (典型 1-2 km/s); 成员星共享三维空间速度

    - 成员: 10-100 颗; 以年轻群 (有 T Tauri/星周盘成员) 与年老流 (运动学成团) 两类为主

    判定线索: 标 ''MGr'' 却成员星速度弥散 > 5 km/s 或年龄跨度 > 2 Gyr 需复核 (多为场星投影巧合); 声称同一移动星群的两星若年龄差 > 1 Gyr 亦需复查'
