  content: '星系群 (GrG) 是比星系团小一档的束缚结构, 成员星系标为 Galaxy towards a Group (GiG); 本星系群即典型群

    - 成员数: 3-50 个亮星系 (超 50 个即星系团范畴); 本星系群 ~30 余个成员

    - 速度弥散: 100-500 km/s (星系团 > 500-1000 km/s); 群质量 1e12-1e14 Msun

    - 尺度: 维里半径 0.5-1.5 Mpc (典型 ~1 Mpc)

    - 形态: 群内常含一个主导椭圆星系 (如 M87/室女群边界情形), 群际空间充满暖热气体 (微弱的 X 射线)

    判定线索: 标 ''星系群'' 却成员数 > 50 或速度弥散 > 600 km/s 需复核 (实为星系团); 声称 GiG 的星系与群红移差 > 0.01 多为背景/前景投影'
