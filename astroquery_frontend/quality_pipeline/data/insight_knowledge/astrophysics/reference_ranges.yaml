      lo: 100000000.0
      hi: 1000000000000000.0
      unit: G
    characteristic_age:
      lo: 1000.0
      hi: 10000000000.0
      unit: yr
  content: '脉冲星: 旋转供能的中子星, 自转周期-周期导数 (P-Pdot) 图将群体分为普通射电脉冲星、再循环毫秒脉冲星 (MSP) 与磁星

    - 自转周期全域 1.4 ms (最快再循环 MSP) - 8.5 s (典型最慢射电脉冲星; 个别极端源 ~23 s)

    - 表面偶极磁场 B ~ 3.2e19 (P Pdot)^(1/2) G: 再循环 MSP 1e8-1e9 G, 典型脉冲星 1e11-1e13 G (中位 ~1e12), 磁星 1e14-1e15 G (超过量子临界场 B_QED = 4.4e13 G)

    - 特征年龄 tau_c = P/(2 Pdot): 典型 1e3-1e10 yr (再循环 MSP 可大于宇宙年龄, 真实年龄被低估)

    - 自转能损 Edot = 4 pi^2 I Pdot / P^3 ~ 1e30-1e39 erg/s (磁星 Edot 低于其 X 射线光度, 能量来自磁场衰减)

    物理: 磁偶极辐射+磁层粒子加速使自转变慢; 死亡线 (射电辐射熄灭) 位于 P ~ 1-10 s (B ~ 1e12 G) 附近

    脉冲星双星定时提供最精确质量测量 (~1.4-2.1 Msun), 与周期/磁场联合可约束中子星状态方程

    判定线索: 周期 <1 ms 或磁场 <1e7 G 超出已知分布需复核; 标磁星却周期 >100 s = XDINS/白矮星混淆; 标 MSP 却 B >1e11 G 矛盾 (再循环应低场)'
  source: Manchester et al. 2005 (ATNF Pulsar Catalogue); Kaspi & Beloborodov 2017, ARA&A
  confidence: established
- id: exoplanet_atmosphere
  title: 系外行星大气参数范围
  category: reference_range
  tags:
  - exoplanet
  - atmosphere
  - hot_jupiter
  - transmission_spectrum
  hypothetical_queries:
  - 热木星 大气 平衡温度 1000 3000 K 传输光谱
  - 系外行星 大气 特征 Na K H2O CH4 CO 波长 ppm
  - 系外行星 云层 霾 光谱变平 标高 100 1000 km
  applies_to:
    fields:
    - equilibrium_temperature
    - scale_height
    - transit_depth
    - eq_temp
    entities:
    - hot_jupiter
    - exoplanet
  ranges:
    equilibrium_temperature:
      lo: 1000
      hi: 3000
      unit: K
    scale_height:
      lo: 100
      hi: 1000
      unit: km
  content: '系外行星大气探测主通道: 传输光谱 (凌星), 日食光谱与相位曲线; 热木星是信号最强的目标

    - 平衡温度: 热木星 1000-3000 K (<1000 K 为暖木星, 化学与云层发生转变; 温度由恒星辐照与热量再循环决定)

    - 传输光谱特征幅度: 10-1000 ppm (凌星深度 ~ (R_p/R_star)^2 基础上的大气差分), 随波长变化 — Na 0.589/K 0.77 um, H2O 1.4/1.9 um, CH4 3.3 um, CO 4.6 um, CO2 4.3 um

    - 标高 H = k T / (mu g) ~ 100-1000 km (热木星), 特征强度正比于 n H R_p — 冷而重的行星信号更弱

    云层与霾: 硅酸盐云 ~1500-2000 K, 铁云 ~1800-2000 K, 硫化物云 (MnS/Na2S) ~1000-1100 K — 温度决定云底; 霾使光谱变平 (吸收特征被压制)

    物理: 平衡化学由温度与 C/O 比决定; 昼夜温差可达数百 K, 相位曲线测热量再分布效率; 高温 (>2000 K) 可产生热反转 (TiO/VO 吸收)

    观测建议: 报道大气需同时给出温度、探测气体与云层约束; 传输光谱平坦无特征 = 云/霾遮挡或信号淹没

    判定线索: 标热木星大气却 Teq <500 K = 对象分类矛盾; 特征幅度 >1e4 ppm = 系统误差; 温度与主导分子不符 (如 2500 K 仅有 CH4 特征) 需检查'
  source: Seager 2010 (Exoplanet Atmospheres); Sing et al. 2016, Nature; A&A 2025 云/霾参数化
