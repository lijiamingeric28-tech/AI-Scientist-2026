  ranges:
    peak_luminosity:
      lo: 1.0e+43
      hi: 1.0e+46
      unit: erg/s
    blackbody_temperature:
      lo: 20000.0
      hi: 50000.0
      unit: K
    event_rate:
      lo: 1.0e-05
      hi: 0.0001
      unit: yr^-1/galaxy
  content: '潮汐瓦解事件 (TDE): 恒星被超大质量黑洞潮汐撕裂后吸积产生的瞬变辐射, 仅当 M_BH < Hills 极限 (~1e8 Msun) 时恒星在视界外被撕裂

    - 峰值光度 1e43-1e45 erg/s (光学/UV 典型 ~1e44, 另有热核成分), 峰值接近 Eddington 光度

    - 黑体温度 ~2-5e4 K, 下降期几乎恒定 (与超新星冷却降温不同) — 强判别特征

    - 光变: 上升数天-数十天, 衰减近似 t^(-5/3) 幂律 (恒星碎片回吸), 总持续数月-数年

    - 事件率: 1e-5 至 1e-4 每星系每年 (银河系中心预期 ~1e-4/yr), 依赖核区恒星密度与黑洞质量

    物理: 潮汐半径 R_t ~ R_star (M_BH/M_star)^(1/3) ~ 数十个史瓦西半径; 回吸时标 t_fb ~ (M_BH/1e6 Msun)^(1/2) 天至年

    多波段: X 射线 (吸积盘热), UV/光学 (回吸流再处理), 少量 (~1-10%) 产生喷流射电辐射

    判定线索: 声称 TDE 却黑体温度 >1e5 K = AGN/恒星混淆; 衰减快于 t^(-5/3) 且 <1 个月熄灭需复核; 中心黑洞 >1e8 Msun 的星系 TDE 极罕见'
  source: Gezari 2021, ARA&A; Hinkle et al. 2020, ApJ 894, L10; van Velzen et al. 2020
  confidence: established
