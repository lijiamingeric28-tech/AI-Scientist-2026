  content: '超星系团 (SCG) 是宇宙大尺度结构中的最大等级, 由若干星系团、星系群与丝状结构组成, 是银河系所在的层级 (拉尼亚凯亚 ~160 Mpc)

    - 尺度: 30-200 Mpc (典型 50-100 Mpc; 长城等墙状结构可更长)

    - 质量: 1e15-1e17 Msun; 星系数密度为场均值 ~1.5-2 倍

    - 束缚性: 大部分超星系团整体未引力束缚 (正随哈勃流膨胀), 仅内部团/群束缚; 少部分 (如 Virgo 超团核心) 部分束缚

    - 组成: 星系团 + 星系群 + 丝状/片状结构 (如 CfA 长城); 富超团可含数十个星系团

    判定线索: 标 ''supercluster'' 却尺度 < 30 Mpc 或密度 < 1.5 倍场均值需复核 (仅为星系群聚集); 声称束缚的''超星系团''需检查逃逸速度判据 (内禀速度弥散 < 哈勃流展布)'
