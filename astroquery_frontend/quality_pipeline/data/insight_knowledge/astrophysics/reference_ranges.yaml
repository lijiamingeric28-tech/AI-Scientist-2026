    - 柯伊伯带: 30-55 AU 冰质盘, 经典带 42-48 AU 分冷/热双群; 最大成员直径 ~2000 km 级; 短周期彗星 (P<200 yr) 来源

    - 主带小行星总质量 ~3e21 kg 量级 (最大个体占大头)

    物理: 尺寸-频率分布反映碰撞演化历史; 密度区分石质/冰质/碎石堆 (低密度+大尺寸 = 碎石堆, 存在大孔隙率)

    判定线索: ''彗星核'' 直径 >100 km = 与 TNO/矮行星混淆; 小行星密度 >5 g/cm3 或 <0.5 g/cm3 需复核; 柯伊伯带天体给轨道 <30 AU = 半人马/主带混淆'
  source: NASA/JPL Small Body Database; Levison & Duncan 1997; 行星科学十年调查 2023
