  content: '原星系团 (PCG) 是高红移 (z > 1.5) 的星系过密度区, 将演化为今日星系团; 因尚未完全引力束缚, 需以过密度而非维里结构识别

    - 红移: 已发现 z ~ 1.5-6 的原星系团 (z > 6 为极早期候选)

    - 过密度: 相对场星系密度增强 2-10 倍 (红移越高本底越低, 过密度判据越弱)

    - 尺度: 共动尺度 5-20 Mpc; 总质量 1e14-1e15 Msun

    - 恒星形成: SFR 密度为场区 10-100 倍; 常伴广域 Ly-alpha 发射或 CMB 前景源簇集 (SZ 效应)

    判定线索: 标 ''PCG'' 却过密度 < 2 倍需复核 (仅为大尺度结构偶然簇集); 声称原星系团却无星系成员红移证实 = 测光候选, 需谱线确认'
  source: Overzier 2016, A&ARv 24, 14
