  - brown_dwarf
  - boundary
  - fusion
  hypothetical_queries:
  - 褐矮星 质量边界 13 Mjup 氘燃烧 73 80 Mjup 氢燃烧
  - L 型 T 型 Y 型 褐矮星 温度 光谱 1300 600 K
