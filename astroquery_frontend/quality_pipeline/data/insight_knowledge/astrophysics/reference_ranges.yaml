  content: '星系对 (PaG) 是宇宙中双星系系统, 成员星系标为 Galaxy in Pair (GiP); 判据以投影分离与视向速度差为主

    - 投影分离: 10-100 kpc (典型 10-50 kpc; 强烈相互作用对 <50 kpc)

    - 视向速度差: <500-1000 km/s (动力学上关联的判据; 超过则多为投影巧合)

    - 数量占比: 局域宇宙 ~10-20% 星系处于星系对中; 并合时标 1e8-1e9 年 (密近对)

    - 演化: 密近对经历潮汐作用 → 潮汐尾/桥 → 并合成单个星系; 星系对中的恒星形成增强 2-10 倍

    判定线索: 标 ''星系对'' 却分离 > 100 kpc 或速度差 > 1000 km/s 需复核 (多为其周围星系/投影对); 两成员红移不一致 (z 差 > 0.01) 必为投影'
  source: Karachentsev 1972 (CPG); Patton et al. 2000, ApJ 536, 153
  confidence: established
