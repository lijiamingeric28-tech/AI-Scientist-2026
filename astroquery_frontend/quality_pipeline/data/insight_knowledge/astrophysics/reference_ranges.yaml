  content: '太阳系小天体: 主带小行星 (2.1-3.3 AU), 半人马 (5-30 AU), 柯伊伯带 (30-55 AU), 散射盘 (至 ~1000 AU), 奥尔特云 (2000-100000 AU)

    - 小行星直径 1-1000 km (最大 ~940 km); 累计尺寸分布 N(>D) ~ D^(-2.5) (碰撞碎解级联维持)

    - 成分: C 型 (碳质, 反照率 ~0.05, 密度 1.1-1.7 g/cm3), S 型 (石质, 反照率 ~0.2, 密度 2.5-3.5), M 型 (金属); 多数为碎石堆结构 (自转 <2 h 破碎限)

