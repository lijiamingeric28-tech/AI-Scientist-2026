  content: '空洞 (void, SIMBAD 码 vid) 是宇宙大尺度结构中星系密度显著低于平均的区域, 占据宇宙体积的大部

    - 尺度: 直径 20-100 Mpc (典型 30-50 Mpc; 巨型空洞如 Boötes 空洞 ~200 Mpc)

    - 密度: 星系密度为场均值 10-50% (密度对比 delta = -0.5 至 -0.9); 空洞体积占宇宙 ~60-80%

    - 红移: 邻近空洞 z < 0.05-0.15 (红移空间畸变使空洞中心偏移, 需重建真空间)

    - 空洞星系: 以蓝、富气、低质量矮星系为主; 鲜见亮椭圆/富团 (亮度分层效应); 空洞内星系形态偏晚型

    判定线索: 标 ''void'' 的区域内出现亮椭圆星系或富星系团需复核 (多为丝状结构误判); delta > -0.3 的区域不算空洞 (仅为欠密场)'
