    surface_temperature:
      lo: 5000
      hi: 100000
      unit: K
    cooling_timescale:
      lo: 1000000.0
      hi: 10000000000.0
      unit: yr
  content: '白矮星: 无核燃烧、仅靠储热冷却的简并天体, 是银河系可靠的宇宙时钟

    - 质量全域 0.2-1.4 Msun (单星产物主峰 ~0.6, Chandrasekhar 极限 1.4 之上塌缩), 半径 ~0.01 Rsun 与质量弱相关

    - 表面温度全域 ~5000-100000 K: 新形成白矮星 (行星状星云中心星) 可至 1e5 K, 冷却 10 Gyr 后降至 ~5000-6000 K, 最冷观测 ~3000-4000 K

    - 光度 L = 4 pi R^2 sigma Teff^4, 从 ~1e-1 降至 ~1e-5 Lsun

    冷却时标 (Mestel 律): t_cool ~ 1e7 yr (Teff/1e4 K)^(-7/2) (CO 核), 冷却到 ~5000 K 需 ~1e10 yr — 与球状星团年龄 (10-13 Gyr) 自洽

    物理: 高温端中微子能量损失主导, 低温端光子扩散; 中心 ~1e7 K 时结晶 (库仑耦合 Gamma ~ 175), 潜热+相分离释放推迟冷却 (~0.7 Msun 附近效应最强)

    包层成分影响冷却: He 大气比 H 大气冷却慢 (至多 30-50%), 薄 H 层冷却更快 — 年龄估计对包层厚度敏感

    判定线索: Teff >1e5 K 的 ''白矮星'' 多为中心星/热亚矮星混淆; 质量 >1.4 Msun 必错; 声称 5 Gyr 内冷却至 3000 K 与标准模型矛盾'
  source: Bedard et al. 2020, ApJ; Salaris et al. 2022 (BaSTI); Fontaine et al. 2001
  confidence: established
- id: pulsar_magnetar_range
  title: 脉冲星与磁星周期/磁场/年龄范围
