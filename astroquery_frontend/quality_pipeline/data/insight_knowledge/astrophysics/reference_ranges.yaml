    smbh_mass:
      lo: 1000000
      hi: 10000000000.0
      unit: Msun
  content: '黑洞质量分布横跨 ~9 个数量级, 按形成通道分三档 (恒星质量/IMBH/SMBH):

    - 恒星质量黑洞: 3-100 Msun, 大质量恒星 (初始 >20 Msun) 核心坍缩产物; X 射线双星动力学测量 5-20 Msun, 引力波观测延伸至 ~100 Msun

    - 下限 ~3 Msun (中子星 TOV 上限 ~2-3 Msun 之上); 上限受对不稳定间隙约束 — 恒星黑洞在 ~65-120 Msun 区间应缺失 (脉冲对不稳定/对不稳定超新星)

    - IMBH: 1e2-1e5 Msun, 介于恒星黑洞与 SMBH 之间, 形成通道多样 (原初核/星团动力学并合), 观测证据稀少; 引力波已见总质量 ~150 Msun 的高质量并合

    - SMBH: 1e6-1e10 Msun, 存在于星系核; M_BH-sigma 关系 M_BH ~ 1e8 (sigma/200 km/s)^4 Msun 锚定, 矮星系核可低至 1e4-1e6 Msun

    物理: 恒星端由恒星演化+超新星机制决定, 大端由吸积增长 (Eddington 限 L_Edd = 1.26e38 (M/Msun) erg/s) 与并合历史决定

    质量函数: 恒星质量黑洞每星系数百个量级, SMBH 几乎每个星系核一个, 中间质量端 (1e2-1e6 Msun) 高度不确定

    判定线索: ''恒星质量黑洞'' 给 >200 Msun = IMBH/测量混淆; ''SMBH'' 给 <1e4 Msun 需注明矮星系核候选; 1e2-1e5 Msun 区间证据稀疏, 高置信声明需独立质量测量'
  source: Ozel et al. 2010; Abbott et al. 2023; Kormendy & Ho 2013, ARA&A
