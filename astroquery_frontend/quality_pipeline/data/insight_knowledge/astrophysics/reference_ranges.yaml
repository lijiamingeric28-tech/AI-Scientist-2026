  content: 'HH 天体是年轻恒星 (YSO) 喷流中的激波激发亮结, 与 HII 区/行星状星云的本质区别在于其激波起源 (非恒星光电离)

    - 流动速度: 50-500 km/s (典型 100-300 km/s, 高速 HH 可达 500 km/s), 由天测自行或谱线多普勒测得

    - 电子密度: 1e2-1e4 cm^-3 (激波区增强, 密度随距驱动源距离下降)

    - 年龄: 1e3-1e5 年 (亮结为短寿命瞬态, 随时间演化/消失)

    - 位置: 成串分布于驱动源两侧 0.1-1 pc 内, 巨喷流可延伸至 10 pc; 与分子外流 (CO) 伴生

    光谱判据: 低电离禁线主导 (如 [S II] 6716/6731, [O I] 6300), [S II]/H-alpha 比 > 0.4 即激波激发; 若该比值 < 0.1 且无高自行成分, 则更可能是 HII 区或 PN

    判定线索: 标 ''HH 天体'' 却无激波线比或自行数据需复核; HH 位置与 YSO 无关联 (>1 pc 孤立亮结) 多为 PN/SNR 误标'
