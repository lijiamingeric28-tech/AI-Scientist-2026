  content: '相互作用星系 (IG) 指受潮汐作用影响的星系系统, 含并合前/中/后各阶段; 与孤立星系的区别在于潮汐形变特征

    - 潮汐特征: 潮汐尾/桥可延伸 10-100+ kpc; 扰动盘、环结构 (极环)、双核 (并合中晚期)

    - 恒星形成: SFR 增强 2-10 倍 (并合触发气体入流); ULIRG (L_IR > 1e12 Lsun) 大部分为并合系统

    - 时标: 并合过程 0.5-2 Gyr; 多次并合理论 (Toomre & Toomre 1972) 解释椭圆星系形成

    - 投影判据: 两成员投影分离 < 50 kpc 且速度差 < 500 km/s 为强相互作用判据

    判定线索: 标 ''相互作用'' 却无潮汐特征且分离 > 100 kpc 需复核; 单星系带 ''IG'' 标签而无可辨伴星 = 残余/后并合特征 (壳层结构) 才成立'
  source: Toomre & Toomre 1972, ApJ 178, 623; Sanders & Mirabel 1996, ARA&A 34, 749
  confidence: established
