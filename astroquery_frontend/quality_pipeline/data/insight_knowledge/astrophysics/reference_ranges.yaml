  content: '弥散星际介质按冷却函数平台分相, 各相近似压力平衡 (n T ~ 1e3 K cm^-3): 越冷越密, 越热越稀

    - CNM 冷中性: T 50-200 K, n 20-80 cm^-3, HI 21cm 吸收线示踪; 体积占比 2-4% 但质量 ~40%

    - WNM 暖中性: T 6000-10000 K, n 0.1-0.6 cm^-3, HI 21cm 发射; 体积 ~30%, 质量 ~30%

    - WIM 暖电离: T ~8000 K, n ~0.1-0.5 cm^-3, 漫射 H-alpha 示踪; 体积 20-50%

    - HIM 热电离: T 1e6-1e7 K (超新星遗迹/星风泡加热), n 1e-4 至 1e-2 cm^-3, X 射线示踪; 体积 ~50% 但质量仅 ~1%

    - 分子相: T 10-20 K, n 1e2-1e6 cm^-3, CO 示踪; 体积 <1%

    物理: 两相平衡模型 (Field 1969) + 超新星主导的热相 (McKee & Ostriker 1977); 温度 ~200-6000 K 间的中性气体极稀少 (热不稳定间隙)

    判定线索: 标 ''星际气体'' 却 n T 偏离平衡 2 个数量级需复核; 同一记录同时给 CNM 密度与 HIM 温度 = 相位混淆'
  source: McKee & Ostriker 1977; Wolfire et al. 2003; Draine 2011
