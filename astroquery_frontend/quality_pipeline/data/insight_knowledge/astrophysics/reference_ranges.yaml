  content: 'X 射线双星: 致密天体 (中子星/黑洞) + 伴星, 通过洛希瓣溢流或星风吸积供能; 按伴星质量分 LMXB/HMXB, 按喷流有无分微类星体

    - LMXB: 伴星 <1 Msun (晚期 K/M 矮星), 洛希瓣溢流, 轨道周期 0.008-12 小时 (典型数小时)

    - 多数 LMXB 为暂现源 (软 X 射线暂现源): 爆发峰值 1e38-1e39 erg/s, 宁静期 1e30-1e33 erg/s, 周期数年-数十年; 集中于银晕/核球/球状星团

    - HMXB: 伴星 >10 Msun (O/B 型), 星风吸积或瓣溢流, 轨道周期 1-100 天 (典型数天); Be 星系统偏心轨道, 周期可数百天

    - HMXB 吸积体多为磁化中子星 (X 射线脉冲星, 自转周期秒-千秒级); LMXB 中吸积体可为中子星或黑洞 (由爆发态与致密体质量区分)

    - 微类星体: 黑洞 X 射线双星 + 相对论射电喷流 (~0.1-0.9 c), 硬/软态转换伴随喷流淬灭与再活动

    物理: 吸积功率 L_acc = G M Mdot / R; Eddington 限 L_Edd ~ 1.3e38 (M/Msun) erg/s 约束光度; 轨道周期与伴星演化决定质量转移率

    判定线索: 标 LMXB 却周期 >10 天 = HMXB 混淆; 致密体质量 >3 Msun = 黑洞判据; 2-10 keV 光度 >1e39 erg/s 的 ''X 射线双星'' 多为 ULX'
  source: Tauris & van den Heuvel 2006; Liu et al. 2007 (XRB 星表); Fender 2005
