  content: '恒星外流 (out) 是年轻恒星形成期通过喷流/外流排出角动量与多余物质的过程, 是恒星形成反馈的核心机制

    - 速度: 分子外流 (CO) 10-100 km/s; 光学喷流 100-500 km/s; 致密射电喷流可达 ~1000 km/s

    - 质量流失率: 1e-7 至 1e-4 Msun/yr (与吸积率同量级, Mdot_out ~ 0.1-1 × Mdot_acc)

    - 尺度: 0.1-10 pc (巨流 HH 可 > 10 pc); 寿命 1e4-1e5 年

    - 形态: 双极结构, 与盘吸积耦合 (喷流-盘连接); 高速致密喷流 + 低速宽分子流并存 (Bachiller 1996)

    判定线索: 标 ''outflow'' 却速度 < 10 km/s 需复核 (多为云内湍流/双极泡); 声称外流的致密源若无红蓝双峰谱线或位置速度图形态证据, 需谨慎'
