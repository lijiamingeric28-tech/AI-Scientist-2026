  content: '蓝超巨星 (BSG) 是 O/B 型亮巨星, 大质量恒星主序后演化早期或回蓝阶段产物 (如参宿七 Rigel, 天津四 Deneb)

    - 有效温度: 10000-50000 K (B 型 1e4-3e4, O 型 3e4-5e4)

    - 光度: 1e4-1e6 Lsun (典型 ~1e5); 恒星质量 15-60 Msun; 半径 20-60 Rsun

    - 表面重力: log g ~ 2.0-3.5 (低于主序, 高于红超巨星)

