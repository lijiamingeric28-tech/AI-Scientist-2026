      lo: -21.0
      hi: -15.5
      unit: mag
    explosion_energy:
      lo: 1.0e+50
      hi: 1.0e+52
      unit: erg
    nickel_mass:
      lo: 0.01
      hi: 1.0
      unit: Msun
  content: '超新星按光谱分为热核型 (Ia) 与核心坍缩型 (II/Ib/Ic), 峰值星等与能量全域如下:

    - Ia: 白矮星近 Chandrasekhar 极限 (~1.4 Msun) 热核爆炸, 峰值 M_B ~ -19.3 mag (弥散 <0.3 mag, 可用 Phillips 关系标准化), 峰值光度 ~1e43 erg/s, 由 ~0.6 Msun 56Ni 衰变供能 (56Ni -> 56Co -> 56Fe), 上升 ~19 天

    - II-P: 最普遍核心坍缩型, 红超巨星前身, H 包层完整, 光变平台 ~100 天, 峰值 M_V ~ -17 mag (比 Ia 暗 ~2.3 mag)

    - II-L: 无平台、峰值后线性衰减; IIn: 窄发射线, 激波与星周物质作用, 峰值可至 -20 mag; IIb: 薄 H 壳层, 后期演化为 Ib 型

    - Ib: 失去 H 层但保留 He 层 (He I 线); Ic: H/He 均失 (Wolf-Rayet 前身, 与长暴 GRB 成协)

    能量: 核心坍缩释放引力束缚能 ~1e53 erg (99% 由中微子带走), 注入包层的动能典型 ~1e51 erg (E51 单位, 全域 1e50-1e52); 喷射速度 ~1e4 km/s

    56Ni 产量: Ia 0.1-1.0 Msun (典型 ~0.6), 核心坍缩型 0.01-0.5 Msun — 决定峰值光度与光变尾部

    物理: 光谱型由吸收线判定 (H Balmer / He I / Si II), 光变形状由包层质量与 56Ni 量共同决定

    判定线索: 峰值 M_V > -20 的 ''Ia'' 实为 IIn/超亮超新星; 动能 >1e52 erg 需复核; 无 H 谱线却标 II 型 = 类型矛盾'
  source: Filippenko 1997, ARA&A 35, 309; Phillips 1993; Richardson et al. 2014
  confidence: established
- id: gravitational_wave_sources
  title: 引力波源参考范围
  category: reference_range
