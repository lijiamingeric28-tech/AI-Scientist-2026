# ==========================================================
# quality_rules.yaml
# 数据质量规则配置
# ==========================================================

# ── 缺失值规则 ──
missing_value:
  # 允许的最大缺失率（超出则触发规范化警告）
  max_missing_rate: 0.30
  # 缺失值处理策略：drop（删除记录）/ fill_median（中位数填充）/ fill_mean（均值填充）/ mark（仅标记）
  default_strategy: "mark"

# ── 重复数据规则 ──
duplicate:
  # 是否启用精确匹配去重（基于 record_id）
  exact_match: true
  # 是否启用模糊匹配去重（基于 field_name + field_value + source_id）
  fuzzy_match: true
  # 模糊匹配置信度阈值
  fuzzy_threshold: 0.95

# ── 一致性规则 ──
consistency:
  # Schema 一致性：records 中 field_name 是否与 target_schema 对齐
  check_schema_alignment: true
  # 数据类型一致性：field_value 类型是否一致
  check_data_types: true
  # 单位一致性：同一 field_name 的单位是否统一
  check_unit_consistency: true

# ── 格式规则 ──
format:
  # 数值格式校验
  check_numeric_format: true
  # 允许的数值字符串前缀（如 "~"、"≈"、"<"、">"）
  allowed_numeric_prefixes: ["~", "≈", "<", ">", "≤", "≥"]

# ── 来源可信度规则 ──
source_reliability:
  # 是否检查来源可信度
  enabled: true
  # 优先级评分阈值（低于此值的来源标记为低可信度）
  priority_threshold: 0.5

# ── 冲突检测规则 ──
conflict_detection:
  # 同一 field_name 的值差异阈值（超出视为冲突）
  numeric_diff_threshold: 0.20  # 20% 相对差异
  # 是否检查来源间冲突
  cross_source_check: true

# ── 质量评分规则 ──
quality_scoring:
  # 各维度权重（总和 = 1.0）
  weights:
    completeness: 0.25
    consistency: 0.30
    format: 0.10
    source_reliability: 0.15
    conflict_risk: 0.20
  # 质量等级划分
  levels:
    excellent: 0.90
    good: 0.75
    fair: 0.60
    poor: 0.40

# ── 循环控制规则 ──
loop_control:
  max_iterations: 3
  # 收敛条件：连续 N 次无新冲突即终止
  no_new_conflict_rounds: 1

# ── V2.0 自适应阈值 ──
adaptive_thresholds:
  enabled: true
  field_criticality:
    critical_fields: ["yield_strength", "tensile_strength", "temperature", "density", "hardness"]
    auxiliary_fields: ["journal", "authors", "access_path", "retrieval_priority", "doi"]
    critical_completeness: 0.95
    critical_conflict: 0.10
    auxiliary_completeness: 0.70
    auxiliary_conflict: 0.30
  sample_size:
    small_n: 10
    large_n: 100
    small_n_multiplier: 0.85   # <1: 小样本放宽阈值
    large_n_multiplier: 1.0    # =1: 大样本标准阈值
  domain_tightness:
    materials_science: "precise"
    astrophysics: "exploratory"
    default: "normal"
    precise_multiplier: 0.8
    normal_multiplier: 1.0
    exploratory_multiplier: 1.3

# ── V2.0 领域自适应权重 ──
domain_weights:
  materials_science:
    completeness: 0.30
    consistency: 0.30
    format: 0.05
    source_reliability: 0.15
    conflict_risk: 0.20
  astrophysics:
    completeness: 0.15
    consistency: 0.20
    format: 0.10
    source_reliability: 0.30
    conflict_risk: 0.25
  default:
    completeness: 0.25
    consistency: 0.30
    format: 0.10
    source_reliability: 0.15
    conflict_risk: 0.20

# ── V2.0 语义类型规则 ──
semantic_types:
  temperature:
    keywords: ["temp", "temperature", "T"]
    units: ["°C", "C", "K", "F", "℃"]
    feasible_ranges:
      "°C": [-273.15, 6000]
      "C": [-273.15, 6000]
      "K": [0, 6273]
  mechanical_stress:
    keywords: ["strength", "stress", "yield", "tensile"]
    units: ["MPa", "GPa", "psi", "ksi"]
    feasible_ranges:
      "MPa": [0, 5000]
      "GPa": [0, 500]
  density:
    keywords: ["density", "rho", "ρ"]
    units: ["g/cm^3", "g/cm³", "kg/m^3"]
    feasible_ranges:
      "g/cm^3": [0.5, 22.6]
