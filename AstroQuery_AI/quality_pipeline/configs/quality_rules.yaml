# ==========================================================
# quality_rules.yaml — 材料科学领域完整配置
# ==========================================================

# ── 质量评分规则 (M-36: 仅作兜底权重; 运行时阈值见 quality_scoring_runtime 段) ──
quality_scoring:
  weights:
    completeness: 0.25
    consistency: 0.30
    format: 0.10
    source_reliability: 0.15
    conflict_risk: 0.20
  levels:
    excellent: 0.90
    good: 0.75
    fair: 0.60
    poor: 0.40

# ── 质量评分运行参数 (A11 fix: 原硬编码在 agent 代码里的阈值全部下沉) ──
# 消费方: quality_scoring_agent / decision_reasoning_agent / quality_scoring.py
# 注意: 与上方 quality_scoring 段 (weights) 是不同键, 避免冲突;
#       行内注释一律放在 flow sequence 闭合符之后 (否则 } 会被注释吞掉)
quality_scoring_runtime:
  volume_thresholds: {10: 0.3, 100: 0.7, else: 0.9}  # 记录数 n<10 → 0.3, n<100 → 0.7, 其余 → 0.9
  agreement_std_coef: 2.0        # agreement = max(0.3, 1 - score_std × coef)
  repair_cost:                   # per-source 修复成本计数阈值 [medium 下限, high 下限]
    anomaly: [1, 3]              # anomaly_count >= 1 → medium, >= 3 → high
    issues: [3, 10]              # issue_count >= 3 → medium, >= 10 → high
  extraction_human_threshold: 0.3  # extraction score < 0.3 → HumanReview
  conflict_severity: {critical: 1.0, high: 0.7, medium: 0.4, low: 0.2}  # A3 severity 权重
  level_thresholds: {excellent: 0.90, good: 0.75, fair: 0.60}  # overall >= 阈值即该级, 否则 poor

# ── 循环控制规则 (V3.5: routers.py 从这里加载, 单一配置入口) ──
loop_control:
  # M2 fix: max_iterations 是纯兜底 (总访问上限), B⇄C 实际轮数由 max_loop 控制;
  # 原 3 对每次 loop_controller 访问计数 (含首次 A→B), B⇄C 实际只能 1 轮
  max_iterations: 8
  max_retries: 3
  max_loop: 3
  no_new_conflict_rounds: 1

# ── V2.0 自适应阈值 ──
adaptive_thresholds:
  enabled: true
  field_criticality:
    critical_fields:
      - "yield_strength"
      - "tensile_strength"
      - "temperature"
      - "strain_rate"
      - "density"
      - "material"
    important_fields:
      - "elongation"
      - "hardness"
      - "fatigue_life"
      - "fracture_toughness"
      - "thermal_conductivity"
    auxiliary_fields:
      - "journal"
      - "authors"
      - "access_path"
      - "retrieval_priority"
      - "doi"
    critical_completeness: 0.95
    important_completeness: 0.90
    auxiliary_completeness: 0.70
    critical_conflict: 0.10
    important_conflict: 0.15
    auxiliary_conflict: 0.30
  sample_size:
    small_n: 10
    large_n: 100
    small_n_multiplier: 0.85
    large_n_multiplier: 1.0
  domain_tightness:
    # M-31 fix: 乘子方向修正 — 探索性科学更宽松 (阈值更低, 乘子<1),
    # 精确定量科学更严格 (阈值更高, 乘子>1); 旧配置方向与语义相反
    # (天体物理 exploratory 乘 1.30 反而被要求更高覆盖度)
    materials_science: "precise"
    astrophysics: "exploratory"
    biology: "normal"
    chemistry: "precise"
    default: "normal"
    precise_multiplier: 1.30
    normal_multiplier: 1.00
    exploratory_multiplier: 0.80

# ── V2.0 领域自适应权重 ──
# A2 fix: 每领域补 extraction_quality 维度并重归一化 (和=1) — 此前 metrics 传 6 维
# 但权重只有 5 维, extraction_quality 被 compute_quality_score 静默丢弃
domain_weights:
  materials_science:
    completeness: 0.26
    consistency: 0.26
    format: 0.05
    source_reliability: 0.13
    conflict_risk: 0.18
    extraction_quality: 0.12
  astrophysics:
    completeness: 0.12
    consistency: 0.15
    format: 0.10
    source_reliability: 0.25
    conflict_risk: 0.23
    extraction_quality: 0.15
  chemistry:
    completeness: 0.22
    consistency: 0.22
    format: 0.13
    source_reliability: 0.13
    conflict_risk: 0.18
    extraction_quality: 0.12
  biology:
    completeness: 0.18
    consistency: 0.22
    format: 0.13
    source_reliability: 0.18
    conflict_risk: 0.17
    extraction_quality: 0.12
  default:
    completeness: 0.20
    consistency: 0.24
    format: 0.10
    source_reliability: 0.15
    conflict_risk: 0.19
    extraction_quality: 0.12

# ── V2.1 语义类型: 材料科学完整规则库 ──
semantic_types:
  temperature:
    keywords: ["temp", "temperature", "T"]
    units: ["°C", "C", "K", "F", "℃"]
    feasible_ranges:
      "°C": [-273.15, 6000]
      "C": [-273.15, 6000]
      "K": [0, 6273]
      "F": [-459.67, 10832]
      "℃": [-273.15, 6000]
    expected_in_study: "always"   # 材料力学测试必报

  mechanical_stress:
    keywords: ["strength", "stress", "yield", "tensile", "compressive", "ultimate", "fatigue_strength"]
    units: ["MPa", "GPa", "Pa", "psi", "ksi", "N/mm²"]
    feasible_ranges:
      "MPa": [0, 5000]
      "GPa": [0, 500]
      "Pa": [0, 5000000000]
      "psi": [0, 725000]
      "ksi": [0, 725]
    expected_in_study: "always"

  elongation:
    keywords: ["elongation", "strain", "elong", "EL", "ductility"]
    units: ["%", "mm/mm", "in/in", "fraction"]
    feasible_ranges:
      "%": [0, 100]
      "mm/mm": [0, 1.0]
      "fraction": [0, 1.0]
    expected_in_study: "usually"

  hardness:
    keywords: ["hardness", "HV", "HRC", "HB", "Vickers", "Brinell", "Rockwell", "microhardness"]
    units: ["HV", "HRC", "HB", "GPa", "MPa"]
    feasible_ranges:
      "HV": [1, 3000]
      "HRC": [0, 70]
      "HB": [1, 800]
      "GPa": [0.01, 30]
    expected_in_study: "usually"

  strain_rate:
    keywords: ["strain_rate", "strain rate", "rate", "ε_dot", "deformation_rate"]
    units: ["s^-1", "s⁻¹", "/s", "1/s", "s-1", "min^-1"]
    feasible_ranges:
      "s^-1": [1e-10, 1e8]
      "s⁻¹": [1e-10, 1e8]
      "min^-1": [1e-9, 1e9]
    expected_in_study: "conditional"  # 仅动态测试需要

  density:
    keywords: ["density", "rho", "ρ", "specific_weight"]
    units: ["g/cm^3", "g/cm³", "kg/m^3", "kg/m³", "lb/in³"]
    feasible_ranges:
      "g/cm^3": [0.5, 22.6]
      "g/cm³": [0.5, 22.6]
      "kg/m^3": [500, 22600]
      "kg/m³": [500, 22600]
    expected_in_study: "usually"

  thermal_conductivity:
    keywords: ["thermal_conductivity", "thermal conductivity", "k_thermal", "heat_conductivity"]
    units: ["W/mK", "W/(m·K)", "W/m·K", "W/cmK"]
    feasible_ranges:
      "W/mK": [0.01, 2500]
    expected_in_study: "optional"

  fatigue_life:
    keywords: ["fatigue", "cycles", "N_f", "fatigue_life", "cycles_to_failure"]
    units: ["cycles", "N", "log_cycles"]
    feasible_ranges:
      "cycles": [1, 1e10]
      "log_cycles": [0, 10]
    expected_in_study: "conditional"  # 仅疲劳研究需要

  fracture_toughness:
    keywords: ["fracture", "toughness", "K_IC", "KIC", "J_IC", "CTOD"]
    units: ["MPa√m", "MPa·m^0.5", "ksi√in", "kJ/m²"]
    feasible_ranges:
      "MPa√m": [0.1, 300]
      "MPa·m^0.5": [0.1, 300]
    expected_in_study: "conditional"  # 仅断裂研究需要

  grain_size:
    keywords: ["grain", "grain_size", "d_grain", "ASTM"]
    units: ["μm", "nm", "ASTM"]
    feasible_ranges:
      "μm": [0.01, 1000]
      "nm": [1, 10000]
    expected_in_study: "optional"

  material:
    keywords: ["material", "alloy", "composition", "sample", "specimen"]
    units: []   # 无单位 (字符串)
    feasible_ranges: {}
    expected_in_study: "always"

# ==========================================================
# quality_rules.yaml — 天体物理领域扩展配置
# 使用方法: 合并到 quality_rules.yaml 中, 或设置 research_domain=astrophysics
# ==========================================================

# ── 天体物理语义类型: 完整规则库 ──
semantic_types_astrophysics:
  redshift:
    keywords: ["redshift", "z", "spectroscopic_redshift", "photometric_redshift", "z_spec", "z_phot"]
    units: [""]
    feasible_ranges:
      "": [-0.01, 20.0]
    unit_category: "redshift"
    expected_in_study: "usually"

  luminosity:
    keywords: ["luminosity", "L", "bolometric_luminosity", "L_bol", "L_star", "L_x", "xray_luminosity", "L_sun"]
    units: ["erg/s", "Lsun", "L☉", "W", "erg s^-1", "10^33 erg/s", "solLum", "1e+37W"]
    feasible_ranges:
      "erg/s": [1e25, 1e45]
      "Lsun": [1e-5, 1e7]
    unit_category: "luminosity"
    expected_in_study: "usually"

  parallax:
    keywords: ["parallax", "pi", "ϖ", "trigonometric_parallax", "plx"]
    units: ["mas", "arcsec", "μas"]
    feasible_ranges:
      "mas": [-10, 1000]
      "arcsec": [-0.01, 1.0]
      "μas": [-10000, 1000000]
    unit_category: "parallax"
    expected_in_study: "always"

  effective_temperature:
    keywords: ["teff", "T_eff", "effective_temperature", "temperature", "T", "temp"]
    units: ["K"]
    feasible_ranges:
      "K": [500, 300000]
    unit_category: "temperature"
    expected_in_study: "always"

  surface_gravity:
    keywords: ["log_g", "logg", "surface_gravity", "log g", "gravity"]
    units: ["dex", "cm/s^2", "cm/s²", "log(cm.s**-2)", "log(cm s**-2)"]
    feasible_ranges:
      "dex": [-1.0, 8.0]
      "cm/s^2": [0.1, 1e8]
    unit_category: "surface_gravity"
    expected_in_study: "usually"

  metallicity:
    keywords: ["metallicity", "fe_h", "fe/h", "[Fe/H]", "[M/H]", "iron_abundance", "metal", "Z"]
    units: ["dex", "", "Sun", "log(Sun)"]
    feasible_ranges:
      "dex": [-5.0, 1.0]
    # M-35 fix: 与转换组对齐 — [Fe/H] 以太阳丰度为单位属 abundance 组
    # (unit_conversions_astrophysics.abundance 含 dex/Sun/log(Sun) 全量),
    # 原 unit_category=metallicity 只含 dex, Sun/log(Sun) 永远无法转换
    unit_category: "abundance"
    expected_in_study: "usually"

  alpha_abundance:
    keywords: ["alpha_fe", "alpha/fe", "α/Fe", "[α/Fe]", "alpha_to_iron", "Mg/Fe", "Si/Fe"]
    units: ["dex", ""]
    feasible_ranges:
      "dex": [-0.5, 1.0]
    unit_category: "metallicity"
    expected_in_study: "optional"

  stellar_mass:
    keywords: ["mass", "M", "stellar_mass", "M_star", "M_sun", "M☉", "Msun"]
    units: ["Msun", "M☉", "M_sun", "kg", "g", "solMass", "1e+14solMass"]
    feasible_ranges:
      "Msun": [0.01, 350]
      "kg": [2e28, 7e32]
    unit_category: "mass"
    expected_in_study: "usually"

  stellar_radius:
    keywords: ["radius", "R", "stellar_radius", "R_star", "R_sun", "R☉", "Rsun"]
    units: ["Rsun", "R☉", "R_sun", "cm", "m", "km", "solRad"]
    feasible_ranges:
      "Rsun": [0.01, 2000]
      "cm": [7e8, 1.4e14]
    unit_category: "radius"
    expected_in_study: "usually"

  radial_velocity:
    keywords: ["radial_velocity", "RV", "V_r", "Vr", "V_rad", "systemic_velocity", "V_sys", "heliocentric_velocity"]
    units: ["km/s", "km s^-1", "m/s", "km s⁻¹"]
    feasible_ranges:
      "km/s": [-5000, 5000]
      "km s^-1": [-5000, 5000]
    unit_category: "velocity"
    expected_in_study: "usually"

  rotational_velocity:
    keywords: ["v_sin_i", "vsini", "v_sini", "rotational_velocity", "V_rot", "projected_rotation", "vsin_i"]
    units: ["km/s", "km s^-1", "km s⁻¹"]
    feasible_ranges:
      "km/s": [0, 600]
      "km s^-1": [0, 600]
    unit_category: "velocity"
    expected_in_study: "optional"

  proper_motion_ra:
    keywords: ["pm_ra", "pmra", "μ_α", "proper_motion_ra", "PM_RA", "pmra_corr"]
    units: ["mas/yr", "mas yr^-1", "mas/year", "arcsec/yr"]
    feasible_ranges:
      "mas/yr": [-10000, 10000]
    unit_category: "proper_motion"
    expected_in_study: "conditional"

  proper_motion_dec:
    keywords: ["pm_dec", "pmdec", "μ_δ", "proper_motion_dec", "PM_Dec", "pmdec_corr"]
    units: ["mas/yr", "mas yr^-1", "mas/year", "arcsec/yr"]
    feasible_ranges:
      "mas/yr": [-10000, 10000]
    unit_category: "proper_motion"
    expected_in_study: "conditional"

  distance:
    keywords: ["distance", "d", "dist", "heliocentric_distance", "D"]
    units: ["pc", "kpc", "Mpc", "Gpc", "ly", "light_year", "AU", "m"]
    feasible_ranges:
      "pc": [0.1, 1e10]
      "kpc": [0.0001, 1e7]
      "Mpc": [1e-7, 10000]
    unit_category: "distance"
    expected_in_study: "usually"

  age:
    keywords: ["age", "t", "stellar_age", "tau", "lifetime", "age_gyr"]
    # 2026-08-24: 纳入 log(yr) (10^x 还原由 unit_conversions 配置标记驱动);
    # 可行域补齐 yr 域 (PropertySpec 标准单位 = yr); Gyr 下限 0.001 防
    # 双换算产物 (1e-7 等) 混入
    units: ["Gyr", "Myr", "yr", "years", "Ga", "log(yr)"]
    feasible_ranges:
      "Gyr": [0.001, 13.8]
      "Myr": [0.1, 13800]
      "yr": [100000, 13800000000]
      "log(yr)": [6.0, 10.2]
    unit_category: "age"
    expected_in_study: "optional"

  extinction:
    keywords: ["extinction", "A_V", "Av", "E_BV", "E(B-V)", "reddening", "A_K", "interstellar_extinction"]
    units: ["mag", "", "magnitudes"]
    feasible_ranges:
      "mag": [0.0, 50.0]
    unit_category: "extinction"
    expected_in_study: "optional"

  apparent_magnitude:
    keywords: ["apparent_magnitude", "V_mag", "B_mag", "G_mag", "magnitude", "mag", "V", "B", "G", "K_mag", "J_mag", "H_mag"]
    units: ["mag", "magnitudes", ""]
    feasible_ranges:
      "mag": [-5.0, 35.0]
    unit_category: "magnitude"
    expected_in_study: "usually"

  absolute_magnitude:
    keywords: ["absolute_magnitude", "M_V", "M_B", "M_G", "M_K", "absolute_mag", "abs_mag"]
    units: ["mag", "magnitudes", ""]
    feasible_ranges:
      "mag": [-10.0, 25.0]
    unit_category: "magnitude"
    expected_in_study: "optional"

  orbital_period:
    keywords: ["period", "P", "orbital_period", "P_orb", "rotation_period", "P_rot"]
    units: ["d", "days", "hr", "hours", "yr", "years", "s", "seconds"]
    feasible_ranges:
      "d": [0.01, 1e9]
    unit_category: "period"
    expected_in_study: "conditional"

  planet_radius:
    keywords: ["planet_radius", "R_p", "Rp", "R_planet", "radius_planet", "R_Earth", "R_Jupiter"]
    units: ["R_earth", "R_jup", "R⊕", "RJ", "km", "m", "cm"]
    feasible_ranges:
      "R_earth": [0.1, 30]
      "R_jup": [0.01, 3]
    # V4.2 fix: 独立 category — 原 "radius" 与恒星 radius 组撞车,
    # km/m 会命中恒星组因子 (1.4374e-6) 而非行星组 (1.5698e-4), 差 ~109x
    unit_category: "planet_radius"
    expected_in_study: "conditional"

  planet_mass:
    keywords: ["planet_mass", "M_p", "Mp", "M_planet", "mass_planet", "M_Earth", "M_Jupiter", "M_sini"]
    units: ["M_earth", "M_jup", "M⊕", "MJ", "kg", "g"]
    feasible_ranges:
      "M_earth": [0.001, 10000]
      "M_jup": [0.0001, 30]
    # V4.2 fix: 独立 category — 原 "mass" 与恒星 mass 组撞车,
    # kg/g 会命中恒星组因子 (5.0292e-31) 而非行星组 (1.6744e-25), 差 ~3.3e5x
    unit_category: "planet_mass"
    expected_in_study: "conditional"

  # V4 fix: catalog 原始列 catch-all (schema_mapping 的 database_catalog_properties)。
  # 此前无该类规则, 单字母关键词 ('L'/'M') 子串误命中 → 误判为 luminosity/mass,
  # out_of_range 误报。此规则以 3 个关键词命中压过 score=1 的误判。
  catalog_metadata:
    keywords: ["database_catalog_properties", "catalog", "properties", "raw_column", "raw_metadata"]
    units: []
    feasible_ranges: {}
    unit_category: "catalog"
    expected_in_study: "conditional"

  # ── V4.2 扩展: 单位体系丰富 (IAU 2015 B3 / CDS catstd / CODATA 2018 锚点) ──
  # 键序在 catalog_metadata 之后, 保持 catalog catch-all 优先; 单字母关键词整串相等。
  flux_density:
    keywords: ["flux_density", "flux", "peak_flux", "integrated_flux", "S_60", "S60", "S_25", "S25", "S_100", "S100", "S_Jy", "F_nu", "f_nu", "flux_jy"]
    units: ["Jy", "mJy", "uJy", "μJy", "nJy"]
    feasible_ranges:
      "Jy": [0.0, 100000.0]
      "mJy": [0.0, 1e8]
      "uJy": [0.0, 1e11]
    unit_category: "flux_density"
    expected_in_study: "conditional"

  dispersion_measure:
    keywords: ["dispersion_measure", "dispersion", "dm", "DispersionMeasure"]
    units: ["cm^-3 pc", "pc cm^-3"]
    feasible_ranges:
      "cm^-3 pc": [0.0, 5000.0]
    unit_category: "dispersion_measure"
    expected_in_study: "conditional"

  rotation_measure:
    keywords: ["rotation_measure", "rm", "faraday_rotation", "faraday"]
    units: ["rad/m^2", "rad m^-2"]
    feasible_ranges:
      "rad/m^2": [-10000.0, 10000.0]
    unit_category: "rotation_measure"
    expected_in_study: "conditional"

  frequency:
    keywords: ["frequency", "freq", "observing_frequency", "center_frequency", "band_center", "rest_frequency", "frequency_mhz"]
    units: ["Hz", "kHz", "MHz", "GHz", "THz"]
    feasible_ranges:
      "GHz": [0.0, 1e12]
      "MHz": [0.0, 1e15]
    unit_category: "frequency"
    expected_in_study: "conditional"

  energy:
    keywords: ["energy", "photon_energy", "E_photon", "band_energy", "energy_kev", "photon_energy_kev"]
    units: ["erg", "J", "eV", "keV", "MeV", "GeV", "TeV"]
    feasible_ranges:
      "keV": [0.0, 1e9]
      "erg": [0.0, 1e50]
    unit_category: "energy"
    expected_in_study: "conditional"

  magnetic_field:
    keywords: ["magnetic_field", "B_field", "B_field_gauss", "magnetic_strength", "field_strength", "Bmag"]
    units: ["G", "mG", "uG", "μG", "nG", "kG", "T", "nT"]
    feasible_ranges:
      "G": [0.0, 1e15]
      "T": [0.0, 1e11]
    unit_category: "magnetic_field"
    expected_in_study: "conditional"

  pressure:
    keywords: ["pressure", "gas_pressure", "thermal_pressure", "ram_pressure", "p_thermal"]
    units: ["Pa", "hPa", "kPa", "bar", "mbar", "atm", "dyn/cm^2", "dyn cm^-2"]
    feasible_ranges:
      "Pa": [0.0, 1e16]
      "bar": [0.0, 1e11]
    unit_category: "pressure"
    expected_in_study: "conditional"

  density:
    keywords: ["density", "rho", "mass_density", "electron_density", "n_e", "n_H", "number_density", "surface_density"]
    # M-35 fix: 移除 pc**-2/mas**-2 — 面密度单位属 surface_density 转换组,
    # 不在 density 组内 (unit_converter 按 (category, unit) 查表必 miss,
    # 且 inference 误认 unit_recognized 后以非标准单位静默导出)
    units: ["g/cm^3", "g cm^-3", "kg/m^3", "amu/cm^3"]
    feasible_ranges:
      "g/cm^3": [1e-30, 1e15]
      "kg/m^3": [1e-27, 1e18]
    unit_category: "density"
    expected_in_study: "conditional"

  angle:
    keywords: ["angular_size", "angular_separation", "separation", "beam", "beam_size", "fwhm", "psf", "position_angle", "theta", "major_axis", "minor_axis", "angular_diameter", "diameter", "size"]
    units: ["deg", "degree", "degrees", "arcmin", "arcsec", "mas", "rad"]
    feasible_ranges:
      "deg": [0.0, 360.0]
      "arcsec": [0.0, 1296000.0]
    unit_category: "angle"
    expected_in_study: "conditional"

  wavelength:
    keywords: ["wavelength", "lambda", "rest_wavelength", "observed_wavelength", "waveband", "lambda_max"]
    units: ["nm", "Å", "angstrom", "um", "μm", "mm", "um**-1"]
    feasible_ranges:
      "nm": [0.0, 1e9]
    unit_category: "wavelength"
    expected_in_study: "conditional"

# ── 天体物理实体类型: Simbad otypes.list 全量 (V4) ──
# 理论依据: otypes.list (2026-07-30, Strasbourg); 名称/层级对齐官方分类
# 消费方: tools/insight/entity_types.py (normalize/infer/ancestors/typical_range)
entity_types_astrophysics:
  version: "1.0"
  source: "Simbad otypes.list, generated 2026-07-30"
  categories:
    stars: stars
    star_sets: star_sets
    ism: ism
    galaxies: galaxies
    galaxy_sets: galaxy_sets
    gravitation: gravitation
    spectral: spectral
    misc: misc
  default_entity_type: galaxy
  # ── 推断映射 (context_builder 消费): DB 目录 → 实体类型 (vizier_table_id 前缀) ──
  catalog_inference:
    "III/135A": star      # HD 恒星目录
    "II/125": galaxy      # IRAS PSC
    "VII/237": galaxy     # HYPERLEDA
    "VII/26D": galaxy     # UGC
    "VII/233": galaxy     # 2MASS XSC
  # ── 字段名精确匹配 → 实体类型 (优先级 2) ──
  field_inference:
    distance: galaxy
    metallicity: galaxy
    stellar_mass: galaxy
    mass: galaxy
    extinction: galaxy
    radial_velocity: galaxy
    redshift: galaxy
    sp_t: star
    spectral_type: star
